<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Helvetica Neue', 'Menlo', 'SF Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="44" fill="white" font-size="18" font-weight="700">一次 close(fd) 的开销都花在哪儿</text>
  <text x="40" y="68" fill="#94a3b8" font-size="11">close 本体逻辑极短，真正的成本是「进出内核」这道门 —— 与 CPU 算力无关</text>

  <!-- 箭头先画 -->
  <line x1="450" y1="176" x2="450" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="392" x2="450" y2="428" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 1: 用户态代码 -->
  <rect x="60" y="96" width="780" height="80" rx="8" fill="#0f172a"/>
  <rect x="60" y="96" width="780" height="80" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="80" y="122" fill="#22d3ee" font-size="12" font-weight="600">① 用户态代码</text>
  <text x="80" y="146" fill="#e2e8f0" font-size="11">for (fd = 0; fd &lt; rlim_cur; fd++)  close(fd);</text>
  <text x="80" y="166" fill="#94a3b8" font-size="9">绝大多数 fd 根本不存在 → 内核直接返回 EBADF；但每次循环都要陷入内核一次</text>

  <text x="462" y="200" fill="#94a3b8" font-size="9">每次循环触发一次 syscall 陷入</text>

  <!-- Box 2: 切换开销（核心，rose 高亮） -->
  <rect x="60" y="212" width="780" height="180" rx="8" fill="#0f172a"/>
  <rect x="60" y="212" width="780" height="180" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.8"/>
  <text x="80" y="238" fill="#fb7185" font-size="12" font-weight="600">② 用户态 ↔ 内核态切换（syscall entry / exit）—— 固定「过路费」，S5 上最贵</text>

  <rect x="80" y="252" width="360" height="56" rx="6" fill="#0f172a"/>
  <rect x="80" y="252" width="360" height="56" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="260" y="276" fill="white" font-size="11" font-weight="600" text-anchor="middle">进入内核前</text>
  <text x="260" y="296" fill="#fbbf24" font-size="9" text-anchor="middle">切 CR3 页表（KPTI）+ 冲刷 TLB</text>

  <rect x="460" y="252" width="360" height="56" rx="6" fill="#0f172a"/>
  <rect x="460" y="252" width="360" height="56" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="640" y="276" fill="white" font-size="11" font-weight="600" text-anchor="middle">返回用户态时</text>
  <text x="640" y="296" fill="#fbbf24" font-size="9" text-anchor="middle">TLB 重新填充 + VERW 清缓冲区</text>

  <rect x="80" y="320" width="740" height="56" rx="6" fill="#0f172a"/>
  <rect x="80" y="320" width="740" height="56" rx="6" fill="rgba(30,41,59,0.6)" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="344" fill="#e2e8f0" font-size="10">S5(Cascade Lake) 需 KPTI 缓解 Meltdown → 每次进出内核都要切页表 + 刷 TLB</text>
  <text x="100" y="364" fill="#fb7185" font-size="11" font-weight="600">单次切换额外开销 ≈ 老 Intel 独有的 +几十~上百 ns（AMD / Ice Lake 免疫，无此税）</text>

  <!-- Box 3: 内核 close 逻辑 -->
  <rect x="60" y="428" width="780" height="80" rx="8" fill="#0f172a"/>
  <rect x="60" y="428" width="780" height="80" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="80" y="454" fill="#34d399" font-size="12" font-weight="600">③ 内核里真正的 close 逻辑</text>
  <text x="80" y="478" fill="#e2e8f0" font-size="11">查 fd 表 → 大多为空 → 返回 EBADF（纳秒级，各机型几乎一样）</text>
  <text x="80" y="498" fill="#94a3b8" font-size="9">这一步不是瓶颈，S5 和 AMD / Ice Lake 在这里没有差别</text>

  <!-- 结论条 -->
  <rect x="60" y="536" width="780" height="72" rx="10" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.2"/>
  <text x="80" y="564" fill="#34d399" font-size="12" font-weight="700">结论</text>
  <text x="80" y="590" fill="#fbbf24" font-size="12" font-weight="600">差距不在「算力 / 主频」，而在 ② 每次 syscall 的进出门开销 —— naive 跑满 rlim_cur 次，把这笔税放大到极致</text>
</svg>
