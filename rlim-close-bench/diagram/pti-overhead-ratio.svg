<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Helvetica Neue', 'Menlo', 'SF Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="46" fill="white" font-size="18" font-weight="700">S5 (Cascade Lake) 的 PTI 固定税：占比因 syscall 而异</text>
  <text x="40" y="70" fill="#94a3b8" font-size="11" font-weight="400">每次进出内核多付一笔约 +100ns 的 PTI 税（切 CR3 + 冲刷 TLB）。分母越小，越致命。</text>

  <line x1="40" y1="90" x2="860" y2="90" stroke="#1e293b" stroke-width="1"/>

  <!-- 图例 -->
  <rect x="520" y="106" width="16" height="12" rx="2" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="544" y="116" fill="#94a3b8" font-size="10">syscall 本体耗时</text>
  <rect x="690" y="106" width="16" height="12" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="714" y="116" fill="#94a3b8" font-size="10">PTI 额外税</text>

  <!-- 通用尺度：条总宽 560px 对应各自 100% -->

  <!-- Row 1: close 空 fd -->
  <text x="40" y="164" fill="white" font-size="12" font-weight="600">close 空 fd</text>
  <text x="40" y="180" fill="#94a3b8" font-size="9">~380ns / 次</text>
  <rect x="230" y="150" width="336" height="34" rx="4" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="398" y="172" fill="white" font-size="10" font-weight="600" text-anchor="middle">本体 ~230ns</text>
  <rect x="566" y="150" width="224" height="34" rx="4" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="678" y="172" fill="white" font-size="10" font-weight="600" text-anchor="middle">税 ~40%</text>

  <!-- Row 2: getpid -->
  <text x="40" y="230" fill="white" font-size="12" font-weight="600">getpid</text>
  <text x="40" y="246" fill="#94a3b8" font-size="9">~250ns / 次</text>
  <rect x="230" y="216" width="196" height="34" rx="4" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="328" y="238" fill="white" font-size="10" font-weight="600" text-anchor="middle">本体</text>
  <rect x="426" y="216" width="364" height="34" rx="4" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="608" y="238" fill="white" font-size="10" font-weight="600" text-anchor="middle">税 ~65%（最惨）</text>

  <!-- Row 3: read 4KB -->
  <text x="40" y="296" fill="white" font-size="12" font-weight="600">read 4KB</text>
  <text x="40" y="312" fill="#94a3b8" font-size="9">~2µs / 次</text>
  <rect x="230" y="282" width="532" height="34" rx="4" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="496" y="304" fill="white" font-size="10" font-weight="600" text-anchor="middle">本体 ~1.9µs</text>
  <rect x="762" y="282" width="28" height="34" rx="4" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="776" y="333" fill="#34d399" font-size="9" font-weight="500" text-anchor="middle">~5%</text>

  <!-- Row 4: write IO -->
  <text x="40" y="362" fill="white" font-size="12" font-weight="600">write 磁盘/网络</text>
  <text x="40" y="378" fill="#94a3b8" font-size="9">~50µs+ / 次</text>
  <rect x="230" y="348" width="554" height="34" rx="4" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="507" y="370" fill="white" font-size="10" font-weight="600" text-anchor="middle">本体（真正的 IO / 阻塞）</text>
  <rect x="784" y="348" width="6" height="34" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="787" y="399" fill="#34d399" font-size="9" font-weight="500" text-anchor="middle">&lt;1%</text>

  <line x1="40" y1="418" x2="860" y2="418" stroke="#1e293b" stroke-width="1"/>

  <!-- 结论区 -->
  <rect x="40" y="440" width="820" height="150" rx="12" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.2"/>
  <text x="60" y="468" fill="#34d399" font-size="13" font-weight="700">规律</text>
  <text x="60" y="494" fill="#e2e8f0" font-size="11">· 轻量 + 高频 syscall（close / getpid / gettid / futex 空转）→ 受伤最重</text>
  <text x="60" y="518" fill="#e2e8f0" font-size="11">· 重量级 syscall（大块 IO、真正阻塞）→ 税被淹没，基本无感</text>
  <text x="60" y="542" fill="#e2e8f0" font-size="11">· 纯用户态计算不进内核 → PTI 完全不参与，零影响</text>
  <text x="60" y="572" fill="#fbbf24" font-size="12" font-weight="600">→ S5 的问题是「syscall 频率税」，不是「每个业务都慢一截」；优化应减少 syscall 次数（close_range / io_uring / sendmmsg）</text>
</svg>
