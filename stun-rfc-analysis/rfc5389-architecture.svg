<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 940">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="520" y="34" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 5389 架构定位 — STUN 作为"工具"被上层使用</text>
<text x="520" y="52" fill="#64748b" font-size="9" text-anchor="middle">STUN Agent = STUN Client + STUN Server 两种角色，嵌入更大的解决方案中</text>

<!-- ===== 分层架构 ===== -->
<text x="60" y="84" fill="#0f172a" font-size="11" font-weight="700">一、协议分层: STUN 是底层工具，ICE/SIP/TURN 是它的"使用者(STUN Usage)"</text>

<!-- Usage layer -->
<rect x="60" y="96" width="920" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="80" y="118" fill="#1e40af" font-size="10" font-weight="700">上层使用者 (STUN Usages)</text>
<rect x="90" y="126" width="180" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="180" y="146" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">ICE (连接性建立)</text>
<rect x="290" y="126" width="180" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="380" y="146" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">SIP Outbound</text>
<rect x="490" y="126" width="180" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="580" y="146" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">TURN (中继扩展)</text>
<rect x="690" y="126" width="270" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="825" y="146" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">NAT行为发现 / WebRTC</text>

<line x1="520" y1="166" x2="520" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="180" fill="#64748b" font-size="8">调用 STUN 的 Binding 等方法</text>

<!-- STUN core layer -->
<rect x="60" y="188" width="920" height="64" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="80" y="210" fill="#5b21b6" font-size="10" font-weight="700">STUN 核心 (RFC 5389) — 只提供机制，不做决策</text>
<text x="90" y="232" fill="#475569" font-size="9">提供: 消息格式 | Binding 方法 | 事务管理 | 认证(短期/长期凭证) | 完整性校验 | 可扩展属性框架</text>
<text x="90" y="246" fill="#dc2626" font-size="9" font-weight="600">不提供: NAT类型判断、打洞决策、连通性选择 (这些都交给上层)</text>

<line x1="520" y1="252" x2="520" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Transport layer -->
<rect x="60" y="274" width="920" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="80" y="296" fill="#166534" font-size="10" font-weight="700">传输层</text>
<text x="200" y="296" fill="#475569" font-size="9">UDP (3478) | TCP (3478) | TLS-over-TCP (5349)  ← RFC 5389 新增 TCP/TLS</text>
<text x="200" y="312" fill="#64748b" font-size="8">可与 RTP/媒体流在同一端口多路复用 (靠 Magic Cookie + 首2位=0 区分)</text>

<!-- ===== Client/Server 角色 ===== -->
<text x="60" y="364" fill="#0f172a" font-size="11" font-weight="700">二、Client / Server 架构 (术语: STUN Agent = 实现STUN的实体)</text>

<!-- Client side -->
<rect x="60" y="380" width="280" height="280" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="404" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">STUN Client</text>
<text x="200" y="422" fill="#64748b" font-size="8" text-anchor="middle">通常在 NAT 后</text>

<rect x="80" y="436" width="240" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="200" y="453" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">发送 Request</text>
<text x="200" y="468" fill="#64748b" font-size="8" text-anchor="middle">接收 Response / Error Response</text>

<rect x="80" y="486" width="240" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="200" y="503" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">发送 / 接收 Indication</text>
<text x="200" y="518" fill="#64748b" font-size="8" text-anchor="middle">(无需响应的单向通知)</text>

<rect x="80" y="536" width="240" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="200" y="556" fill="#475569" font-size="8" font-weight="600" text-anchor="middle">职责:</text>
<text x="200" y="571" fill="#64748b" font-size="8" text-anchor="middle">解析响应中的 XOR-MAPPED-ADDRESS</text>

<rect x="80" y="590" width="240" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="200" y="610" fill="#475569" font-size="8" font-weight="600" text-anchor="middle">谁来当 Client:</text>
<text x="200" y="625" fill="#64748b" font-size="8" text-anchor="middle">想知道自己公网地址的终端</text>
<text x="200" y="639" fill="#64748b" font-size="8" text-anchor="middle">(WebRTC浏览器/VoIP/游戏客户端)</text>

<!-- Server side -->
<rect x="700" y="380" width="280" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="840" y="404" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">STUN Server</text>
<text x="840" y="422" fill="#64748b" font-size="8" text-anchor="middle">在公网，地址固定</text>

<rect x="720" y="436" width="240" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="840" y="453" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">接收 Request</text>
<text x="840" y="468" fill="#64748b" font-size="8" text-anchor="middle">发送 Success / Error Response</text>

<rect x="720" y="486" width="240" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="840" y="503" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">本质 = 一面"镜子"</text>
<text x="840" y="518" fill="#64748b" font-size="8" text-anchor="middle">把看到的源地址回填给Client</text>

<rect x="720" y="536" width="240" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="840" y="556" fill="#475569" font-size="8" font-weight="600" text-anchor="middle">职责:</text>
<text x="840" y="571" fill="#64748b" font-size="8" text-anchor="middle">读源IP:Port → 写入XOR-MAPPED-ADDRESS</text>

<rect x="720" y="590" width="240" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="840" y="610" fill="#16a34a" font-size="8" font-weight="600" text-anchor="middle">★ 相比3489简化:</text>
<text x="840" y="625" fill="#64748b" font-size="8" text-anchor="middle">只需1个IP:Port (3489需要4个)</text>
<text x="840" y="639" fill="#64748b" font-size="8" text-anchor="middle">不再需要换IP/Port响应</text>

<!-- NAT in middle -->
<rect x="420" y="470" width="200" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="496" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">NAT</text>
<text x="520" y="516" fill="#64748b" font-size="8" text-anchor="middle">改写源IP:Port</text>
<text x="520" y="534" fill="#64748b" font-size="8" text-anchor="middle">192.168.x:5000</text>
<text x="520" y="550" fill="#64748b" font-size="8" text-anchor="middle">↓</text>
<text x="520" y="564" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">203.0.113.5:62000</text>

<!-- Request arrow -->
<line x1="340" y1="500" x2="418" y2="500" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="378" y="492" fill="#2563eb" font-size="7" text-anchor="middle">Request</text>
<line x1="620" y1="500" x2="698" y2="500" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Response arrow -->
<line x1="698" y1="540" x2="620" y2="540" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="660" y="556" fill="#16a34a" font-size="7" text-anchor="middle">Response</text>
<line x1="418" y1="540" x2="340" y2="540" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="378" y="556" fill="#16a34a" font-size="7" text-anchor="middle">含反射地址</text>

<!-- ===== 两种事务类型 ===== -->
<text x="60" y="694" fill="#0f172a" font-size="11" font-weight="700">三、两种事务类型 (RFC 5389 明确区分)</text>

<rect x="60" y="708" width="450" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="285" y="730" fill="#1e40af" font-size="10" font-weight="700" text-anchor="middle">Request / Response 事务</text>
<text x="80" y="752" fill="#475569" font-size="9">Client 发 Request → Server 必回 Response</text>
<text x="80" y="770" fill="#475569" font-size="9">(成功) Success Response 或 (失败) Error Response</text>
<text x="80" y="788" fill="#64748b" font-size="8">例: Binding Request → Binding Success Response</text>

<rect x="530" y="708" width="450" height="90" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="755" y="730" fill="#5b21b6" font-size="10" font-weight="700" text-anchor="middle">Indication 事务</text>
<text x="550" y="752" fill="#475569" font-size="9">任一方发 Indication，对方不回任何响应</text>
<text x="550" y="770" fill="#475569" font-size="9">单向通知，用于保活(keep-alive)等场景</text>
<text x="550" y="788" fill="#64748b" font-size="8">例: TURN 的 Send/Data Indication</text>

<!-- ===== 核心思想 ===== -->
<rect x="60" y="812" width="920" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="520" y="836" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">核心思想: STUN 是镜子，不是钥匙</text>
<text x="80" y="860" fill="#475569" font-size="9">• Server 只告诉 Client "我看到你的公网地址是 X"，不做任何穿透动作</text>
<text x="80" y="878" fill="#475569" font-size="9">• 反射地址是否能用，取决于 NAT 类型(Symmetric则无效) — 但 STUN 不判断，由 ICE 实际试探</text>
<text x="80" y="896" fill="#475569" font-size="9">• 现代穿透策略: 不猜 NAT 类型，直接全部试 — 先直连 → 再用STUN反射地址 → 再用TURN中继兜底</text>
</svg>