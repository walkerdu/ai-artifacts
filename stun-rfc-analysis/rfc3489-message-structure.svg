<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1240">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="520" y="34" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 3489 STUN 协议消息结构</text>
<text x="520" y="52" fill="#64748b" font-size="9" text-anchor="middle">Simple Traversal of UDP Through NATs | 消息 = 20字节固定头 + 0..N 个 TLV 属性</text>

<!-- ===== bit ruler ===== -->
<text x="60" y="76" fill="#0f172a" font-size="11" font-weight="700">一、消息头 (Message Header, 20 bytes)</text>
<text x="80" y="98" fill="#64748b" font-size="8">bit:</text>
<text x="120" y="98" fill="#64748b" font-size="8">0</text>
<text x="350" y="98" fill="#64748b" font-size="8">15</text>
<text x="510" y="98" fill="#64748b" font-size="8">16</text>
<text x="900" y="98" fill="#64748b" font-size="8">31</text>

<!-- Row 1: Message Type + Message Length -->
<rect x="120" y="104" width="400" height="44" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="320" y="126" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">STUN Message Type</text>
<text x="320" y="141" fill="#64748b" font-size="8" text-anchor="middle">16 bits</text>

<rect x="520" y="104" width="400" height="44" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="720" y="126" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Message Length</text>
<text x="720" y="141" fill="#64748b" font-size="8" text-anchor="middle">16 bits (仅属性部分字节数，不含头)</text>

<text x="930" y="130" fill="#475569" font-size="8">byte 0-3</text>

<!-- Row 2-5: Transaction ID 128bit -->
<rect x="120" y="152" width="800" height="80" rx="0" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="520" y="188" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="middle">Transaction ID</text>
<text x="520" y="206" fill="#64748b" font-size="9" text-anchor="middle">128 bits (16 bytes) — 客户端生成的随机数，用于匹配请求与响应、防重放</text>
<text x="930" y="195" fill="#475569" font-size="8">byte 4-19</text>

<!-- Note: no magic cookie -->
<rect x="120" y="240" width="800" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="520" y="257" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">注意: RFC 3489 没有 Magic Cookie 字段 (那是 RFC 5389 才引入的，占用了 Transaction ID 的高32位)</text>

<!-- ===== Message Type 编码 ===== -->
<text x="60" y="298" fill="#0f172a" font-size="11" font-weight="700">二、Message Type 编码 (16 bits) 与已定义的消息</text>

<!-- type table -->
<rect x="60" y="312" width="920" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

<text x="80" y="334" fill="#0f172a" font-size="9" font-weight="600">消息类型</text>
<text x="360" y="334" fill="#0f172a" font-size="9" font-weight="600">Type 值</text>
<text x="500" y="334" fill="#0f172a" font-size="9" font-weight="600">传输</text>
<text x="640" y="334" fill="#0f172a" font-size="9" font-weight="600">用途</text>
<line x1="80" y1="342" x2="960" y2="342" stroke="#e2e8f0" stroke-width="1"/>

<text x="80" y="362" fill="#1e40af" font-size="9" font-weight="600">Binding Request</text>
<text x="360" y="362" fill="#475569" font-size="9">0x0001</text>
<text x="500" y="362" fill="#475569" font-size="9">UDP</text>
<text x="640" y="362" fill="#475569" font-size="9">请求公网映射地址 / NAT探测</text>

<text x="80" y="382" fill="#166534" font-size="9" font-weight="600">Binding Response</text>
<text x="360" y="382" fill="#475569" font-size="9">0x0101</text>
<text x="500" y="382" fill="#475569" font-size="9">UDP</text>
<text x="640" y="382" fill="#475569" font-size="9">返回 MAPPED-ADDRESS 等</text>

<text x="80" y="402" fill="#991b1b" font-size="9" font-weight="600">Binding Error Response</text>
<text x="360" y="402" fill="#475569" font-size="9">0x0111</text>
<text x="500" y="402" fill="#475569" font-size="9">UDP</text>
<text x="640" y="402" fill="#475569" font-size="9">含 ERROR-CODE</text>

<text x="80" y="422" fill="#1e40af" font-size="9" font-weight="600">Shared Secret Request</text>
<text x="360" y="422" fill="#475569" font-size="9">0x0002</text>
<text x="500" y="422" fill="#b91c1c" font-size="9">TLS/TCP</text>
<text x="640" y="422" fill="#475569" font-size="9">获取临时 USERNAME/PASSWORD</text>

<text x="80" y="442" fill="#166534" font-size="9" font-weight="600">Shared Secret Response</text>
<text x="360" y="442" fill="#475569" font-size="9">0x0102</text>
<text x="500" y="442" fill="#b91c1c" font-size="9">TLS/TCP</text>
<text x="640" y="442" fill="#475569" font-size="9">返回 USERNAME + PASSWORD</text>

<text x="80" y="458" fill="#64748b" font-size="8">(还有 Shared Secret Error Response = 0x0112)</text>

<!-- ===== TLV 属性结构 ===== -->
<text x="60" y="500" fill="#0f172a" font-size="11" font-weight="700">三、属性结构 (Attribute, TLV 格式，可 0 个或多个，32位对齐)</text>

<text x="80" y="522" fill="#64748b" font-size="8">bit:</text>
<text x="120" y="522" fill="#64748b" font-size="8">0</text>
<text x="350" y="522" fill="#64748b" font-size="8">15</text>
<text x="510" y="522" fill="#64748b" font-size="8">16</text>
<text x="900" y="522" fill="#64748b" font-size="8">31</text>

<!-- Attr Type + Length -->
<rect x="120" y="528" width="400" height="40" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="320" y="552" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">Attribute Type (16b)</text>

<rect x="520" y="528" width="400" height="40" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="720" y="552" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Attribute Length (16b)</text>

<!-- Attr Value -->
<rect x="120" y="568" width="800" height="44" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="520" y="590" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">Attribute Value (变长，按 Length 字节数，补齐到 4 字节边界)</text>
<text x="520" y="605" fill="#64748b" font-size="8" text-anchor="middle">不同属性的 Value 格式不同</text>

<!-- ===== 属性列表 ===== -->
<text x="60" y="648" fill="#0f172a" font-size="11" font-weight="700">四、RFC 3489 定义的属性</text>
<rect x="60" y="662" width="920" height="232" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

<text x="80" y="684" fill="#0f172a" font-size="9" font-weight="600">属性名</text>
<text x="280" y="684" fill="#0f172a" font-size="9" font-weight="600">Type</text>
<text x="380" y="684" fill="#0f172a" font-size="9" font-weight="600">说明</text>
<line x1="80" y1="692" x2="960" y2="692" stroke="#e2e8f0" stroke-width="1"/>

<text x="80" y="712" fill="#1e40af" font-size="9" font-weight="600">MAPPED-ADDRESS</text>
<text x="280" y="712" fill="#475569" font-size="9">0x0001</text>
<text x="380" y="712" fill="#475569" font-size="9">服务器看到的客户端公网 IP:Port (反射地址)</text>

<text x="80" y="731" fill="#475569" font-size="9">RESPONSE-ADDRESS</text>
<text x="280" y="731" fill="#475569" font-size="9">0x0002</text>
<text x="380" y="731" fill="#475569" font-size="9">指定响应发往的地址 (后被弃用，易被滥用为DDoS)</text>

<text x="80" y="750" fill="#b91c1c" font-size="9" font-weight="600">CHANGE-REQUEST</text>
<text x="280" y="750" fill="#475569" font-size="9">0x0003</text>
<text x="380" y="750" fill="#475569" font-size="9">请求服务器换IP/换Port响应 (NAT类型探测核心)</text>

<text x="80" y="769" fill="#475569" font-size="9">SOURCE-ADDRESS</text>
<text x="280" y="769" fill="#475569" font-size="9">0x0004</text>
<text x="380" y="769" fill="#475569" font-size="9">服务器实际发送响应的源地址</text>

<text x="80" y="788" fill="#475569" font-size="9">CHANGED-ADDRESS</text>
<text x="280" y="788" fill="#475569" font-size="9">0x0005</text>
<text x="380" y="788" fill="#475569" font-size="9">告知备用地址 (A2:P2)，供 Test I' 使用</text>

<text x="80" y="807" fill="#475569" font-size="9">USERNAME</text>
<text x="280" y="807" fill="#475569" font-size="9">0x0006</text>
<text x="380" y="807" fill="#475569" font-size="9">共享密钥索引，配合消息完整性</text>

<text x="80" y="826" fill="#475569" font-size="9">PASSWORD</text>
<text x="280" y="826" fill="#475569" font-size="9">0x0007</text>
<text x="380" y="826" fill="#475569" font-size="9">Shared Secret Response 返回，≥128bit随机</text>

<text x="80" y="845" fill="#475569" font-size="9">MESSAGE-INTEGRITY</text>
<text x="280" y="845" fill="#475569" font-size="9">0x0008</text>
<text x="380" y="845" fill="#475569" font-size="9">HMAC-SHA1，必须是最后一个属性</text>

<text x="80" y="864" fill="#475569" font-size="9">ERROR-CODE</text>
<text x="280" y="864" fill="#475569" font-size="9">0x0009</text>
<text x="380" y="864" fill="#475569" font-size="9">错误码(100-699) + 原因短语</text>

<text x="80" y="883" fill="#475569" font-size="9">UNKNOWN-ATTRIBUTES / REFLECTED-FROM</text>
<text x="380" y="883" fill="#475569" font-size="9">0x000a / 0x000b — 未知属性列表 / 反射来源(防DDoS溯源)</text>

<!-- ===== 典型属性 Value 格式 ===== -->
<text x="60" y="928" fill="#0f172a" font-size="11" font-weight="700">五、两个典型属性的 Value 格式</text>

<!-- MAPPED-ADDRESS format -->
<rect x="60" y="942" width="450" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="285" y="964" fill="#1e40af" font-size="10" font-weight="700" text-anchor="middle">MAPPED-ADDRESS / 各地址类属性</text>

<rect x="80" y="978" width="80" height="34" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="120" y="998" fill="#64748b" font-size="8" text-anchor="middle">保留 8b</text>
<rect x="160" y="978" width="100" height="34" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="210" y="998" fill="#1e40af" font-size="8" text-anchor="middle">Family 8b</text>
<rect x="260" y="978" width="230" height="34" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="375" y="998" fill="#166534" font-size="8" text-anchor="middle">Port 16b</text>

<rect x="80" y="1014" width="410" height="34" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="285" y="1034" fill="#92400e" font-size="8" text-anchor="middle">IP Address 32b (IPv4)</text>

<text x="80" y="1068" fill="#475569" font-size="8">Family: 0x01 = IPv4</text>
<text x="80" y="1083" fill="#475569" font-size="8">明文传输 — 易被 NAT ALG 篡改 (5389 改用 XOR 编码修复)</text>

<!-- CHANGE-REQUEST format -->
<rect x="530" y="942" width="450" height="150" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="755" y="964" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">CHANGE-REQUEST (32 bits)</text>

<rect x="550" y="978" width="410" height="34" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="755" y="998" fill="#991b1b" font-size="8" text-anchor="middle">29 bits 全 0 ......... | A | B | 0</text>

<text x="550" y="1034" fill="#dc2626" font-size="9" font-weight="600">A 位 (bit 2) = "change IP"</text>
<text x="760" y="1034" fill="#475569" font-size="8">置1: 服务器换源IP响应</text>
<text x="550" y="1053" fill="#dc2626" font-size="9" font-weight="600">B 位 (bit 1) = "change port"</text>
<text x="760" y="1053" fill="#475569" font-size="8">置1: 服务器换源Port响应</text>
<text x="550" y="1078" fill="#475569" font-size="8">Test II: A=1,B=1 | Test III: A=0,B=1 | Test I/I': A=0,B=0</text>

<!-- ===== 整体消息布局 ===== -->
<text x="60" y="1130" fill="#0f172a" font-size="11" font-weight="700">六、完整消息布局示意</text>
<rect x="60" y="1144" width="180" height="40" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="150" y="1162" fill="#5b21b6" font-size="9" font-weight="600" text-anchor="middle">消息头 20 bytes</text>
<text x="150" y="1176" fill="#64748b" font-size="7" text-anchor="middle">Type+Length+TxnID</text>

<line x1="240" y1="1164" x2="280" y2="1164" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="282" y="1144" width="150" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="357" y="1162" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">属性 1 (TLV)</text>
<text x="357" y="1176" fill="#64748b" font-size="7" text-anchor="middle">如 MAPPED-ADDRESS</text>

<line x1="432" y1="1164" x2="472" y2="1164" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="474" y="1144" width="150" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="549" y="1162" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">属性 2 (TLV)</text>
<text x="549" y="1176" fill="#64748b" font-size="7" text-anchor="middle">如 SOURCE-ADDRESS</text>

<line x1="624" y1="1164" x2="664" y2="1164" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="666" y="1144" width="160" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="746" y="1162" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">... MESSAGE-INTEGRITY</text>
<text x="746" y="1176" fill="#64748b" font-size="7" text-anchor="middle">(若有，必须放最后)</text>

<text x="850" y="1168" fill="#64748b" font-size="8">Length 字段</text>
<text x="850" y="1180" fill="#64748b" font-size="8">= 所有属性总字节</text>
</svg>