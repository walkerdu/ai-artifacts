<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1400">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="520" y="34" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">TURN 协议详解</text>
<text x="520" y="52" fill="#64748b" font-size="9" text-anchor="middle">Traversal Using Relays around NAT | RFC 5766 → RFC 8656 | STUN 的中继扩展</text>

<!-- ===== 一、定位 ===== -->
<rect x="40" y="68" width="960" height="100" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="60" y="92" fill="#5b21b6" font-size="11" font-weight="700">一、TURN 是什么</text>
<text x="60" y="114" fill="#475569" font-size="9">全称: Traversal Using Relays around NAT (使用中继穿越 NAT)</text>
<text x="60" y="132" fill="#475569" font-size="9">RFC 规范: RFC 5766 (2010) → 被 RFC 8656 (2020) 取代</text>
<text x="60" y="150" fill="#dc2626" font-size="9" font-weight="600">关键定位: STUN 的扩展。复用 STUN 消息格式 (同一个20字节头+TLV属性)，新增 Allocate/Refresh/Send 等 method</text>
<text x="60" y="162" fill="#64748b" font-size="8">所以你抓包看到的 TURN 报文，头部和 STUN 一模一样 (含 Magic Cookie)，只是 Method 字段不同</text>

<!-- ===== 二、为什么需要 ===== -->
<rect x="40" y="178" width="960" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="60" y="202" fill="#991b1b" font-size="11" font-weight="700">二、为什么需要 TURN</text>
<text x="60" y="222" fill="#475569" font-size="9">问题: Symmetric NAT 下，STUN 拿到的反射地址对 Peer 无效 → P2P 直连彻底失败</text>
<text x="60" y="240" fill="#475569" font-size="9">唯一解法: 找一个公网服务器帮忙转发 — Client 和 Peer 都能到达这个服务器，由它做"传话人"</text>
<text x="60" y="256" fill="#dc2626" font-size="9" font-weight="600">代价: 流量全程经 TURN 服务器中转 → 占带宽、加延迟、有成本 → 所以 ICE 把它排最低优先级</text>

<!-- ===== 三、核心概念 ===== -->
<text x="60" y="290" fill="#0f172a" font-size="11" font-weight="700">三、核心概念 (术语)</text>
<rect x="40" y="300" width="960" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="60" y="322" fill="#1e40af" font-size="9" font-weight="700">Allocation (分配)</text>
<text x="250" y="322" fill="#475569" font-size="9">TURN 服务器上的一个数据结构：包含中继地址、权限列表、过期时间等状态</text>
<text x="250" y="337" fill="#64748b" font-size="8">由 5-tuple (Client IP:Port + Server IP:Port + 传输协议) 唯一标识</text>

<text x="60" y="360" fill="#16a34a" font-size="9" font-weight="700">Relayed Transport Address (中继传输地址)</text>
<text x="380" y="360" fill="#475569" font-size="9">TURN 服务器上分配给该 Client 的公网 IP:Port</text>
<text x="380" y="375" fill="#64748b" font-size="8">Peer 发数据到这个地址 → TURN 转发给 Client。这就是 ICE 的 relay 候选</text>

<text x="60" y="398" fill="#d97706" font-size="9" font-weight="700">Permission (权限)</text>
<text x="250" y="398" fill="#475569" font-size="9">Client 授权"允许哪些 Peer 的 IP 通过中继与我通信"</text>
<text x="250" y="413" fill="#64748b" font-size="8">只检查 IP，不检查端口。没有权限的来源包被静默丢弃 (防止滥用中继)</text>

<text x="60" y="436" fill="#7c3aed" font-size="9" font-weight="700">Channel (通道)</text>
<text x="250" y="436" fill="#475569" font-size="9">绑定一个 2 字节通道号(0x4000-0x7FFF) → 替代完整 STUN 头，节省每包 36 字节开销</text>
<text x="250" y="451" fill="#64748b" font-size="8">高频数据流(如视频)走 Channel 更高效；通道号有生命周期，需续期</text>

<text x="60" y="470" fill="#991b1b" font-size="9" font-weight="700">Lifetime (生命周期)</text>
<text x="250" y="470" fill="#475569" font-size="9">Allocation 默认 10 分钟过期，Client 必须用 Refresh 续期；Permission 默认 5 分钟过期</text>

<!-- ===== 四、TURN 定义的 Method ===== -->
<text x="60" y="510" fill="#0f172a" font-size="11" font-weight="700">四、TURN 新增的 STUN Method (复用 STUN 消息格式)</text>
<rect x="40" y="524" width="960" height="160" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="60" y="545" fill="#0f172a" font-size="9" font-weight="600">Method</text>
<text x="260" y="545" fill="#0f172a" font-size="9" font-weight="600">类型</text>
<text x="420" y="545" fill="#0f172a" font-size="9" font-weight="600">用途</text>
<line x1="60" y1="553" x2="980" y2="553" stroke="#e2e8f0" stroke-width="1"/>

<text x="60" y="572" fill="#2563eb" font-size="9" font-weight="600">Allocate (0x003)</text>
<text x="260" y="572" fill="#475569" font-size="9">Request/Response</text>
<text x="420" y="572" fill="#475569" font-size="9">申请中继地址，建立 Allocation</text>

<text x="60" y="592" fill="#2563eb" font-size="9" font-weight="600">Refresh (0x004)</text>
<text x="260" y="592" fill="#475569" font-size="9">Request/Response</text>
<text x="420" y="592" fill="#475569" font-size="9">续期 Allocation (Lifetime=0 则释放)</text>

<text x="60" y="612" fill="#2563eb" font-size="9" font-weight="600">CreatePermission (0x008)</text>
<text x="260" y="612" fill="#475569" font-size="9">Request/Response</text>
<text x="420" y="612" fill="#475569" font-size="9">授权某 Peer IP 可通过中继与 Client 通信</text>

<text x="60" y="632" fill="#16a34a" font-size="9" font-weight="600">Send (0x006)</text>
<text x="260" y="632" fill="#475569" font-size="9">Indication (无响应)</text>
<text x="420" y="632" fill="#475569" font-size="9">Client → Server: "把这段数据转发给 Peer X"</text>

<text x="60" y="652" fill="#16a34a" font-size="9" font-weight="600">Data (0x007)</text>
<text x="260" y="652" fill="#475569" font-size="9">Indication (无响应)</text>
<text x="420" y="652" fill="#475569" font-size="9">Server → Client: "Peer X 给你发了这段数据"</text>

<text x="60" y="672" fill="#7c3aed" font-size="9" font-weight="600">ChannelBind (0x009)</text>
<text x="260" y="672" fill="#475569" font-size="9">Request/Response</text>
<text x="420" y="672" fill="#475569" font-size="9">绑定通道号，后续用 ChannelData 帧(4字节头)高效传输</text>

<!-- ===== 五、传输架构 ===== -->
<text x="60" y="716" fill="#0f172a" font-size="11" font-weight="700">五、传输架构 (Client ↔ Server vs Server ↔ Peer)</text>
<rect x="40" y="730" width="960" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="60" y="752" fill="#0f172a" font-size="9" font-weight="600">Client → TURN Server</text>
<text x="300" y="752" fill="#0f172a" font-size="9" font-weight="600">TURN Server → Peer</text>
<text x="600" y="752" fill="#0f172a" font-size="9" font-weight="600">说明</text>
<line x1="60" y1="760" x2="980" y2="760" stroke="#e2e8f0" stroke-width="1"/>

<text x="60" y="780" fill="#475569" font-size="9">UDP</text>
<text x="300" y="780" fill="#475569" font-size="9">UDP</text>
<text x="600" y="780" fill="#475569" font-size="9">常见配置，最低延迟</text>

<text x="60" y="800" fill="#475569" font-size="9">TCP</text>
<text x="300" y="800" fill="#475569" font-size="9">UDP</text>
<text x="600" y="800" fill="#475569" font-size="9">防火墙阻止 UDP 时的回退</text>

<text x="60" y="820" fill="#475569" font-size="9">TLS over TCP</text>
<text x="300" y="820" fill="#475569" font-size="9">UDP</text>
<text x="600" y="820" fill="#475569" font-size="9">加密控制通道 (企业网络443端口更易穿过)</text>

<!-- ===== 六、完整交互流程 ===== -->
<text x="60" y="860" fill="#0f172a" font-size="11" font-weight="700">六、完整交互流程</text>

<!-- Actors -->
<rect x="80" y="878" width="100" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="898" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Client A</text>

<rect x="400" y="878" width="120" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="460" y="898" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">TURN Server</text>

<rect x="760" y="878" width="100" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="810" y="898" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">Peer B</text>

<!-- Lifelines -->
<line x1="130" y1="910" x2="130" y2="1310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="460" y1="910" x2="460" y2="1310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="810" y1="910" x2="810" y2="1310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

<!-- Step 1: Allocate -->
<line x1="130" y1="930" x2="458" y2="930" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="295" y="922" fill="#2563eb" font-size="8" text-anchor="middle">① Allocate Request (需认证: USERNAME+MESSAGE-INTEGRITY)</text>

<line x1="458" y1="955" x2="132" y2="955" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="295" y="970" fill="#166534" font-size="8" text-anchor="middle">Allocate Success: RELAYED-ADDRESS=198.51.100.10:50000</text>
<text x="295" y="983" fill="#64748b" font-size="7" text-anchor="middle">+ XOR-MAPPED-ADDRESS(Client的反射地址) + LIFETIME=600s</text>

<!-- Step 2: 信令交换中继地址 -->
<rect x="200" y="1000" width="560" height="24" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
<text x="480" y="1016" fill="#5b21b6" font-size="8" text-anchor="middle">② [信令] Client 把 relay 地址 198.51.100.10:50000 通过 SDP 告知 Peer B</text>

<!-- Step 3: CreatePermission -->
<line x1="130" y1="1042" x2="458" y2="1042" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="295" y="1034" fill="#2563eb" font-size="8" text-anchor="middle">③ CreatePermission Request (Peer B 的 IP)</text>
<line x1="458" y1="1060" x2="132" y2="1060" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="295" y="1075" fill="#64748b" font-size="7" text-anchor="middle">→ 允许来自 B 的 IP 的数据被中继转发</text>

<!-- Step 4: Data from Peer B -->
<line x1="810" y1="1100" x2="462" y2="1100" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="640" y="1092" fill="#166534" font-size="8" text-anchor="middle">④ Peer B 发 UDP 到 relay 地址 :50000</text>

<!-- Step 5: TURN relays to Client via Data Indication -->
<line x1="458" y1="1125" x2="132" y2="1125" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="295" y="1117" fill="#dc2626" font-size="8" text-anchor="middle">⑤ Data Indication (包含: Peer B 地址 + 原始数据)</text>

<!-- Step 6: Client sends via Send Indication -->
<line x1="130" y1="1160" x2="458" y2="1160" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="295" y="1152" fill="#dc2626" font-size="8" text-anchor="middle">⑥ Send Indication (目标: Peer B 地址 + 数据)</text>

<!-- Step 7: TURN forwards to Peer -->
<line x1="462" y1="1185" x2="808" y2="1185" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="640" y="1177" fill="#166534" font-size="8" text-anchor="middle">⑦ 服务器提取数据，以 UDP 发给 Peer B</text>

<!-- ChannelData alternative -->
<rect x="80" y="1210" width="800" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="480" y="1230" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">高效替代: ChannelBind 后用 ChannelData 帧 (仅4字节头: 通道号2B + 长度2B + 数据)</text>
<text x="480" y="1246" fill="#64748b" font-size="8" text-anchor="middle">省去完整 STUN 头(20B) + XOR-PEER-ADDRESS 属性(12B) = 每包省 36 字节，适合视频流</text>

<!-- Step 8: Refresh -->
<line x1="130" y1="1275" x2="458" y2="1275" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="295" y="1267" fill="#475569" font-size="8" text-anchor="middle">⑧ Refresh Request (每 Lifetime/2 发一次续期，否则 Allocation 过期释放)</text>

<!-- Bottom -->
<rect x="40" y="1320" width="960" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="1342" fill="#0f172a" font-size="9" font-weight="700">安全机制:</text>
<text x="200" y="1342" fill="#475569" font-size="9">强制 Long-Term Credential (HMAC-SHA1 + Realm + Nonce)，所有 Request 必须认证</text>
<text x="60" y="1362" fill="#0f172a" font-size="9" font-weight="700">认证目的:</text>
<text x="200" y="1362" fill="#475569" font-size="9">防止匿名用户白嫖服务器带宽 → TURN 运营有成本 (带宽费)，必须限制访问</text>
<text x="60" y="1380" fill="#64748b" font-size="8">Indication (Send/Data) 无法认证，靠 Permission 机制限制谁能中继</text>
</svg>