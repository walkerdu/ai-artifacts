<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="520" y="34" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">TURN 协议基础 — RFC 5766 / 8656</text>
<text x="520" y="52" fill="#64748b" font-size="9" text-anchor="middle">Traversal Using Relays around NAT | STUN 的中继扩展 | 交互时序见 turn-relay-mechanism.svg</text>

<!-- ===== 一、定位 ===== -->
<rect x="40" y="68" width="960" height="96" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="60" y="92" fill="#5b21b6" font-size="11" font-weight="700">一、定位与规范</text>
<text x="60" y="114" fill="#475569" font-size="9">全称: Traversal Using Relays around NAT</text>
<text x="60" y="132" fill="#475569" font-size="9">RFC: 5766 (2010) → 被 8656 (2020) 取代</text>
<text x="60" y="150" fill="#dc2626" font-size="9" font-weight="600">本质: STUN 的扩展。报文格式完全复用 STUN (同20字节头+Magic Cookie+TLV)，只新增 Method</text>
<text x="60" y="162" fill="#64748b" font-size="8">抓包看 TURN 报文 → 头部和 STUN 一样，区别在于 Message Type 里的 method 字段不同</text>

<!-- ===== 二、解决的问题 ===== -->
<rect x="40" y="176" width="960" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="60" y="200" fill="#991b1b" font-size="11" font-weight="700">二、解决什么问题</text>
<text x="60" y="220" fill="#475569" font-size="9">Symmetric NAT 下 STUN 反射地址无效 → P2P 彻底断路 → 需要公网中继服务器帮转发</text>
<text x="60" y="238" fill="#dc2626" font-size="9" font-weight="600">代价: 全部流量经 TURN 服务器中转 → 占带宽、加延迟、有运营成本 → ICE 排最低优先级</text>

<!-- ===== 三、核心概念 ===== -->
<text x="60" y="276" fill="#0f172a" font-size="11" font-weight="700">三、核心概念</text>
<rect x="40" y="290" width="960" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="60" y="314" fill="#1e40af" font-size="9" font-weight="700">Allocation (分配)</text>
<text x="250" y="314" fill="#475569" font-size="9">TURN Server 上的数据结构: 中继地址 + 权限列表 + 过期计时器</text>
<text x="250" y="330" fill="#64748b" font-size="8">由 5-tuple (Client IP:Port + Server IP:Port + 协议) 唯一标识。默认 Lifetime = 600s</text>

<text x="60" y="354" fill="#16a34a" font-size="9" font-weight="700">Relayed Transport Address</text>
<text x="310" y="354" fill="#475569" font-size="9">TURN 给 Client 分配的公网 IP:Port</text>
<text x="310" y="370" fill="#64748b" font-size="8">Peer 发数据到此地址 → TURN 转给 Client。这就是 ICE 的 relay 候选地址</text>

<text x="60" y="394" fill="#d97706" font-size="9" font-weight="700">Permission (权限)</text>
<text x="250" y="394" fill="#475569" font-size="9">授权"哪些 Peer 的 IP 可通过中继与 Client 通信"(只查IP，不查Port)</text>
<text x="250" y="410" fill="#64748b" font-size="8">无权限的来源包静默丢弃。默认 5 分钟过期</text>

<text x="60" y="434" fill="#7c3aed" font-size="9" font-weight="700">Channel (通道)</text>
<text x="250" y="434" fill="#475569" font-size="9">绑定 2 字节通道号(0x4000-0x7FFF)，后续用 ChannelData 帧(仅4字节头)传数据</text>
<text x="250" y="450" fill="#64748b" font-size="8">省去 STUN 头20B + 属性~16B ≈ 每包省 36 字节。适合高频视频流</text>

<!-- ===== 四、TURN 的 Method ===== -->
<text x="60" y="496" fill="#0f172a" font-size="11" font-weight="700">四、TURN 定义的 Method (复用 STUN 消息格式)</text>
<rect x="40" y="510" width="960" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="60" y="532" fill="#0f172a" font-size="9" font-weight="600">Method</text>
<text x="260" y="532" fill="#0f172a" font-size="9" font-weight="600">编号</text>
<text x="370" y="532" fill="#0f172a" font-size="9" font-weight="600">消息类型</text>
<text x="560" y="532" fill="#0f172a" font-size="9" font-weight="600">用途</text>
<line x1="60" y1="540" x2="980" y2="540" stroke="#e2e8f0" stroke-width="1"/>

<text x="60" y="558" fill="#2563eb" font-size="9" font-weight="600">Allocate</text>
<text x="260" y="558" fill="#475569" font-size="9">0x003</text>
<text x="370" y="558" fill="#475569" font-size="9">Request / Response</text>
<text x="560" y="558" fill="#475569" font-size="9">申请中继地址，建立 Allocation</text>

<text x="60" y="578" fill="#2563eb" font-size="9" font-weight="600">Refresh</text>
<text x="260" y="578" fill="#475569" font-size="9">0x004</text>
<text x="370" y="578" fill="#475569" font-size="9">Request / Response</text>
<text x="560" y="578" fill="#475569" font-size="9">续期 Allocation (Lifetime=0 则释放)</text>

<text x="60" y="598" fill="#2563eb" font-size="9" font-weight="600">CreatePermission</text>
<text x="260" y="598" fill="#475569" font-size="9">0x008</text>
<text x="370" y="598" fill="#475569" font-size="9">Request / Response</text>
<text x="560" y="598" fill="#475569" font-size="9">授权 Peer IP 的数据可被中继转发</text>

<text x="60" y="618" fill="#16a34a" font-size="9" font-weight="600">Send</text>
<text x="260" y="618" fill="#475569" font-size="9">0x006</text>
<text x="370" y="618" fill="#475569" font-size="9">Indication (无响应)</text>
<text x="560" y="618" fill="#475569" font-size="9">Client → Server: "把数据转发给 Peer X"</text>

<text x="60" y="638" fill="#16a34a" font-size="9" font-weight="600">Data</text>
<text x="260" y="638" fill="#475569" font-size="9">0x007</text>
<text x="370" y="638" fill="#475569" font-size="9">Indication (无响应)</text>
<text x="560" y="638" fill="#475569" font-size="9">Server → Client: "Peer X 发来了数据"</text>

<text x="60" y="656" fill="#7c3aed" font-size="9" font-weight="600">ChannelBind</text>
<text x="260" y="656" fill="#475569" font-size="9">0x009</text>
<text x="370" y="656" fill="#475569" font-size="9">Request / Response</text>
<text x="560" y="656" fill="#475569" font-size="9">绑定通道号，启用 ChannelData 帧高效传输</text>

<!-- ===== 五、传输架构 ===== -->
<text x="60" y="696" fill="#0f172a" font-size="11" font-weight="700">五、传输架构</text>
<rect x="40" y="710" width="960" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="60" y="732" fill="#0f172a" font-size="9" font-weight="600">Client → TURN Server</text>
<text x="350" y="732" fill="#0f172a" font-size="9" font-weight="600">TURN Server → Peer</text>
<text x="630" y="732" fill="#0f172a" font-size="9" font-weight="600">说明</text>
<line x1="60" y1="740" x2="980" y2="740" stroke="#e2e8f0" stroke-width="1"/>

<text x="60" y="758" fill="#475569" font-size="9">UDP / TCP / TLS-over-TCP</text>
<text x="350" y="758" fill="#dc2626" font-size="9" font-weight="600">始终 UDP</text>
<text x="630" y="758" fill="#475569" font-size="9">Server↔Peer 只有 UDP；Client↔Server 可任选</text>

<text x="60" y="778" fill="#64748b" font-size="8">TCP/TLS 用于: 防火墙封 UDP 的企业网络、需加密的场景。TURN Server 做 TCP↔UDP 协议转换</text>

<!-- ===== 六、安全 ===== -->
<text x="60" y="818" fill="#0f172a" font-size="11" font-weight="700">六、安全与认证</text>
<rect x="40" y="832" width="960" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="856" fill="#475569" font-size="9">强制 Long-Term Credential 认证 (HMAC-SHA1 + Realm + Nonce)。所有 Request 必须认证，防匿名白嫖带宽</text>
<text x="60" y="868" fill="#64748b" font-size="8">Indication (Send/Data) 无法认证 → 靠 Permission 机制限制来源。Allocation 绑定 username，防劫持</text>
</svg>