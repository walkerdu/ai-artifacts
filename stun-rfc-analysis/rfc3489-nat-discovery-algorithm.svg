<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="450" y="40" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 3489 NAT 类型发现算法</text>
<text x="450" y="60" fill="#64748b" font-size="9" text-anchor="middle">三步测试法 | 服务器需绑定 4 个 (IP, Port) 组合: (A1,P1) (A2,P1) (A1,P2) (A2,P2)</text>

<!-- Test I: Start -->
<rect x="350" y="90" width="200" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450" y="112" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Test I</text>
<text x="450" y="128" fill="#64748b" font-size="9" text-anchor="middle">发送到 (A1,P1), 无标志</text>

<!-- Arrow down -->
<line x1="450" y1="140" x2="450" y2="170" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision 1: Response? -->
<polygon points="450,170 510,205 450,240 390,205" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="209" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">收到响应?</text>

<!-- No: UDP blocked -->
<line x1="510" y1="205" x2="680" y2="205" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="560" y="197" fill="#dc2626" font-size="8" font-weight="500">否</text>
<rect x="680" y="185" width="160" height="40" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="760" y="209" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">UDP 被阻止</text>

<!-- Yes: continue -->
<line x1="450" y1="240" x2="450" y2="270" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="462" y="258" fill="#16a34a" font-size="8" font-weight="500">是</text>

<!-- Decision 2: MAPPED = Local? -->
<polygon points="450,270 520,310 450,350 380,310" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="306" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">MAPPED-ADDR</text>
<text x="450" y="319" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">= 本地地址?</text>

<!-- Yes branch (left): No NAT -->
<line x1="380" y1="310" x2="200" y2="310" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="320" y="302" fill="#16a34a" font-size="8" font-weight="500">是 (无NAT)</text>

<!-- Left: Test II -->
<rect x="100" y="340" width="200" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="362" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Test II</text>
<text x="200" y="378" fill="#64748b" font-size="9" text-anchor="middle">CHANGE IP + CHANGE PORT</text>
<line x1="200" y1="310" x2="200" y2="340" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Left Decision: Response? -->
<line x1="200" y1="390" x2="200" y2="420" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="200,420 260,455 200,490 140,455" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="200" y="459" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">响应?</text>

<!-- Left Yes: Open Internet -->
<line x1="260" y1="455" x2="360" y2="455" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="295" y="447" fill="#16a34a" font-size="8" font-weight="500">是</text>
<rect x="360" y="435" width="140" height="40" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="430" y="459" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle">开放网络</text>

<!-- Left No: Symmetric UDP Firewall -->
<line x1="200" y1="490" x2="200" y2="520" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="212" y="508" fill="#dc2626" font-size="8" font-weight="500">否</text>
<rect x="100" y="520" width="200" height="40" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="200" y="544" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">对称 UDP 防火墙</text>

<!-- Right branch: Has NAT -->
<line x1="520" y1="310" x2="680" y2="310" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="570" y="302" fill="#dc2626" font-size="8" font-weight="500">否 (有NAT)</text>

<!-- Right: Test II -->
<rect x="580" y="340" width="200" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="680" y="362" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Test II</text>
<text x="680" y="378" fill="#64748b" font-size="9" text-anchor="middle">CHANGE IP + CHANGE PORT</text>
<line x1="680" y1="310" x2="680" y2="340" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Right Decision: Response? -->
<line x1="680" y1="390" x2="680" y2="420" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="680,420 740,455 680,490 620,455" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="680" y="459" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">响应?</text>

<!-- Right Yes: Full Cone -->
<line x1="740" y1="455" x2="820" y2="455" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="775" y="447" fill="#16a34a" font-size="8" font-weight="500">是</text>
<rect x="720" y="435" width="150" height="40" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="795" y="459" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle">Full Cone NAT</text>

<!-- Right No: continue to Test I' -->
<line x1="680" y1="490" x2="680" y2="530" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="692" y="513" fill="#dc2626" font-size="8" font-weight="500">否</text>

<!-- Test I': Send to CHANGED-ADDRESS -->
<rect x="550" y="530" width="260" height="50" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="680" y="552" fill="#5b21b6" font-size="11" font-weight="600" text-anchor="middle">Test I' (重复Test I)</text>
<text x="680" y="568" fill="#64748b" font-size="9" text-anchor="middle">同源端口 → CHANGED-ADDRESS</text>

<!-- Arrow down -->
<line x1="680" y1="580" x2="680" y2="620" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision: MAPPED changed? -->
<polygon points="680,620 750,660 680,700 610,660" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="680" y="656" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">MAPPED</text>
<text x="680" y="669" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">变化了?</text>

<!-- Yes: Symmetric NAT -->
<line x1="750" y1="660" x2="830" y2="660" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="785" y="652" fill="#dc2626" font-size="8" font-weight="500">是</text>
<rect x="730" y="640" width="160" height="40" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="810" y="664" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">Symmetric NAT</text>

<!-- No: continue to Test III -->
<line x1="610" y1="660" x2="450" y2="660" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="540" y="652" fill="#16a34a" font-size="8" font-weight="500">否 (端口不变)</text>

<!-- Test III -->
<rect x="350" y="690" width="200" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450" y="712" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Test III</text>
<text x="450" y="728" fill="#64748b" font-size="9" text-anchor="middle">仅 CHANGE PORT</text>
<line x1="450" y1="660" x2="450" y2="690" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Arrow down -->
<line x1="450" y1="740" x2="450" y2="780" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision: Response? -->
<polygon points="450,780 510,815 450,850 390,815" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="819" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">响应?</text>

<!-- Yes: Restricted Cone -->
<line x1="510" y1="815" x2="640" y2="815" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="555" y="807" fill="#16a34a" font-size="8" font-weight="500">是</text>
<rect x="540" y="795" width="200" height="40" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="640" y="819" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">Restricted Cone NAT</text>

<!-- No: Port Restricted Cone -->
<line x1="450" y1="850" x2="450" y2="890" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="462" y="873" fill="#dc2626" font-size="8" font-weight="500">否</text>
<rect x="330" y="890" width="240" height="40" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="914" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">Port Restricted Cone NAT</text>

<!-- Legend -->
<rect x="40" y="940" width="820" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="959" fill="#64748b" font-size="9" font-weight="400">CHANGE-REQUEST: A位=换IP  B位=换Port | Test II 服务器从 (A2,P2) 响应 | Test III 服务器从 (A1,P2) 响应 | Test I' 验证映射是否随目标变化</text>
</svg>