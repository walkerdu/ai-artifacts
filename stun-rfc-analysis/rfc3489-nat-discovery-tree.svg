<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="500" y="36" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 3489 NAT 类型发现 — 完整决策树</text>
<text x="500" y="54" fill="#64748b" font-size="9" text-anchor="middle">Client 全程使用同一 socket | 6种可能结果</text>

<!-- ===== START: Test I ===== -->
<rect x="360" y="75" width="280" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="500" y="94" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">Test I: Client :5000 → Server A1:P1</text>
<text x="500" y="110" fill="#64748b" font-size="8" text-anchor="middle">无CHANGE-REQUEST | Server从(A1:P1)回</text>

<line x1="500" y1="119" x2="500" y2="145" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision: Response? -->
<polygon points="500,145 565,175 500,205 435,175" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="500" y="179" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到响应?</text>

<!-- No → UDP blocked -->
<line x1="565" y1="175" x2="730" y2="175" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="630" y="167" fill="#dc2626" font-size="8">否(超时9.5s)</text>
<rect x="730" y="160" width="150" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="805" y="179" fill="#dc2626" font-size="9" font-weight="600" text-anchor="middle">① UDP 被阻止</text>

<!-- Yes → continue -->
<line x1="500" y1="205" x2="500" y2="235" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="512" y="223" fill="#16a34a" font-size="8">是</text>

<!-- Decision: MAPPED = local? -->
<polygon points="500,235 580,270 500,305 420,270" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="500" y="267" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">MAPPED-ADDR</text>
<text x="500" y="280" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">== 本地地址?</text>

<!-- ===== LEFT BRANCH: No NAT ===== -->
<line x1="420" y1="270" x2="220" y2="270" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="330" y="262" fill="#16a34a" font-size="8">是 → 无NAT</text>

<!-- Test II (left) -->
<rect x="80" y="285" width="280" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="220" y="304" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Test II: Client → A1:P1, 换IP+换Port</text>
<text x="220" y="320" fill="#64748b" font-size="8" text-anchor="middle">Server从(A2:P2)响应 — 完全不同的地址</text>
<line x1="220" y1="270" x2="220" y2="285" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<line x1="220" y1="329" x2="220" y2="355" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="220,355 275,380 220,405 165,380" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
<text x="220" y="384" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到?</text>

<!-- Open internet -->
<line x1="275" y1="380" x2="380" y2="380" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="320" y="372" fill="#16a34a" font-size="8">是</text>
<rect x="380" y="365" width="130" height="30" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="445" y="384" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">② 开放网络</text>

<!-- Symmetric firewall -->
<line x1="220" y1="405" x2="220" y2="430" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="232" y="420" fill="#dc2626" font-size="8">否</text>
<rect x="120" y="430" width="200" height="30" rx="15" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="220" y="449" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">③ 对称UDP防火墙</text>

<!-- ===== RIGHT BRANCH: Has NAT ===== -->
<line x1="580" y1="270" x2="750" y2="270" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="660" y="262" fill="#dc2626" font-size="8">否 → 有NAT</text>

<!-- Test II (right) -->
<rect x="610" y="285" width="280" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="750" y="304" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Test II: Client → A1:P1, 换IP+换Port</text>
<text x="750" y="320" fill="#64748b" font-size="8" text-anchor="middle">Server从(A2:P2)响应 — 完全不同的地址</text>
<line x1="750" y1="270" x2="750" y2="285" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<line x1="750" y1="329" x2="750" y2="355" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="750,355 805,380 750,405 695,380" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
<text x="750" y="384" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到?</text>

<!-- Full Cone -->
<line x1="805" y1="380" x2="900" y2="380" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="845" y="372" fill="#16a34a" font-size="8">是</text>
<rect x="830" y="365" width="140" height="30" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="900" y="384" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">④ Full Cone NAT</text>

<!-- Continue to Test I' -->
<line x1="750" y1="405" x2="750" y2="435" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="762" y="423" fill="#dc2626" font-size="8">否</text>

<!-- Test I' -->
<rect x="580" y="435" width="340" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="750" y="454" fill="#5b21b6" font-size="10" font-weight="600" text-anchor="middle">Test I': Client :5000 → Server A2:P1 (换目标!)</text>
<text x="750" y="470" fill="#64748b" font-size="8" text-anchor="middle">无CHANGE-REQUEST | Server从(A2:P1)回 | 比较两次MAPPED</text>

<line x1="750" y1="479" x2="750" y2="510" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="750,510 820,540 750,570 680,540" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
<text x="750" y="537" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">MAPPED-ADDR</text>
<text x="750" y="550" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">变化了?</text>

<!-- Symmetric -->
<line x1="820" y1="540" x2="920" y2="540" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="865" y="532" fill="#dc2626" font-size="8">是(变了)</text>
<rect x="830" y="525" width="150" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="905" y="544" fill="#dc2626" font-size="9" font-weight="600" text-anchor="middle">⑤ Symmetric NAT</text>

<!-- Continue to Test III -->
<line x1="680" y1="540" x2="560" y2="540" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="620" y="532" fill="#16a34a" font-size="8">否(没变)</text>

<!-- Test III -->
<rect x="330" y="580" width="340" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="500" y="599" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">Test III: Client → A1:P1, 仅换Port</text>
<text x="500" y="615" fill="#64748b" font-size="8" text-anchor="middle">Server从(A1:P2)响应 — 同IP不同Port</text>
<line x1="500" y1="540" x2="500" y2="580" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<line x1="500" y1="624" x2="500" y2="655" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="500,655 560,680 500,705 440,680" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
<text x="500" y="684" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到?</text>

<!-- Restricted Cone -->
<line x1="560" y1="680" x2="700" y2="680" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="620" y="672" fill="#16a34a" font-size="8">是</text>
<rect x="700" y="665" width="180" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="790" y="684" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">⑥ Restricted Cone NAT</text>

<!-- Port Restricted Cone -->
<line x1="500" y1="705" x2="500" y2="735" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="512" y="723" fill="#dc2626" font-size="8">否</text>
<rect x="370" y="735" width="260" height="30" rx="15" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="500" y="754" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">⑦ Port Restricted Cone NAT</text>

<!-- ===== LEGEND ===== -->
<rect x="40" y="790" width="920" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="812" fill="#0f172a" font-size="10" font-weight="700">结果与穿透能力:</text>
<text x="60" y="832" fill="#16a34a" font-size="9">② 开放网络 | ④ Full Cone | ⑥ Restricted Cone | ⑦ Port Restricted Cone → P2P 打洞可行</text>
<text x="60" y="850" fill="#dc2626" font-size="9">① UDP阻止 | ③ 对称防火墙 | ⑤ Symmetric NAT → P2P 打洞不可行，需 TURN 中继</text>
<text x="60" y="868" fill="#64748b" font-size="8">Client 全程: 192.168.1.100:5000 (同一socket) | Server: A1=.1 A2=.2 P1=3478 P2=3479</text>
</svg>