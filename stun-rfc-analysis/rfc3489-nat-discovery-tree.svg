<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="500" y="34" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 3489 NAT 类型发现 — 完整决策树</text>
<text x="500" y="52" fill="#64748b" font-size="9" text-anchor="middle">Client 全程使用同一 socket | 共 7 种结果</text>

<!-- ===== Test I ===== -->
<rect x="380" y="68" width="280" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="520" y="87" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">Test I: Client :5000 → Server A1:P1</text>
<text x="520" y="103" fill="#64748b" font-size="8" text-anchor="middle">无 CHANGE-REQUEST | Server 从 (A1:P1) 响应</text>

<line x1="520" y1="112" x2="520" y2="136" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond 1: 收到响应? -->
<polygon points="520,138 585,166 520,194 455,166" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="170" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到响应?</text>

<!-- No → UDP blocked -->
<line x1="585" y1="166" x2="718" y2="166" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="650" y="158" fill="#dc2626" font-size="8" text-anchor="middle">否 (超时)</text>
<rect x="720" y="151" width="160" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="800" y="170" fill="#dc2626" font-size="9" font-weight="600" text-anchor="middle">① UDP 被阻止</text>

<!-- Yes ↓ -->
<line x1="520" y1="194" x2="520" y2="220" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="532" y="211" fill="#16a34a" font-size="8">是</text>

<!-- Diamond 2: MAPPED == local? -->
<polygon points="520,222 585,250 520,278 455,250" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="247" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">MAPPED-ADDR</text>
<text x="520" y="259" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">== 本地地址?</text>

<!-- LEFT branch (无NAT): L-shaped path from left vertex -->
<path d="M455,250 L180,250 L180,318" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="300" y="242" fill="#16a34a" font-size="8" text-anchor="middle">是 → 无 NAT</text>

<!-- RIGHT branch (有NAT): straight down -->
<line x1="520" y1="278" x2="520" y2="302" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="560" y="294" fill="#dc2626" font-size="8">否 → 有 NAT</text>

<!-- ===== LEFT COLUMN: No NAT ===== -->
<rect x="60" y="320" width="240" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="180" y="339" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">Test II: → A1:P1, 换IP+换Port</text>
<text x="180" y="355" fill="#64748b" font-size="8" text-anchor="middle">Server 从 (A2:P2) 响应</text>

<line x1="180" y1="364" x2="180" y2="388" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond: 收到? (left) -->
<polygon points="180,390 240,416 180,442 120,416" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="180" y="420" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到?</text>

<!-- Yes → 开放网络 -->
<line x1="240" y1="416" x2="288" y2="416" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="262" y="408" fill="#16a34a" font-size="8" text-anchor="middle">是</text>
<rect x="290" y="401" width="120" height="30" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="350" y="420" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">② 开放网络</text>

<!-- No → 对称UDP防火墙 -->
<line x1="180" y1="442" x2="180" y2="468" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="192" y="458" fill="#dc2626" font-size="8">否</text>
<rect x="90" y="470" width="180" height="30" rx="15" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="180" y="489" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">③ 对称 UDP 防火墙</text>

<!-- ===== MAIN SPINE: Has NAT ===== -->
<rect x="380" y="304" width="280" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="520" y="323" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Test II: → A1:P1, 换IP + 换Port</text>
<text x="520" y="339" fill="#64748b" font-size="8" text-anchor="middle">Server 从 (A2:P2) 响应（陌生地址）</text>

<line x1="520" y1="348" x2="520" y2="372" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond: 收到? -->
<polygon points="520,374 585,400 520,426 455,400" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="404" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到?</text>

<!-- Yes → Full Cone -->
<line x1="585" y1="400" x2="718" y2="400" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="650" y="392" fill="#16a34a" font-size="8" text-anchor="middle">是</text>
<rect x="720" y="385" width="160" height="30" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="800" y="404" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">④ Full Cone NAT</text>

<!-- No ↓ -->
<line x1="520" y1="426" x2="520" y2="452" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="532" y="443" fill="#dc2626" font-size="8">否</text>

<!-- Test I' -->
<rect x="370" y="452" width="300" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="520" y="471" fill="#5b21b6" font-size="10" font-weight="600" text-anchor="middle">Test I': Client :5000 → Server A2:P1</text>
<text x="520" y="487" fill="#64748b" font-size="8" text-anchor="middle">换目标IP | Server 从 (A2:P1) 回 | 比较两次 MAPPED</text>

<line x1="520" y1="496" x2="520" y2="520" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond: MAPPED 变? -->
<polygon points="520,522 585,548 520,574 455,548" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="552" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">MAPPED 变?</text>

<!-- Yes → Symmetric -->
<line x1="585" y1="548" x2="718" y2="548" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="650" y="540" fill="#dc2626" font-size="8" text-anchor="middle">是 (变了)</text>
<rect x="720" y="533" width="160" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="800" y="552" fill="#dc2626" font-size="9" font-weight="600" text-anchor="middle">⑤ Symmetric NAT</text>

<!-- No ↓ -->
<line x1="520" y1="574" x2="520" y2="600" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="532" y="591" fill="#16a34a" font-size="8">否</text>

<!-- Test III -->
<rect x="370" y="600" width="300" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="619" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">Test III: → A1:P1, 仅换 Port</text>
<text x="520" y="635" fill="#64748b" font-size="8" text-anchor="middle">Server 从 (A1:P2) 响应（同IP不同Port）</text>

<line x1="520" y1="644" x2="520" y2="668" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond: 收到? -->
<polygon points="520,670 585,696 520,722 455,696" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="700" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">收到?</text>

<!-- Yes → Restricted Cone -->
<line x1="585" y1="696" x2="698" y2="696" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<text x="640" y="688" fill="#16a34a" font-size="8" text-anchor="middle">是</text>
<rect x="700" y="681" width="180" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="790" y="700" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">⑥ Restricted Cone NAT</text>

<!-- No → Port Restricted Cone -->
<line x1="520" y1="722" x2="520" y2="748" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<text x="532" y="739" fill="#dc2626" font-size="8">否</text>
<rect x="390" y="750" width="260" height="30" rx="15" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="769" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">⑦ Port Restricted Cone NAT</text>

<!-- ===== LEGEND ===== -->
<rect x="40" y="800" width="920" height="84" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="822" fill="#0f172a" font-size="10" font-weight="700">结果与穿透能力</text>
<text x="60" y="843" fill="#16a34a" font-size="9">P2P 可行: ② 开放网络 | ④ Full Cone | ⑥ Restricted Cone | ⑦ Port Restricted Cone</text>
<text x="60" y="861" fill="#dc2626" font-size="9">P2P 不可行 (需 TURN 中继): ① UDP阻止 | ③ 对称UDP防火墙 | ⑤ Symmetric NAT</text>
<text x="60" y="878" fill="#64748b" font-size="8">Client = 192.168.1.100:5000 (全程同一socket) | Server: A1=203.0.113.1 A2=203.0.113.2 P1=3478 P2=3479</text>
</svg>