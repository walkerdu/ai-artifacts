<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="500" y="34" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">TURN 中继机制 — 当 P2P 直连失败时的兜底</text>
<text x="500" y="52" fill="#64748b" font-size="9" text-anchor="middle">TURN = Traversal Using Relays around NAT (RFC 5766/8656)，是 STUN 的扩展</text>

<!-- STUN vs TURN 对比 -->
<rect x="60" y="72" width="430" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="275" y="96" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">STUN: 镜子 (数据不经服务器)</text>
<circle cx="120" cy="140" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="144" fill="#1e40af" font-size="8" text-anchor="middle">A</text>
<circle cx="430" cy="140" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="430" y="144" fill="#1e40af" font-size="8" text-anchor="middle">B</text>
<line x1="142" y1="140" x2="408" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="275" y="132" fill="#16a34a" font-size="8" text-anchor="middle">P2P 直连</text>
<text x="275" y="172" fill="#64748b" font-size="8" text-anchor="middle">STUN Server 只在开始帮忙拿地址，之后退出</text>

<rect x="510" y="72" width="430" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="725" y="96" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">TURN: 中转站 (数据全程经服务器)</text>
<circle cx="570" cy="150" r="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="570" y="154" fill="#991b1b" font-size="8" text-anchor="middle">A</text>
<rect x="705" y="116" width="40" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="725" y="135" fill="#991b1b" font-size="8" text-anchor="middle">TURN</text>
<circle cx="880" cy="150" r="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="880" y="154" fill="#991b1b" font-size="8" text-anchor="middle">B</text>
<line x1="592" y1="148" x2="703" y2="135" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
<line x1="747" y1="135" x2="858" y2="148" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="725" y="180" fill="#64748b" font-size="8" text-anchor="middle">所有流量经 TURN 转发，服务器全程在线</text>

<!-- 详细流程 -->
<text x="60" y="222" fill="#0f172a" font-size="11" font-weight="700">TURN 工作流程 (A 想通过中继联系 B)</text>

<!-- Actors -->
<rect x="80" y="236" width="120" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="140" y="259" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Client A</text>
<text x="140" y="285" fill="#64748b" font-size="7" text-anchor="middle">Symmetric NAT后</text>

<rect x="440" y="236" width="120" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="259" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">TURN Server</text>
<text x="500" y="285" fill="#64748b" font-size="7" text-anchor="middle">公网 198.51.100.10</text>

<rect x="800" y="236" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="860" y="259" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">Peer B</text>

<!-- Lifelines -->
<line x1="140" y1="295" x2="140" y2="640" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="500" y1="295" x2="500" y2="640" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="860" y1="295" x2="860" y2="640" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

<!-- Step 1: Allocate -->
<line x1="140" y1="320" x2="498" y2="320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="320" y="312" fill="#2563eb" font-size="8" text-anchor="middle">① Allocate Request</text>
<line x1="498" y1="345" x2="142" y2="345" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="320" y="362" fill="#166534" font-size="8" text-anchor="middle">分配中继地址 (Relayed Transport Address)</text>
<text x="320" y="376" fill="#64748b" font-size="7" text-anchor="middle">如 198.51.100.10:50000 — 这是 A 的"中继候选"</text>

<!-- Step 2: 交换地址(信令) -->
<rect x="240" y="392" width="520" height="28" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
<text x="500" y="410" fill="#5b21b6" font-size="8" text-anchor="middle">② A 通过信令通道把中继地址 198.51.100.10:50000 告诉 B</text>

<!-- Step 3: CreatePermission -->
<line x1="140" y1="442" x2="498" y2="442" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="320" y="434" fill="#2563eb" font-size="8" text-anchor="middle">③ CreatePermission (授权 B 的地址)</text>
<text x="320" y="458" fill="#64748b" font-size="7" text-anchor="middle">告诉 TURN: 允许来自 B 的流量 (防止任意人滥用中继)</text>

<!-- Step 4: B sends to relay -->
<line x1="860" y1="490" x2="502" y2="490" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="680" y="482" fill="#166534" font-size="8" text-anchor="middle">④ B 发数据到中继地址 :50000</text>

<!-- Step 5: TURN relays to A (Data Indication) -->
<line x1="498" y1="515" x2="142" y2="515" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="320" y="507" fill="#dc2626" font-size="8" text-anchor="middle">⑤ Data Indication (转发B的数据给A)</text>

<!-- Step 6: A sends via Send Indication -->
<line x1="140" y1="555" x2="498" y2="555" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="320" y="547" fill="#dc2626" font-size="8" text-anchor="middle">⑥ Send Indication (A发数据,让TURN转给B)</text>
<line x1="502" y1="580" x2="858" y2="580" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="680" y="572" fill="#166534" font-size="8" text-anchor="middle">⑦ TURN 转发给 B</text>

<!-- 双向通道建立 -->
<rect x="80" y="600" width="840" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="500" y="623" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">✓ A ↔ TURN ↔ B 双向中继通道建立，全程流量经 TURN 转发</text>

<!-- TURN methods -->
<rect x="60" y="652" width="880" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="80" y="673" fill="#0f172a" font-size="9" font-weight="700">TURN 新增的 method (复用 STUN 消息格式):</text>
<text x="80" y="692" fill="#475569" font-size="8">Allocate(申请中继地址) | Refresh(续期) | CreatePermission(授权来源) | Send/Data Indication(收发数据) | ChannelBind(信道绑定,省开销)</text>
<text x="80" y="705" fill="#dc2626" font-size="8">代价: 占用服务器带宽和资源 → 所以 ICE 把 relay 候选优先级排最低，仅作兜底</text>
</svg>