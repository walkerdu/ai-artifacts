<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1250">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="550" y="36" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 3489 NAT 类型发现 — 各测试详细流程</text>
<text x="550" y="54" fill="#64748b" font-size="9" text-anchor="middle">每一步: 谁发、发给谁、用什么端口、服务器从哪响应、判断什么</text>

<!-- Prerequisites -->
<rect x="40" y="68" width="1020" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="90" fill="#0f172a" font-size="11" font-weight="700">前置条件</text>
<text x="60" y="110" fill="#475569" font-size="9">Server 绑定 4 个地址: (A1,P1)=203.0.113.1:3478  (A2,P1)=203.0.113.2:3478  (A1,P2)=203.0.113.1:3479  (A2,P2)=203.0.113.2:3479</text>
<text x="60" y="128" fill="#475569" font-size="9">Client 使用唯一 socket: 192.168.1.100:5000 — 全程不换 socket!</text>
<text x="60" y="148" fill="#dc2626" font-size="9" font-weight="600">核心约束: 客户端所有测试必须从同一个本地端口(5000)发出，否则无法比较映射结果</text>
<text x="60" y="163" fill="#64748b" font-size="8">默认端口 P1=3478 | 响应中 CHANGED-ADDRESS 告知 (A2,P2) 的值</text>

<!-- ===== TEST I ===== -->
<rect x="40" y="185" width="1020" height="235" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="40" y="185" width="1020" height="26" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="550" y="203" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">Test I — 基线: 获取反射地址</text>

<text x="60" y="232" fill="#0f172a" font-size="10" font-weight="600">发送方:</text>
<text x="150" y="232" fill="#475569" font-size="10">Client 192.168.1.100:5000</text>
<text x="500" y="232" fill="#0f172a" font-size="10" font-weight="600">目的地:</text>
<text x="580" y="232" fill="#475569" font-size="10">Server (A1:P1) = 203.0.113.1:3478</text>
<text x="60" y="252" fill="#0f172a" font-size="10" font-weight="600">CHANGE-REQUEST:</text>
<text x="220" y="252" fill="#475569" font-size="10">无 (不设置任何标志)</text>

<!-- Diagram -->
<rect x="80" y="270" width="130" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145" y="292" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Client :5000</text>

<rect x="310" y="270" width="80" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="350" y="292" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">NAT</text>

<rect x="490" y="270" width="170" height="36" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="575" y="292" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">Server A1:P1</text>

<line x1="210" y1="282" x2="308" y2="282" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<text x="260" y="275" fill="#2563eb" font-size="7" text-anchor="middle">Binding Req</text>
<line x1="390" y1="282" x2="488" y2="282" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<text x="440" y="275" fill="#92400e" font-size="7" text-anchor="middle">src→公网映射</text>

<line x1="488" y1="296" x2="390" y2="296" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="440" y="312" fill="#16a34a" font-size="7" text-anchor="middle">从(A1:P1)回</text>
<line x1="308" y1="296" x2="210" y2="296" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="260" y="312" fill="#16a34a" font-size="7" text-anchor="middle">Binding Resp</text>

<text x="700" y="278" fill="#0f172a" font-size="9" font-weight="600">Server 行为:</text>
<text x="700" y="295" fill="#475569" font-size="9">记录数据包源地址(NAT后的公网地址)</text>
<text x="700" y="312" fill="#475569" font-size="9">从 (A1:P1) 原路响应</text>

<text x="60" y="340" fill="#0f172a" font-size="10" font-weight="600">响应包含:</text>
<text x="180" y="340" fill="#475569" font-size="9">MAPPED-ADDRESS = Server看到的客户端源(公网IP:Port) | CHANGED-ADDRESS = (A2:P2)</text>

<text x="60" y="365" fill="#0f172a" font-size="10" font-weight="600">判断:</text>
<text x="130" y="365" fill="#16a34a" font-size="9">MAPPED-ADDRESS == localIP:localPort → 无NAT，走Test II(左分支)验证防火墙</text>
<text x="130" y="382" fill="#dc2626" font-size="9">MAPPED-ADDRESS != localIP:localPort → 有NAT，走Test II(右分支)判断类型</text>

<text x="60" y="406" fill="#7c3aed" font-size="9" font-weight="600">若超时无响应 → UDP被完全阻止，流程结束</text>

<!-- ===== TEST II ===== -->
<rect x="40" y="430" width="1020" height="235" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<rect x="40" y="430" width="1020" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="550" y="448" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Test II — 全变: 测试 NAT 是否允许"陌生地址"穿入</text>

<text x="60" y="477" fill="#0f172a" font-size="10" font-weight="600">发送方:</text>
<text x="150" y="477" fill="#475569" font-size="10">Client 192.168.1.100:5000 (同一 socket)</text>
<text x="500" y="477" fill="#0f172a" font-size="10" font-weight="600">目的地:</text>
<text x="580" y="477" fill="#475569" font-size="10">Server (A1:P1) = 203.0.113.1:3478 — 目的地不变!</text>
<text x="60" y="497" fill="#0f172a" font-size="10" font-weight="600">CHANGE-REQUEST:</text>
<text x="220" y="497" fill="#dc2626" font-size="10" font-weight="600">change IP + change port (A=1, B=1)</text>

<!-- Diagram -->
<rect x="80" y="515" width="130" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145" y="537" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Client :5000</text>

<rect x="310" y="515" width="80" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="350" y="537" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">NAT</text>

<rect x="490" y="510" width="170" height="20" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="575" y="524" fill="#64748b" font-size="8" text-anchor="middle">(A1:P1) 收到请求</text>
<rect x="490" y="534" width="170" height="20" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="575" y="548" fill="#166534" font-size="8" font-weight="600" text-anchor="middle">从 (A2:P2) 响应!</text>

<line x1="210" y1="528" x2="308" y2="528" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<line x1="390" y1="520" x2="488" y2="520" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<line x1="488" y1="544" x2="390" y2="544" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="440" y="560" fill="#16a34a" font-size="7" text-anchor="middle">从(A2:P2)=.2:3479回</text>
<line x1="308" y1="544" x2="210" y2="544" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>

<text x="700" y="522" fill="#0f172a" font-size="9" font-weight="600">Server 行为:</text>
<text x="700" y="539" fill="#475569" font-size="9">在(A1:P1)收到请求，读取CHANGE-REQUEST</text>
<text x="700" y="556" fill="#475569" font-size="9">从完全不同的(A2:P2)=.2:3479发响应</text>

<text x="60" y="582" fill="#0f172a" font-size="10" font-weight="600">本质:</text>
<text x="130" y="582" fill="#475569" font-size="9">Client 只给(A1:P1)发过包，NAT 只为(A1:P1)建了映射。现在(A2:P2)发来包，NAT 会放行吗?</text>

<text x="60" y="610" fill="#0f172a" font-size="10" font-weight="600">判断 (有NAT):</text>
<text x="200" y="610" fill="#16a34a" font-size="9">收到 → Full Cone NAT (映射对所有外部来源开放)</text>
<text x="200" y="627" fill="#dc2626" font-size="9">超时 → NAT 阻止了，继续 Test I' 进一步判断</text>

<text x="60" y="650" fill="#0f172a" font-size="10" font-weight="600">判断 (无NAT):</text>
<text x="200" y="650" fill="#16a34a" font-size="9">收到 → 完全开放网络</text>
<text x="400" y="650" fill="#dc2626" font-size="9">超时 → 对称UDP防火墙(有防火墙无NAT)</text>

<!-- ===== TEST I' ===== -->
<rect x="40" y="675" width="1020" height="240" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="40" y="675" width="1020" height="26" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="550" y="693" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="middle">Test I' — 映射一致性: 同源端口访问不同目标，映射是否变化</text>

<text x="60" y="722" fill="#0f172a" font-size="10" font-weight="600">发送方:</text>
<text x="150" y="722" fill="#475569" font-size="10">Client 192.168.1.100:5000 (同一 socket!)</text>
<text x="500" y="722" fill="#0f172a" font-size="10" font-weight="600">目的地:</text>
<text x="580" y="722" fill="#dc2626" font-size="10" font-weight="600">Server (A2:P1) = 203.0.113.2:3478 ← 换了目标IP!</text>
<text x="60" y="742" fill="#0f172a" font-size="10" font-weight="600">CHANGE-REQUEST:</text>
<text x="220" y="742" fill="#475569" font-size="10">无 (普通请求)</text>

<!-- Diagram -->
<rect x="80" y="760" width="130" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145" y="782" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Client :5000</text>

<rect x="310" y="760" width="80" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="350" y="782" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">NAT</text>

<rect x="490" y="760" width="170" height="36" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="575" y="782" fill="#5b21b6" font-size="9" font-weight="600" text-anchor="middle">Server A2:P1</text>

<line x1="210" y1="772" x2="308" y2="772" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow-violet)"/>
<text x="260" y="765" fill="#7c3aed" font-size="7" text-anchor="middle">Req(→A2:P1)</text>
<line x1="390" y1="772" x2="488" y2="772" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow-violet)"/>
<text x="440" y="765" fill="#92400e" font-size="7" text-anchor="middle">NAT映射</text>

<line x1="488" y1="786" x2="390" y2="786" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="440" y="802" fill="#16a34a" font-size="7" text-anchor="middle">从(A2:P1)回</text>
<line x1="308" y1="786" x2="210" y2="786" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>

<text x="700" y="772" fill="#0f172a" font-size="9" font-weight="600">Server 行为:</text>
<text x="700" y="789" fill="#475569" font-size="9">在(A2:P1)收到，无CHANGE-REQUEST</text>
<text x="700" y="806" fill="#475569" font-size="9">从(A2:P1)原路回，返回新MAPPED-ADDR</text>

<text x="60" y="832" fill="#0f172a" font-size="10" font-weight="600">本质:</text>
<text x="130" y="832" fill="#475569" font-size="9">Test I 发给 A1:P1 → NAT 分配了 ePort_1。现在同一socket发给 A2:P1 → NAT 分配 ePort_2。</text>
<text x="130" y="850" fill="#dc2626" font-size="9" font-weight="600">ePort_1 == ePort_2 ? 如果不等，说明 NAT 的映射随目标变化 → Symmetric NAT</text>

<text x="60" y="878" fill="#0f172a" font-size="10" font-weight="600">判断:</text>
<text x="130" y="878" fill="#dc2626" font-size="9">Test I' 的 MAPPED-ADDRESS ≠ Test I 的 → Symmetric NAT (STUN无法穿透，需TURN)</text>
<text x="130" y="896" fill="#16a34a" font-size="9">Test I' 的 MAPPED-ADDRESS == Test I 的 → Cone类NAT，继续 Test III 细分过滤规则</text>

<!-- ===== TEST III ===== -->
<rect x="40" y="925" width="1020" height="235" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<rect x="40" y="925" width="1020" height="26" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="550" y="943" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">Test III — 过滤精细度: NAT 是否检查来源端口</text>

<text x="60" y="972" fill="#0f172a" font-size="10" font-weight="600">发送方:</text>
<text x="150" y="972" fill="#475569" font-size="10">Client 192.168.1.100:5000 (同一 socket)</text>
<text x="500" y="972" fill="#0f172a" font-size="10" font-weight="600">目的地:</text>
<text x="580" y="972" fill="#475569" font-size="10">Server (A1:P1) = 203.0.113.1:3478 — 和 Test I 一样</text>
<text x="60" y="992" fill="#0f172a" font-size="10" font-weight="600">CHANGE-REQUEST:</text>
<text x="220" y="992" fill="#dc2626" font-size="10" font-weight="600">仅 change port (A=0, B=1)</text>

<!-- Diagram -->
<rect x="80" y="1010" width="130" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="145" y="1032" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Client :5000</text>

<rect x="310" y="1010" width="80" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="350" y="1032" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">NAT</text>

<rect x="490" y="1005" width="170" height="20" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
<text x="575" y="1019" fill="#64748b" font-size="8" text-anchor="middle">(A1:P1) 收到请求</text>
<rect x="490" y="1029" width="170" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="575" y="1043" fill="#92400e" font-size="8" font-weight="600" text-anchor="middle">从 (A1:P2) 响应!</text>

<line x1="210" y1="1022" x2="308" y2="1022" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<line x1="390" y1="1015" x2="488" y2="1015" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<line x1="488" y1="1039" x2="390" y2="1039" stroke="#d97706" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="440" y="1055" fill="#d97706" font-size="7" text-anchor="middle">从(A1:P2)=.1:3479回</text>
<line x1="308" y1="1039" x2="210" y2="1039" stroke="#d97706" stroke-width="1.3" marker-end="url(#arrow)"/>

<text x="700" y="1017" fill="#0f172a" font-size="9" font-weight="600">Server 行为:</text>
<text x="700" y="1034" fill="#475569" font-size="9">在(A1:P1)收到，仅换Port</text>
<text x="700" y="1051" fill="#475569" font-size="9">从(A1:P2)=203.0.113.1:3479响应</text>

<text x="60" y="1080" fill="#0f172a" font-size="10" font-weight="600">本质:</text>
<text x="130" y="1080" fill="#475569" font-size="9">Client 之前给 A1:P1 发过包，NAT 记录了 (A1,P1)。现在从 (A1,P2) 来包 — IP相同但Port不同。</text>
<text x="130" y="1098" fill="#dc2626" font-size="9" font-weight="600">NAT 过滤时是否也检查 Port? 还是只检查 IP?</text>

<text x="60" y="1126" fill="#0f172a" font-size="10" font-weight="600">判断:</text>
<text x="130" y="1126" fill="#16a34a" font-size="9">收到响应 → Restricted Cone NAT (过滤只看IP，不看Port → 同IP任何Port都放行)</text>
<text x="130" y="1144" fill="#dc2626" font-size="9">超时无响应 → Port Restricted Cone NAT (过滤同时看IP+Port → 必须精确匹配)</text>

<!-- Bottom summary -->
<rect x="40" y="1175" width="1020" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="550" y="1195" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">总结: 所有请求都从同一 Client socket(192.168.1.100:5000) 发出</text>
<text x="550" y="1213" fill="#475569" font-size="9" text-anchor="middle">Test I/II/III 发给 (A1:P1), Test I' 发给 (A2:P1) | 服务器根据 CHANGE-REQUEST 决定从哪个(IP:Port)响应</text>
<text x="550" y="1229" fill="#475569" font-size="9" text-anchor="middle">Test I判"有无NAT" → Test II判"Full Cone?" → Test I'判"Symmetric?" → Test III判"Restricted还是Port Restricted?"</text>
</svg>