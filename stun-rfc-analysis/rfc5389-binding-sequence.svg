<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="450" y="40" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">RFC 5389 STUN Binding 交互时序</text>
<text x="450" y="58" fill="#64748b" font-size="9" text-anchor="middle">客户端通过 NAT 获取反射地址的完整流程</text>

<!-- Actors -->
<rect x="100" y="80" width="140" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="170" y="100" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">STUN Client</text>
<text x="170" y="115" fill="#64748b" font-size="8" text-anchor="middle">192.168.1.100:5000</text>

<rect x="370" y="80" width="100" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="420" y="100" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">NAT</text>
<text x="420" y="115" fill="#64748b" font-size="8" text-anchor="middle">地址映射</text>

<rect x="610" y="80" width="140" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="680" y="100" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">STUN Server</text>
<text x="680" y="115" fill="#64748b" font-size="8" text-anchor="middle">203.0.113.1:3478</text>

<!-- Lifelines -->
<line x1="170" y1="124" x2="170" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="420" y1="124" x2="420" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="680" y1="124" x2="680" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

<!-- Step 1: Binding Request -->
<line x1="170" y1="170" x2="408" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="290" y="162" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">Binding Request</text>
<text x="290" y="185" fill="#64748b" font-size="8" text-anchor="middle">src: 192.168.1.100:5000</text>

<!-- Step 2: NAT mapping -->
<line x1="432" y1="210" x2="668" y2="210" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="550" y="202" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">NAT 转换后转发</text>
<text x="550" y="225" fill="#64748b" font-size="8" text-anchor="middle">src 变为: 203.0.113.5:62000</text>

<!-- Step 3: Server records source -->
<rect x="640" y="250" width="80" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="680" y="269" fill="#166534" font-size="8" font-weight="500" text-anchor="middle">记录源地址</text>

<!-- Step 4: Binding Response -->
<line x1="668" y1="310" x2="432" y2="310" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="550" y="302" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">Binding Success Response</text>

<line x1="408" y1="340" x2="182" y2="340" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="290" y="332" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">NAT 转换回传</text>

<!-- XOR-MAPPED-ADDRESS detail -->
<rect x="50" y="360" width="240" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="170" y="380" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">XOR-MAPPED-ADDRESS:</text>
<text x="170" y="398" fill="#475569" font-size="9" text-anchor="middle">203.0.113.5:62000 (XOR编码)</text>

<!-- Step 5: Client gets reflexive address -->
<rect x="80" y="430" width="180" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="170" y="447" fill="#1e40af" font-size="9" font-weight="600" text-anchor="middle">获得反射地址</text>
<text x="170" y="462" fill="#64748b" font-size="8" text-anchor="middle">上报给 ICE 候选列表</text>
<line x1="170" y1="410" x2="170" y2="430" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- UDP retransmission note -->
<rect x="530" y="380" width="280" height="80" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
<text x="670" y="400" fill="#854d0e" font-size="9" font-weight="600" text-anchor="middle">UDP 重传策略 (RFC 5389)</text>
<text x="670" y="418" fill="#64748b" font-size="8" text-anchor="middle">初始 RTO &gt; 500ms</text>
<text x="670" y="434" fill="#64748b" font-size="8" text-anchor="middle">每次翻倍，最多 Rc=7 次重传</text>
<text x="670" y="450" fill="#854d0e" font-size="8" text-anchor="middle">总超时 = RTO × Rm (Rm=16, 约39.5s)</text>

<!-- Message structure mini -->
<rect x="50" y="490" width="800" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="450" y="510" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">消息头结构 (20 bytes)</text>

<rect x="70" y="525" width="30" height="30" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="85" y="544" fill="#991b1b" font-size="7" font-weight="500" text-anchor="middle">00</text>
<text x="85" y="555" fill="#64748b" font-size="6" text-anchor="middle">2b</text>

<rect x="105" y="525" width="130" height="30" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="170" y="544" fill="#1e40af" font-size="8" font-weight="500" text-anchor="middle">Message Type (14b)</text>

<rect x="240" y="525" width="130" height="30" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="305" y="544" fill="#166534" font-size="8" font-weight="500" text-anchor="middle">Length (16b)</text>

<rect x="375" y="525" width="200" height="30" rx="2" fill="#fffbeb" stroke="#fde047" stroke-width="1"/>
<text x="475" y="544" fill="#854d0e" font-size="8" font-weight="500" text-anchor="middle">Magic Cookie = 0x2112A442 (32b)</text>

<rect x="580" y="525" width="250" height="30" rx="2" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
<text x="705" y="544" fill="#5b21b6" font-size="8" font-weight="500" text-anchor="middle">Transaction ID (96b)</text>

<!-- Bottom note -->
<text x="450" y="598" fill="#64748b" font-size="8" text-anchor="middle">STUN 只是"镜子" — 告诉客户端"我看到你的公网地址是什么"，不负责穿透</text>
</svg>