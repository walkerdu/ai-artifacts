<svg viewBox="0 0 1200 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linux audit filter lists 时序流程与规则例子</title>
  <desc id="desc">以纵向时间轴展示进程从 fork 到日志落盘的生命周期，标注每个阶段命中的 audit filter list 及其规则例子。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', monospace; }
      .h1 { fill:#0f172a; font-size:27px; font-weight:700; }
      .sub { fill:#64748b; font-size:13px; font-weight:400; }
      .stage { fill:#0f172a; font-size:14px; font-weight:700; }
      .stagesub { fill:#94a3b8; font-size:11px; font-weight:400; }
      .name { fill:#0f172a; font-size:18px; font-weight:700; }
      .use { fill:#475569; font-size:12.5px; font-weight:400; }
      .code { fill:#0f172a; font-size:13px; font-weight:700; }
      .note { fill:#64748b; font-size:11px; font-weight:400; }
      .axis { fill:#94a3b8; font-size:11px; font-weight:700; letter-spacing:1px; }
      .foot { fill:#334155; font-size:13px; font-weight:400; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1060" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="1060" fill="url(#grid)"/>

  <text x="48" y="54" class="h1">Linux audit：一次进程执行的审计时序</text>
  <text x="48" y="80" class="sub">纵向 = 时间推进（fork → syscall → 生成日志 → 落盘）。每个阶段命中的 filter list 标在右侧。</text>

  <text x="70" y="150" class="axis">◀ 用户态旁路</text>
  <text x="360" y="150" class="axis">时间轴 · syscall 生命周期</text>
  <text x="610" y="150" class="axis">命中的 FILTER LIST + 规则例子 ▶</text>

  <!-- vertical timeline spine x=300 -->
  <line x1="300" y1="238" x2="300" y2="330" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="300" y1="386" x2="300" y2="478" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="300" y1="534" x2="300" y2="654" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="300" y1="710" x2="300" y2="818" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>

  <!-- ============ STAGE A: fork/clone → task ============ -->
  <rect x="220" y="182" width="160" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="206" text-anchor="middle" class="stage">fork / clone</text>
  <text x="300" y="225" text-anchor="middle" class="stagesub">创建新 task</text>
  <line x1="380" y1="210" x2="466" y2="210" stroke="#f87171" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="466" y="164" width="700" height="120" rx="13" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="492" y="196" class="name">task</text>
  <text x="492" y="221" class="use">最早决定：这个进程 / 线程是否参与后续审计</text>
  <rect x="492" y="234" width="380" height="30" rx="7" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="506" y="254" class="code">-a never,task</text>
  <text x="890" y="253" class="note">⚠ 命中后，后续 execve /</text>
  <text x="890" y="269" class="note">open 等规则都记不到</text>

  <!-- ============ STAGE B: syscall running → io_uring ============ -->
  <rect x="220" y="330" width="160" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="354" text-anchor="middle" class="stage">syscall 执行</text>
  <text x="300" y="373" text-anchor="middle" class="stagesub">open / exec / I/O 提交</text>
  <line x1="380" y1="358" x2="466" y2="358" stroke="#10b981" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <rect x="466" y="318" width="700" height="96" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="492" y="350" class="name">io_uring</text>
  <text x="492" y="375" class="use">异步 I/O 提交路径（不走普通同步 syscall）</text>
  <rect x="492" y="384" width="460" height="30" rx="7" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
  <text x="506" y="404" class="code">-a always,io_uring -S openat -k async_open</text>

  <!-- ============ STAGE C: syscall exit → exit + filesystem ============ -->
  <rect x="220" y="478" width="160" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="502" text-anchor="middle" class="stage">syscall 退出</text>
  <text x="300" y="521" text-anchor="middle" class="stagesub">结果已知，即将返回</text>
  <line x1="380" y1="506" x2="466" y2="506" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="466" y="446" width="700" height="164" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="492" y="478" class="name">exit</text>
  <text x="492" y="503" class="use">最常用：审计 syscall 结果，可按条件过滤</text>
  <rect x="492" y="516" width="500" height="30" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="506" y="536" class="code">-a always,exit -F arch=b64 -S execve -k exec</text>
  <rect x="492" y="554" width="500" height="30" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="506" y="574" class="code">-a never,filesystem -F fstype=tracefs</text>
  <text x="492" y="600" class="note">同一环节：filesystem list 按文件系统类型（tracefs / debugfs…）整体降噪</text>

  <!-- ============ STAGE D: build record → exclude (+ user bypass) ============ -->
  <rect x="220" y="654" width="160" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="678" text-anchor="middle" class="stage">生成 record</text>
  <text x="300" y="697" text-anchor="middle" class="stagesub">准备写日志</text>
  <line x1="380" y1="682" x2="466" y2="682" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="466" y="636" width="700" height="112" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="492" y="668" class="name">exclude</text>
  <text x="492" y="693" class="use">record 生成阶段，按 msgtype 整条丢弃</text>
  <rect x="492" y="706" width="460" height="30" rx="7" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <text x="506" y="726" class="code">-a never,exclude -F msgtype=CWD</text>

  <!-- user bypass on the left -->
  <rect x="48" y="636" width="150" height="112" rx="13" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="70" y="668" class="name">user</text>
  <text x="70" y="691" class="note">用户态消息旁路</text>
  <text x="70" y="708" class="note">登录 / AVC 等</text>
  <rect x="66" y="716" width="114" height="24" rx="6" fill="#ffffff" stroke="#ec4899" stroke-width="1.2"/>
  <text x="76" y="732" class="code" font-size="9.5">never,user</text>
  <line x1="198" y1="682" x2="214" y2="682" stroke="#db2777" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ============ STAGE E: auditd ============ -->
  <rect x="212" y="818" width="176" height="60" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="300" y="843" text-anchor="middle" class="stage" fill="#1d4ed8">auditd 落盘</text>
  <text x="300" y="862" text-anchor="middle" class="stagesub">最终审计日志</text>

  <!-- ============ footer ============ -->
  <rect x="48" y="910" width="1118" height="130" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="72" y="944" class="name" font-size="16">怎么选 list</text>
  <circle cx="82" cy="972" r="4" fill="#f59e0b"/>
  <text x="100" y="977" class="foot">审计命令执行 / 文件 / 网络 / 权限变更 → 写 <tspan font-weight="700">exit</tspan>（最常用）</text>
  <circle cx="82" cy="1002" r="4" fill="#10b981"/>
  <text x="100" y="1007" class="foot">整类文件系统或异步 I/O → <tspan font-weight="700">filesystem</tspan> / <tspan font-weight="700">io_uring</tspan></text>
  <circle cx="640" cy="972" r="4" fill="#dc2626"/>
  <text x="658" y="977" class="foot">按日志类型降噪 → <tspan font-weight="700">exclude</tspan>（syscall）/ <tspan font-weight="700">user</tspan>（用户态）</text>
  <circle cx="640" cy="1002" r="4" fill="#f87171"/>
  <text x="658" y="1007" class="foot"><tspan font-weight="700">never,task</tspan> 在时间轴最前，会让整个任务不参与审计——最危险</text>
  <text x="72" y="1030" class="note">注：早期 entry list（syscall 进入时触发）在现代系统已不推荐，规则应改写到 exit。</text>
</svg>
