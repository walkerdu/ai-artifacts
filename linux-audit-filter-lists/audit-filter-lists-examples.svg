<svg viewBox="0 0 1180 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linux audit filter lists 时序流程与规则例子</title>
  <desc id="desc">以纵向时间轴展示进程从 fork 到日志落盘的生命周期，标注每个阶段命中的 audit filter list 及其规则例子。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', monospace; }
      .h1 { fill:#0f172a; font-size:27px; font-weight:700; }
      .sub { fill:#64748b; font-size:13px; font-weight:400; }
      .stage { fill:#0f172a; font-size:14px; font-weight:700; }
      .stagesub { fill:#94a3b8; font-size:11px; font-weight:400; }
      .name { fill:#0f172a; font-size:17px; font-weight:700; }
      .use { fill:#475569; font-size:12px; font-weight:400; }
      .code { fill:#0f172a; font-size:12.5px; font-weight:700; }
      .note { fill:#64748b; font-size:10.5px; font-weight:400; }
      .axis { fill:#94a3b8; font-size:11px; font-weight:700; letter-spacing:1px; }
      .foot { fill:#334155; font-size:13px; font-weight:400; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="1000" fill="#ffffff"/>
  <rect x="0" y="0" width="1180" height="1000" fill="url(#grid)"/>

  <text x="48" y="54" class="h1">Linux audit：一次进程执行的审计时序</text>
  <text x="48" y="80" class="sub">纵向 = 时间推进（fork → syscall → 生成日志 → 落盘）。每个阶段会命中哪个 filter list，就在旁边标出。</text>

  <text x="70" y="150" class="axis">◀ 用户态旁路</text>
  <text x="590" y="150" class="axis">时间轴 / syscall 生命周期</text>
  <text x="770" y="150" class="axis">命中的 FILTER + 例子 ▶</text>

  <!-- vertical timeline spine x=440 -->
  <line x1="440" y1="220" x2="440" y2="316" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="440" y1="368" x2="440" y2="464" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="440" y1="516" x2="440" y2="612" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="440" y1="664" x2="440" y2="768" stroke="#cbd5e1" stroke-width="3" marker-end="url(#ahb)"/>

  <!-- STAGE A: fork/clone -->
  <rect x="360" y="168" width="160" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="190" text-anchor="middle" class="stage">fork / clone</text>
  <text x="440" y="208" text-anchor="middle" class="stagesub">创建新 task</text>
  <line x1="520" y1="194" x2="606" y2="194" stroke="#f87171" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- task card -->
  <rect x="606" y="146" width="510" height="108" rx="13" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="626" y="176" class="name">task</text>
  <text x="700" y="176" class="use">最早决定：这个进程/线程是否参与后续审计</text>
  <rect x="626" y="188" width="360" height="30" rx="7" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="640" y="208" class="code">-a never,task</text>
  <text x="626" y="242" class="note">⚠ 命中后，后面的 execve/open 等 syscall 规则基本都记录不到</text>

  <!-- STAGE B: syscall running -->
  <rect x="360" y="316" width="160" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="338" text-anchor="middle" class="stage">syscall 执行</text>
  <text x="440" y="356" text-anchor="middle" class="stagesub">open / exec / I/O 提交</text>
  <line x1="520" y1="342" x2="606" y2="342" stroke="#10b981" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <!-- io_uring card -->
  <rect x="606" y="300" width="510" height="88" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="626" y="330" class="name">io_uring</text>
  <text x="720" y="330" class="use">异步 I/O 提交路径（不走普通同步 syscall）</text>
  <rect x="626" y="344" width="440" height="30" rx="7" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
  <text x="640" y="364" class="code">-a always,io_uring -S openat -k async_open</text>

  <!-- STAGE C: syscall exit -->
  <rect x="360" y="464" width="160" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="486" text-anchor="middle" class="stage">syscall 退出</text>
  <text x="440" y="504" text-anchor="middle" class="stagesub">结果已知，即将返回</text>
  <line x1="520" y1="490" x2="606" y2="490" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- exit card (with filesystem) -->
  <rect x="606" y="430" width="510" height="140" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="626" y="458" class="name">exit</text>
  <text x="690" y="458" class="use">最常用：审计 syscall 结果，可按条件过滤</text>
  <rect x="626" y="470" width="470" height="30" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="640" y="490" class="code">-a always,exit -F arch=b64 -S execve -k exec</text>
  <rect x="626" y="506" width="470" height="30" rx="7" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="640" y="526" class="code">-a never,filesystem -F fstype=tracefs</text>
  <text x="626" y="558" class="note">同一环节：filesystem list 按文件系统类型（tracefs/debugfs…）整体排除降噪</text>

  <!-- STAGE D: build record -->
  <rect x="360" y="612" width="160" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="634" text-anchor="middle" class="stage">生成 record</text>
  <text x="440" y="652" text-anchor="middle" class="stagesub">准备写日志</text>
  <line x1="520" y1="638" x2="606" y2="638" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- exclude card -->
  <rect x="606" y="596" width="510" height="88" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="626" y="626" class="name">exclude</text>
  <text x="720" y="626" class="use">record 生成阶段，按 msgtype 整条丢弃</text>
  <rect x="626" y="640" width="440" height="30" rx="7" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <text x="640" y="660" class="code">-a never,exclude -F msgtype=CWD</text>
  <!-- user bypass (left side, enters record stage) -->
  <rect x="70" y="596" width="270" height="88" rx="13" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="90" y="624" class="name">user</text>
  <text x="152" y="624" class="use">用户态消息旁路</text>
  <text x="90" y="644" class="note">登录/认证/SELinux AVC 等，非 syscall</text>
  <rect x="90" y="650" width="232" height="26" rx="6" fill="#ffffff" stroke="#ec4899" stroke-width="1.2"/>
  <text x="102" y="668" class="code" font-size="11">-a never,user -F msgtype=USER_AVC</text>
  <line x1="340" y1="638" x2="358" y2="638" stroke="#db2777" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- STAGE E: auditd -->
  <rect x="352" y="768" width="176" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="440" y="792" text-anchor="middle" class="stage" fill="#1d4ed8">auditd 落盘</text>
  <text x="440" y="810" text-anchor="middle" class="stagesub">最终审计日志</text>

  <!-- footer -->
  <rect x="48" y="856" width="1068" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="72" y="888" class="name" font-size="16">怎么选 list</text>
  <circle cx="80" cy="914" r="3.5" fill="#f59e0b"/>
  <text x="96" y="919" class="foot">审计命令执行 / 文件 / 网络 / 权限变更 → 写 <tspan font-weight="700">exit</tspan>（最常用）</text>
  <circle cx="80" cy="940" r="3.5" fill="#10b981"/>
  <text x="96" y="945" class="foot">整类文件系统或异步 I/O → <tspan font-weight="700">filesystem</tspan> / <tspan font-weight="700">io_uring</tspan></text>
  <circle cx="640" cy="914" r="3.5" fill="#dc2626"/>
  <text x="656" y="919" class="foot">按日志类型降噪 → <tspan font-weight="700">exclude</tspan>（syscall）/ <tspan font-weight="700">user</tspan>（用户态）</text>
  <circle cx="640" cy="940" r="3.5" fill="#f87171"/>
  <text x="656" y="945" class="foot"><tspan font-weight="700">never,task</tspan> 位于时间轴最前，会让整个任务不参与审计——最危险</text>
  <text x="72" y="966" class="note">注：早期 entry list（syscall 进入时触发）在现代系统已不推荐，规则应改写到 exit。</text>
</svg>
