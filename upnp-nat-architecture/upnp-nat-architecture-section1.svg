<svg viewBox="0 0 1080 880" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'PingFang SC', 'Helvetica Neue', 'Menlo', sans-serif; }
    .t-title { font-size: 17px; font-weight: 700; fill: #1e293b; }
    .t-sub   { font-size: 9px;  font-weight: 400; fill: #64748b; }
    .t-band  { font-size: 10px; font-weight: 600; fill: #475569; letter-spacing: 1px; }
    .t-name  { font-size: 12px; font-weight: 600; fill: #1e293b; }
    .t-desc  { font-size: 9px;  font-weight: 400; fill: #64748b; }
    .t-mono  { font-size: 8.5px; font-weight: 400; fill: #334155; }
    .t-flow  { font-size: 9px;  font-weight: 600; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <!-- 优化箭头: 流线型贝塞尔弧线 -->
    <marker id="a-cyan" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1,1 C 3,2.5 3,2.5 12,4.5 C 3,6.5 3,6.5 1,8 L 3.5,4.5 Z" fill="#0891b2"/>
    </marker>
    <marker id="a-blue" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1,1 C 3.5,2.8 3.5,2.8 13,5 C 3.5,7.2 3.5,7.2 1,9 L 3.8,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1,1 C 3,2.5 3,2.5 12,4.5 C 3,6.5 3,6.5 1,8 L 3.5,4.5 Z" fill="#ea580c"/>
    </marker>
    <marker id="a-rose" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1,1 C 3,2.5 3,2.5 12,4.5 C 3,6.5 3,6.5 1,8 L 3.5,4.5 Z" fill="#e11d48"/>
    </marker>
    <marker id="a-teal" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1,1 C 3,2.5 3,2.5 12,4.5 C 3,6.5 3,6.5 1,8 L 3.5,4.5 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 浅色背景 -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="42" class="t-title">UPnP 映射 vs NAT 动态映射 · 分层架构 &amp; 数据流</text>
  <text x="40" y="60" class="t-sub">ROUTER · Linux Netfilter / miniupnpd — 控制平面分离，数据平面统一于 nf_conntrack</text>

  <!-- ============ ARROWS (drawn first, behind boxes) ============ -->
  <!-- ① UPnP 控制流: LAN -> miniupnpd -->
  <path d="M 468,185 C 400,205 320,235 255,275" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6,4" stroke-linecap="round" marker-end="url(#a-cyan)"/>
  <!-- miniupnpd -> MINIUPNPD 子链 -->
  <path d="M 235,405 C 235,425 235,445 235,468" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6,4" stroke-linecap="round" marker-end="url(#a-cyan)"/>
  <!-- ② 入站转发流: WAN -> PREROUTING -->
  <path d="M 988,185 L 988,488 Q 988,508 968,508" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
  <!-- PREROUTING -> MINIUPNPD 子链 -->
  <path d="M 558,555 L 506,555" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a-blue)"/>
  <!-- ③ 出站伪装流: LAN -> PAT -->
  <path d="M 592,185 C 660,205 770,235 835,275" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4,3" stroke-linecap="round" marker-end="url(#a-orange)"/>
  <!-- PAT -> conntrack -->
  <path d="M 835,405 C 835,490 835,575 835,660" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4,3" stroke-linecap="round" marker-end="url(#a-orange)"/>
  <!-- 静态规则 -> PREROUTING -->
  <path d="M 545,405 C 585,425 650,450 700,470" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="7,3" stroke-linecap="round" marker-end="url(#a-rose)"/>
  <!-- MINIUPNPD 子链 -> conntrack -->
  <path d="M 300,598 C 300,620 300,640 300,660" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-teal)"/>
  <!-- PREROUTING -> conntrack -->
  <path d="M 820,598 C 820,620 820,640 820,655" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#a-blue)"/>

  <!-- arrow labels (位置调整避免覆盖) -->
  <text x="340" y="215" class="t-flow" fill="#0891b2" text-anchor="middle">① 申请映射</text>
  <text x="210" y="440" class="t-flow" fill="#0891b2" text-anchor="middle">写入子链</text>
  <text x="1010" y="350" class="t-flow" fill="#2563eb" text-anchor="start">② 入站 :8080</text>
  <text x="532" y="548" class="t-flow" fill="#2563eb" text-anchor="middle">jump MINIUPNPD</text>
  <text x="730" y="215" class="t-flow" fill="#ea580c" text-anchor="middle">③ 出站 → PAT 分配端口</text>
  <text x="855" y="540" class="t-flow" fill="#ea580c">建立 conntrack</text>
  <text x="640" y="448" class="t-flow" fill="#e11d48">priority1 DNAT</text>
  <text x="265" y="638" class="t-flow" fill="#059669">规则落地</text>

  <!-- ============ ENDPOINTS ============ -->
  <!-- LAN client -->
  <rect x="430" y="90" width="200" height="92" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="530" y="116" class="t-name" text-anchor="middle" fill="#0891b2">LAN 客户端</text>
  <text x="530" y="134" class="t-mono" text-anchor="middle">192.168.1.10</text>
  <line x1="450" y1="144" x2="610" y2="144" stroke="#e2e8f0"/>
  <text x="530" y="160" class="t-desc" text-anchor="middle" fill="#0891b2">SOAP AddPortMapping</text>
  <text x="530" y="174" class="t-desc" text-anchor="middle" fill="#ea580c">主动出站连接</text>

  <!-- WAN -->
  <rect x="850" y="90" width="190" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="945" y="116" class="t-name" text-anchor="middle" fill="#475569">WAN / 公网</text>
  <text x="945" y="134" class="t-mono" text-anchor="middle">203.0.113.5</text>
  <line x1="870" y1="144" x2="1020" y2="144" stroke="#e2e8f0"/>
  <text x="945" y="160" class="t-desc" text-anchor="middle" fill="#2563eb">入站 → :8080</text>
  <text x="945" y="174" class="t-desc" text-anchor="middle" fill="#059669">出站回包</text>

  <!-- ============ ROUTER CONTAINER ============ -->
  <rect x="40" y="230" width="1000" height="620" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="12,4"/>
  <text x="58" y="252" fill="#64748b" font-size="10" font-weight="700" letter-spacing="2">ROUTER · LINUX NETFILTER</text>

  <!-- ===== APPLICATION LAYER ===== -->
  <rect x="70" y="264" width="940" height="158" rx="10" fill="rgba(248,250,252,0.6)" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="84" y="284" class="t-band">APPLICATION LAYER · 控制平面</text>

  <!-- miniupnpd -->
  <rect x="100" y="296" width="270" height="110" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="116" y="320" class="t-name" fill="#0891b2">miniupnpd</text>
  <text x="116" y="336" class="t-desc">UPnP IGD daemon · 独立映射表</text>
  <line x1="116" y1="346" x2="354" y2="346" stroke="#e2e8f0"/>
  <text x="116" y="364" class="t-desc" fill="#334155">• UPnPMappingTable 应用层表</text>
  <text x="116" y="380" class="t-desc" fill="#334155">• 租期定时器 / 描述 / Enabled</text>
  <text x="116" y="396" class="t-desc" fill="#334155">• libiptc / libnftnl 调内核</text>

  <!-- 静态规则 -->
  <rect x="410" y="296" width="210" height="110" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="426" y="320" class="t-name" fill="#e11d48">静态规则</text>
  <text x="426" y="336" class="t-desc">/etc/config/firewall</text>
  <line x1="426" y1="346" x2="604" y2="346" stroke="#fecdd3"/>
  <text x="426" y="364" class="t-desc" fill="#334155">• 用户手工配置 · 持久化</text>
  <text x="426" y="380" class="t-desc" fill="#334155">• 重启自动加载</text>
  <text x="426" y="396" class="t-desc" fill="#e11d48">• 优先级最高 priority 1</text>

  <!-- PAT / NAPT -->
  <rect x="700" y="296" width="270" height="110" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="716" y="320" class="t-name" fill="#ea580c">PAT / NAPT 引擎</text>
  <text x="716" y="336" class="t-desc">出站自动伪装</text>
  <line x1="716" y1="346" x2="954" y2="346" stroke="#fed7aa"/>
  <text x="716" y="364" class="t-desc" fill="#334155">• 内核 SNAT / MASQUERADE</text>
  <text x="716" y="380" class="t-desc" fill="#334155">• 随机选择外部端口</text>
  <text x="716" y="396" class="t-desc" fill="#334155">• 无应用层元数据</text>

  <!-- ===== NETFILTER LAYER ===== -->
  <rect x="70" y="456" width="940" height="158" rx="10" fill="rgba(248,250,252,0.6)" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="84" y="476" class="t-band">NETFILTER · iptables / nftables · 规则平面</text>

  <!-- MINIUPNPD 子链 -->
  <rect x="100" y="488" width="404" height="110" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="116" y="512" class="t-name" fill="#0891b2">MINIUPNPD 自定义子链</text>
  <text x="116" y="528" class="t-desc">隔离子链 · miniupnpd 原子更新</text>
  <rect x="116" y="538" width="372" height="22" rx="3" fill="#f1f5f9"/>
  <text x="124" y="553" class="t-mono">-p tcp --dport 8080 -j DNAT --to 192.168.1.10:80</text>
  <rect x="116" y="564" width="372" height="22" rx="3" fill="#f1f5f9"/>
  <text x="124" y="579" class="t-mono">-p udp --dport 5060 -j DNAT --to 192.168.1.20:5060</text>

  <!-- nat/PREROUTING -->
  <rect x="560" y="488" width="412" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="576" y="512" class="t-name" fill="#2563eb">nat / PREROUTING（入站匹配链）</text>
  <rect x="576" y="522" width="380" height="20" rx="3" fill="#fff1f2"/>
  <text x="584" y="536" class="t-mono" fill="#e11d48">1 → static DNAT        (priority 1)</text>
  <rect x="576" y="546" width="380" height="20" rx="3" fill="#ecfeff"/>
  <text x="584" y="560" class="t-mono" fill="#0891b2">2 → jump MINIUPNPD     (priority 2)</text>
  <rect x="576" y="570" width="380" height="18" rx="3" fill="#f1f5f9"/>
  <text x="584" y="583" class="t-mono" fill="#64748b">3 → default / fallthrough</text>

  <!-- ===== KERNEL LAYER ===== -->
  <rect x="70" y="650" width="940" height="178" rx="10" fill="rgba(248,250,252,0.6)" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="84" y="670" class="t-band" fill="#7c3aed">KERNEL · nf_conntrack（共享数据平面）</text>
  <text x="84" y="685" class="t-desc">所有规则最终都在此建立五元组连接条目，UPnP 与动态 NAT 在数据平面统一</text>

  <rect x="100" y="696" width="870" height="118" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- table header -->
  <text x="116" y="716" class="t-mono" fill="#7c3aed" font-weight="600">PROTO    SRC               DST               DPORT   STATE          SOURCE</text>
  <line x1="116" y1="722" x2="954" y2="722" stroke="#e9d5ff"/>
  <rect x="116" y="728" width="838" height="18" rx="3" fill="#ecfeff"/>
  <text x="124" y="741" class="t-mono" fill="#0891b2">tcp      203.0.113.5       192.168.1.10      80      ESTABLISHED    UPnP</text>
  <rect x="116" y="750" width="838" height="18" rx="3" fill="#fff7ed"/>
  <text x="124" y="763" class="t-mono" fill="#ea580c">tcp      192.168.1.30      142.250.1.1       443     ESTABLISHED    DYN-NAT</text>
  <rect x="116" y="772" width="838" height="18" rx="3" fill="#fff1f2"/>
  <text x="124" y="785" class="t-mono" fill="#e11d48">tcp      198.51.100.7      192.168.1.5       22      ESTABLISHED    STATIC</text>
  <rect x="116" y="794" width="838" height="16" rx="3" fill="#f1f5f9"/>
  <text x="124" y="806" class="t-mono" fill="#64748b">udp      192.168.1.40      8.8.8.8           53      ASSURED        DYN-NAT</text>

  <!-- ============ LEGEND (bottom) ============ -->
  <text x="40" y="862" class="t-flow" fill="#64748b">数据流：</text>
  <line x1="92" y1="858" x2="122" y2="858" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="128" y="862" class="t-flow" fill="#0891b2">① UPnP 控制</text>
  <line x1="222" y1="858" x2="252" y2="858" stroke="#2563eb" stroke-width="2.2"/>
  <text x="258" y="862" class="t-flow" fill="#2563eb">② 入站转发</text>
  <line x1="348" y1="858" x2="378" y2="858" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4,3"/>
  <text x="384" y="862" class="t-flow" fill="#ea580c">③ 出站伪装</text>
  <line x1="474" y1="858" x2="504" y2="858" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="7,3"/>
  <text x="510" y="862" class="t-flow" fill="#e11d48">静态 DNAT</text>
  <line x1="588" y1="858" x2="618" y2="858" stroke="#059669" stroke-width="2.2"/>
  <text x="624" y="862" class="t-flow" fill="#059669">规则落地 conntrack</text>
</svg>
