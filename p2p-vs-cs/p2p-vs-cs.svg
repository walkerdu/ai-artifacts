<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    text { font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="peerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
    <linearGradient id="vsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <!-- Shadows -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="glowBlue">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
    <filter id="glowPurple">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.2"/>
    </filter>
    <!-- Dot pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Title area -->
  <text x="450" y="42" fill="#0f172a" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-0.5">网络架构对比</text>
  <line x1="350" y1="52" x2="550" y2="52" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left panel background -->
  <rect x="30" y="70" width="390" height="420" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>
  <!-- Right panel background -->
  <rect x="480" y="70" width="390" height="420" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>

  <!-- ===== LEFT: Client-Server ===== -->
  <!-- Section header -->
  <rect x="50" y="85" width="180" height="28" rx="14" fill="#eff6ff"/>
  <text x="140" y="104" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle">Client-Server</text>

  <!-- Central Server - larger, prominent -->
  <rect x="165" y="230" width="120" height="72" rx="12" fill="url(#serverGrad)" filter="url(#glowBlue)"/>
  <text x="225" y="260" fill="white" font-size="13" font-weight="700" text-anchor="middle">SERVER</text>
  <text x="225" y="280" fill="rgba(255,255,255,0.8)" font-size="9" font-weight="500" text-anchor="middle">中央服务器</text>
  <!-- Server icon (simple rack lines) -->
  <line x1="205" y1="290" x2="245" y2="290" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Clients as rounded pill shapes -->
  <!-- Client A (top-left) -->
  <rect x="65" y="140" width="100" height="44" rx="22" fill="url(#clientGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="88" cy="162" r="10" fill="#22c55e" opacity="0.2"/>
  <circle cx="88" cy="162" r="5" fill="#22c55e"/>
  <text x="125" y="166" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Client A</text>

  <!-- Client B (top-right) -->
  <rect x="285" y="140" width="100" height="44" rx="22" fill="url(#clientGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="308" cy="162" r="10" fill="#22c55e" opacity="0.2"/>
  <circle cx="308" cy="162" r="5" fill="#22c55e"/>
  <text x="345" y="166" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Client B</text>

  <!-- Client C (bottom-left) -->
  <rect x="55" y="340" width="100" height="44" rx="22" fill="url(#clientGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="78" cy="362" r="10" fill="#22c55e" opacity="0.2"/>
  <circle cx="78" cy="362" r="5" fill="#22c55e"/>
  <text x="115" y="366" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Client C</text>

  <!-- Client D (bottom-right) -->
  <rect x="295" y="340" width="100" height="44" rx="22" fill="url(#clientGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="318" cy="362" r="10" fill="#22c55e" opacity="0.2"/>
  <circle cx="318" cy="362" r="5" fill="#22c55e"/>
  <text x="355" y="366" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Client D</text>

  <!-- Client E (bottom-center) -->
  <rect x="175" y="395" width="100" height="44" rx="22" fill="url(#clientGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="198" cy="417" r="10" fill="#22c55e" opacity="0.2"/>
  <circle cx="198" cy="417" r="5" fill="#22c55e"/>
  <text x="235" y="421" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Client E</text>

  <!-- Connection lines (C/S) - elegant curved paths -->
  <path d="M 130 184 Q 170 210 185 230" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 320 184 Q 280 210 265 230" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120 340 Q 160 315 185 302" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 330 340 Q 290 315 265 302" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 225 395 L 225 302" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

  <!-- Small arrows on C/S connections -->
  <circle cx="160" cy="210" r="3" fill="#3b82f6"/>
  <circle cx="290" cy="210" r="3" fill="#3b82f6"/>
  <circle cx="155" cy="318" r="3" fill="#3b82f6"/>
  <circle cx="295" cy="318" r="3" fill="#3b82f6"/>
  <circle cx="225" cy="345" r="3" fill="#3b82f6"/>

  <!-- ===== RIGHT: P2P ===== -->
  <!-- Section header -->
  <rect x="500" y="85" width="180" height="28" rx="14" fill="#faf5ff"/>
  <text x="590" y="104" fill="#7c3aed" font-size="12" font-weight="700" text-anchor="middle">Peer-to-Peer</text>

  <!-- P2P nodes arranged in a hexagonal/circular layout -->
  <!-- Peer A (top-center) -->
  <rect x="625" y="135" width="100" height="44" rx="22" fill="url(#peerGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)"/>
  <circle cx="648" cy="157" r="10" fill="#a855f7" opacity="0.2"/>
  <circle cx="648" cy="157" r="5" fill="#a855f7"/>
  <text x="685" y="161" fill="#581c87" font-size="10" font-weight="600" text-anchor="middle">Peer A</text>

  <!-- Peer B (right) -->
  <rect x="730" y="235" width="100" height="44" rx="22" fill="url(#peerGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)"/>
  <circle cx="753" cy="257" r="10" fill="#a855f7" opacity="0.2"/>
  <circle cx="753" cy="257" r="5" fill="#a855f7"/>
  <text x="790" y="261" fill="#581c87" font-size="10" font-weight="600" text-anchor="middle">Peer B</text>

  <!-- Peer C (bottom-right) -->
  <rect x="690" y="355" width="100" height="44" rx="22" fill="url(#peerGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)"/>
  <circle cx="713" cy="377" r="10" fill="#a855f7" opacity="0.2"/>
  <circle cx="713" cy="377" r="5" fill="#a855f7"/>
  <text x="750" y="381" fill="#581c87" font-size="10" font-weight="600" text-anchor="middle">Peer C</text>

  <!-- Peer D (bottom-left) -->
  <rect x="520" y="355" width="100" height="44" rx="22" fill="url(#peerGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)"/>
  <circle cx="543" cy="377" r="10" fill="#a855f7" opacity="0.2"/>
  <circle cx="543" cy="377" r="5" fill="#a855f7"/>
  <text x="580" y="381" fill="#581c87" font-size="10" font-weight="600" text-anchor="middle">Peer D</text>

  <!-- Peer E (left) -->
  <rect x="510" y="235" width="100" height="44" rx="22" fill="url(#peerGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)"/>
  <circle cx="533" cy="257" r="10" fill="#a855f7" opacity="0.2"/>
  <circle cx="533" cy="257" r="5" fill="#a855f7"/>
  <text x="570" y="261" fill="#581c87" font-size="10" font-weight="600" text-anchor="middle">Peer E</text>

  <!-- P2P mesh connections - smooth curves -->
  <!-- A-B -->
  <path d="M 710 170 Q 740 200 740 235" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- A-E -->
  <path d="M 635 170 Q 600 200 600 235" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- A-C -->
  <path d="M 690 179 Q 730 280 730 355" fill="none" stroke="#d8b4fe" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- A-D -->
  <path d="M 645 179 Q 600 280 580 355" fill="none" stroke="#d8b4fe" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- B-C -->
  <path d="M 770 279 Q 760 320 755 355" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- B-E -->
  <path d="M 730 257 L 610 257" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- B-D -->
  <path d="M 740 279 Q 660 330 610 355" fill="none" stroke="#d8b4fe" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- C-D -->
  <path d="M 690 377 L 620 377" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- C-E -->
  <path d="M 700 355 Q 640 310 595 279" fill="none" stroke="#d8b4fe" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- D-E -->
  <path d="M 555 355 Q 555 310 555 279" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ===== VS Divider ===== -->
  <circle cx="450" cy="280" r="24" fill="url(#vsGrad)" filter="url(#softShadow)"/>
  <text x="450" y="286" fill="white" font-size="13" font-weight="800" text-anchor="middle">VS</text>

  <!-- ===== Bottom comparison bar ===== -->
  <!-- Left features -->
  <rect x="50" y="500" width="160" height="24" rx="12" fill="#fee2e2"/>
  <text x="130" y="516" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">单点故障 SPOF</text>

  <rect x="220" y="500" width="180" height="24" rx="12" fill="#fef3c7"/>
  <text x="310" y="516" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">集中负载 · 易管控</text>

  <!-- Right features -->
  <rect x="500" y="500" width="160" height="24" rx="12" fill="#dcfce7"/>
  <text x="580" y="516" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">无单点故障</text>

  <rect x="670" y="500" width="180" height="24" rx="12" fill="#e0e7ff"/>
  <text x="760" y="516" fill="#3730a3" font-size="9" font-weight="600" text-anchor="middle">分布式负载 · 难管控</text>

  <!-- Bottom summary -->
  <text x="225" y="548" fill="#64748b" font-size="9" font-weight="500" text-anchor="middle">所有流量经过中央服务器</text>
  <text x="675" y="548" fill="#64748b" font-size="9" font-weight="500" text-anchor="middle">节点对等直连，去中心化</text>
</svg>