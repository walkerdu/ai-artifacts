<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 820">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
</style>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
</marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
</marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
</marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/>
</marker>
<marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
</marker>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
</pattern>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="30" y="36" fill="#1e293b" font-size="16" font-weight="700">BitTorrent Tracker 协议 — 完整时序</text>
<text x="30" y="54" fill="#64748b" font-size="9" font-weight="400">BEP 3 / BEP 15 (HTTP/UDP Tracker Protocol)</text>

<rect x="80" y="70" width="140" height="48" rx="8" fill="#ffffff"/>
<rect x="80" y="70" width="140" height="48" rx="8" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="96" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">BT 客户端</text>
<text x="150" y="110" fill="#64748b" font-size="9" text-anchor="middle">qBittorrent etc.</text>

<rect x="360" y="70" width="140" height="48" rx="8" fill="#ffffff"/>
<rect x="360" y="70" width="140" height="48" rx="8" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.5"/>
<text x="430" y="96" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Tracker</text>
<text x="430" y="110" fill="#64748b" font-size="9" text-anchor="middle">HTTP/UDP Server</text>

<rect x="600" y="70" width="140" height="48" rx="8" fill="#ffffff"/>
<rect x="600" y="70" width="140" height="48" rx="8" fill="rgba(13,148,136,0.08)" stroke="#0d9488" stroke-width="1.5"/>
<text x="670" y="96" fill="#1e293b" font-size="12" font-weight="600" text-anchor="middle">Peers (Swarm)</text>
<text x="670" y="110" fill="#64748b" font-size="9" text-anchor="middle">Seeders + Leechers</text>

<line x1="150" y1="118" x2="150" y2="790" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="430" y1="118" x2="430" y2="790" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="670" y1="118" x2="670" y2="790" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>

<rect x="90" y="140" width="120" height="36" rx="4" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1"/>
<text x="150" y="163" fill="#2563eb" font-size="9" font-weight="500" text-anchor="middle">解析 .torrent</text>

<circle cx="67" cy="210" r="10" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
<text x="67" y="213" fill="#2563eb" font-size="8" font-weight="600" text-anchor="middle">1</text>
<line x1="152" y1="210" x2="426" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="289" y="200" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">GET /announce?event=started</text>
<text x="289" y="224" fill="#64748b" font-size="8" text-anchor="middle">info_hash, peer_id, port, uploaded, downloaded, left</text>

<rect x="425" y="200" width="10" height="40" rx="2" fill="rgba(217,119,6,0.15)" stroke="#d97706" stroke-width="1"/>

<circle cx="67" cy="270" r="10" fill="rgba(217,119,6,0.1)" stroke="#d97706" stroke-width="1"/>
<text x="67" y="273" fill="#d97706" font-size="8" font-weight="600" text-anchor="middle">2</text>
<line x1="426" y1="270" x2="152" y2="270" stroke="#d97706" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-amber)"/>
<text x="289" y="260" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">Response (Bencoded dict)</text>
<text x="289" y="284" fill="#64748b" font-size="8" text-anchor="middle">interval, complete, incomplete, peers[ip:port...]</text>

<circle cx="67" cy="340" r="10" fill="rgba(13,148,136,0.1)" stroke="#0d9488" stroke-width="1"/>
<text x="67" y="343" fill="#0d9488" font-size="8" font-weight="600" text-anchor="middle">3</text>
<line x1="152" y1="340" x2="666" y2="340" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<text x="410" y="330" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">TCP connect + BT handshake</text>
<text x="410" y="354" fill="#64748b" font-size="8" text-anchor="middle">protocol header + info_hash + peer_id → bitfield 交换</text>

<rect x="80" y="380" width="630" height="130" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="80" y="380" width="50" height="18" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="105" y="393" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">loop</text>
<text x="140" y="393" fill="#94a3b8" font-size="8" font-style="italic">[every interval seconds]</text>

<circle cx="67" cy="430" r="10" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
<text x="67" y="433" fill="#2563eb" font-size="8" font-weight="600" text-anchor="middle">4</text>
<line x1="152" y1="430" x2="426" y2="430" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="289" y="420" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">GET /announce (no event)</text>
<text x="289" y="444" fill="#64748b" font-size="8" text-anchor="middle">汇报 uploaded/downloaded/left 进度</text>

<circle cx="67" cy="485" r="10" fill="rgba(217,119,6,0.1)" stroke="#d97706" stroke-width="1"/>
<text x="67" y="488" fill="#d97706" font-size="8" font-weight="600" text-anchor="middle">5</text>
<line x1="426" y1="485" x2="152" y2="485" stroke="#d97706" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-amber)"/>
<text x="289" y="475" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">Updated peers list</text>
<text x="289" y="499" fill="#64748b" font-size="8" text-anchor="middle">新加入的 peers 或替换已断线的</text>

<circle cx="67" cy="555" r="10" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
<text x="67" y="558" fill="#2563eb" font-size="8" font-weight="600" text-anchor="middle">6</text>
<line x1="152" y1="555" x2="426" y2="555" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="289" y="545" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">GET /announce?event=completed</text>
<text x="289" y="569" fill="#64748b" font-size="8" text-anchor="middle">下载完成,left=0,自己变为 seeder</text>

<rect x="425" y="545" width="10" height="30" rx="2" fill="rgba(217,119,6,0.15)" stroke="#d97706" stroke-width="1"/>

<line x1="426" y1="600" x2="152" y2="600" stroke="#d97706" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-amber)"/>
<text x="289" y="614" fill="#64748b" font-size="8" text-anchor="middle">OK (更新 complete 计数)</text>

<circle cx="67" cy="660" r="10" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
<text x="67" y="663" fill="#2563eb" font-size="8" font-weight="600" text-anchor="middle">7</text>
<line x1="152" y1="660" x2="426" y2="660" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="289" y="650" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">GET /announce?event=stopped</text>
<text x="289" y="674" fill="#64748b" font-size="8" text-anchor="middle">客户端退出,请求 Tracker 移除自己</text>

<line x1="30" y1="710" x2="750" y2="710" stroke="#e2e8f0" stroke-width="1"/>
<text x="30" y="730" fill="#64748b" font-size="9" font-weight="600">可选: scrape 接口</text>

<circle cx="67" cy="760" r="10" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="1"/>
<text x="67" y="763" fill="#7c3aed" font-size="8" font-weight="600" text-anchor="middle">*</text>
<line x1="152" y1="760" x2="426" y2="760" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="289" y="750" fill="#1e293b" font-size="10" font-weight="500" text-anchor="middle">GET /scrape?info_hash=...</text>
<line x1="426" y1="785" x2="152" y2="785" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
<text x="289" y="800" fill="#64748b" font-size="8" text-anchor="middle">complete(做种数), downloaded(完成次数), incomplete(下载中)</text>
</svg>