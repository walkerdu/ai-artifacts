<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1140">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
</pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
</marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
</marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="30" y="36" fill="#0f172a" font-size="16" font-weight="700">get_peers 迭代查找算法 (贪心收敛，非指数展开)</text>
<text x="30" y="56" fill="#64748b" font-size="9">全局候选列表 + alpha=3 并行 + 只保留 K=8 最近 → 总请求 9~15 次 UDP</text>

<rect x="30" y="76" width="860" height="100" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="50" y="100" fill="#1e3a5f" font-size="12" font-weight="600">初始化</text>
<text x="50" y="124" fill="#334155" font-size="11">从自己的路由表中，取离 target 最近的 K=8 个节点</text>
<text x="50" y="144" fill="#334155" font-size="11">放入 candidate_list，全部标记为"未查询"，按 d(node, target) 排序</text>
<text x="50" y="164" fill="#64748b" font-size="9">参数: alpha=3 (每轮并行数)，K=8 (列表容量)</text>

<line x1="460" y1="176" x2="460" y2="206" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<rect x="30" y="206" width="860" height="370" rx="16" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="8,4"/>
<rect x="30" y="206" width="70" height="22" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
<text x="65" y="221" fill="#064e3b" font-size="9" font-weight="600" text-anchor="middle">loop</text>

<text x="60" y="250" fill="#064e3b" font-size="12" font-weight="600">Step A: 挑选 (从池子里选最优的)</text>
<rect x="60" y="262" width="800" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="80" y="286" fill="#334155" font-size="11">从 candidate_list 中取 alpha=3 个 "未查询" 且距离最近的节点</text>
<text x="80" y="306" fill="#64748b" font-size="9">不是 8 个全问! 只挑最近的 3 个，减少网络开销</text>

<line x1="460" y1="322" x2="460" y2="344" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<text x="60" y="362" fill="#064e3b" font-size="12" font-weight="600">Step B: 并行查询 (UDP get_peers)</text>
<rect x="60" y="374" width="800" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="80" y="398" fill="#334155" font-size="11">同时向这 3 个节点发 get_peers(target)，标记为"已查询"</text>
<text x="80" y="418" fill="#334155" font-size="11">每个节点返回它认为离 target 最近的 K=8 个节点 → 共收到约 24 个</text>

<line x1="460" y1="434" x2="460" y2="456" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<text x="60" y="474" fill="#064e3b" font-size="12" font-weight="600">Step C: 筛选合并 (关键! 防止指数爆炸)</text>
<rect x="60" y="486" width="800" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="80" y="510" fill="#334155" font-size="11">把约 24 个新节点合并入 candidate_list (去重)</text>
<text x="80" y="530" fill="#78350f" font-size="11" font-weight="500">按 d(node, target) 重新排序，只保留最近的 K=8 个!</text>
<text x="80" y="550" fill="#64748b" font-size="9">多余的全部丢弃 → 列表大小恒定为 8，不会膨胀</text>

<path d="M840 562 Q870 490 840 430" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
<text x="854" y="498" fill="#dc2626" font-size="9" font-weight="500">循环</text>

<rect x="30" y="600" width="860" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="50" y="624" fill="#991b1b" font-size="12" font-weight="600">终止条件</text>
<text x="50" y="648" fill="#334155" font-size="11">candidate_list 中最近的 K=8 个节点全部标记为"已查询"</text>
<text x="50" y="668" fill="#334155" font-size="11">且本轮没有任何新节点能进入 top-8 → 收敛，停止循环</text>
<text x="50" y="688" fill="#64748b" font-size="9">此时 candidate_list 里的 8 个就是全网离 target 最近的 8 个节点</text>

<text x="460" y="734" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">具体执行示例 (target = 0xE0)</text>

<rect x="30" y="752" width="860" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

<text x="50" y="780" fill="#1d4ed8" font-size="11" font-weight="600">Round 0: 初始化</text>
<text x="50" y="800" fill="#334155" font-size="10">candidate_list = [N1(d=50), N2(d=80), N3(d=95), N4(d=120), N5(d=130), N6(d=140), N7(d=200), N8(d=220)]</text>
<text x="50" y="816" fill="#64748b" font-size="9">全部未查询</text>

<text x="50" y="844" fill="#047857" font-size="11" font-weight="600">Round 1: 挑 alpha=3 个最近的 → 问 N1(d=50), N2(d=80), N3(d=95)</text>
<text x="50" y="864" fill="#334155" font-size="10">N1 返回 [X1(d=12), X2(d=30), ...8个]  N2 返回 [Y1(d=18), ...8个]  N3 返回 [Z1(d=45), ...8个]</text>
<text x="50" y="884" fill="#b45309" font-size="10" font-weight="500">合并去重+排序+截断 → 新 list = [X1(d=12), Y1(d=18), X2(d=30), ...]  只留 8 个!</text>
<text x="50" y="900" fill="#64748b" font-size="9">最近距离: 50 → 12，大幅缩小!</text>

<text x="50" y="928" fill="#047857" font-size="11" font-weight="600">Round 2: 挑最近未查询的 3 个 → 问 X1(d=12), Y1(d=18), X2(d=30)</text>
<text x="50" y="948" fill="#334155" font-size="10">X1 返回 [P1(d=3), P2(d=5), ...8个]  更近了!</text>
<text x="50" y="968" fill="#b45309" font-size="10" font-weight="500">合并截断 → 新 list = [P1(d=3), P2(d=5), X1(d=12), ...]</text>
<text x="50" y="984" fill="#64748b" font-size="9">最近距离: 12 → 3</text>

<text x="50" y="1012" fill="#047857" font-size="11" font-weight="600">Round 3: 问 P1(d=3), P2(d=5), 下一个未查询的</text>
<text x="50" y="1032" fill="#334155" font-size="10">P1 返回的节点都不比现有 top-8 更近 → list 不变</text>
<text x="50" y="1052" fill="#dc2626" font-size="10" font-weight="500">top-8 全部已查询，无新节点进入 → 收敛! 结束!</text>

<text x="50" y="1080" fill="#1e293b" font-size="10" font-weight="600">总计: 3 轮 x 3 并行 = 9 次 UDP 请求，候选列表始终 = 8 个</text>
<text x="50" y="1100" fill="#64748b" font-size="9">对比: 如果全展开 → 8 x 8 x 8 = 512 次请求 (指数爆炸)</text>
</svg>