<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1180">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
</pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
</marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
</marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
</marker>
<marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
</marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="30" y="36" fill="#0f172a" font-size="16" font-weight="700">DHT 中种子 Peers 的查找、注册与持续同步</text>
<text x="30" y="56" fill="#64748b" font-size="9">以 info_hash = 0xE0 为例，展示 get_peers → announce_peer → 定期刷新 的完整生命周期</text>

<rect x="30" y="76" width="860" height="370" rx="16" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="76" width="260" height="22" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="160" y="91" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">阶段 1: 查找 (get_peers 迭代收敛)</text>

<rect x="60" y="112" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="140" y="134" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">我 (0x14)</text>
<text x="140" y="150" fill="#1d4ed8" font-size="9" text-anchor="middle">要找 0xE0 的 peers</text>

<rect x="310" y="112" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="390" y="134" fill="#064e3b" font-size="11" font-weight="600" text-anchor="middle">Node A (0x62)</text>
<text x="390" y="150" fill="#047857" font-size="9" text-anchor="middle">d(A, 0xE0) = 130</text>

<rect x="560" y="112" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="640" y="134" fill="#064e3b" font-size="11" font-weight="600" text-anchor="middle">Node B (0xD4)</text>
<text x="640" y="150" fill="#047857" font-size="9" text-anchor="middle">d(B, 0xE0) = 52</text>

<rect x="720" y="190" width="160" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="800" y="212" fill="#78350f" font-size="11" font-weight="600" text-anchor="middle">Node C (0xE2)</text>
<text x="800" y="228" fill="#b45309" font-size="9" text-anchor="middle">d(C, 0xE0) = 2 (最近!)</text>

<line x1="220" y1="136" x2="306" y2="136" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="263" y="128" fill="#1d4ed8" font-size="8" font-weight="500" text-anchor="middle">get_peers</text>

<line x1="470" y1="136" x2="556" y2="136" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="513" y="128" fill="#047857" font-size="8" font-weight="500" text-anchor="middle">返回更近的</text>

<line x1="660" y1="160" x2="724" y2="196" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="708" y="174" fill="#047857" font-size="8" font-weight="500">更近</text>

<text x="60" y="190" fill="#334155" font-size="10">距离收敛过程:</text>
<text x="60" y="210" fill="#334155" font-size="10">我(d=244) → A(d=130) → B(d=52) → C(d=2)</text>
<text x="60" y="230" fill="#64748b" font-size="9">每跳距离缩小，3 跳收敛到离 0xE0 最近的节点</text>

<rect x="60" y="256" width="810" height="86" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="80" y="280" fill="#064e3b" font-size="11" font-weight="600">最终: 向 C (0xE2) 发送 get_peers(0xE0)</text>
<text x="80" y="302" fill="#334155" font-size="10">C 检查本地 peer 存储:</text>
<text x="80" y="322" fill="#047857" font-size="10" font-weight="500">有记录! peers[0xE0] = [1.2.3.4:6881, 5.6.7.8:6881, 9.0.1.2:6881]</text>
<text x="80" y="336" fill="#64748b" font-size="9">同时返回一个 token (用于后续 announce 验证身份)</text>

<rect x="60" y="360" width="810" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="80" y="384" fill="#1e3a5f" font-size="11" font-weight="600">收敛结果: 候选列表中离 0xE0 最近的 K=8 个已确认节点</text>
<text x="80" y="404" fill="#334155" font-size="10">[C(0xE2), D(0xE7), E(0xD4), F(0xE9), G(0xF2), H(0xDB), I(0xEE), J(0xD0)]</text>
<text x="80" y="420" fill="#64748b" font-size="9">这 8 个节点就是 info_hash 0xE0 的"记录员"</text>

<rect x="30" y="470" width="860" height="200" rx="16" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="470" width="260" height="22" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="160" y="485" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">阶段 2: 注册 (announce_peer)</text>

<rect x="60" y="506" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="140" y="528" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">我 (0x14)</text>
<text x="140" y="544" fill="#1d4ed8" font-size="9" text-anchor="middle">port=6881</text>

<line x1="220" y1="530" x2="336" y2="530" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<line x1="220" y1="530" x2="336" y2="570" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<line x1="220" y1="530" x2="336" y2="610" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="270" y="520" fill="#dc2626" font-size="8" font-weight="500">announce_peer</text>

<rect x="340" y="510" width="520" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="600" y="534" fill="#991b1b" font-size="10" text-anchor="middle">→ C(0xE2): announce_peer(0xE0, port=6881, token=xxx)</text>

<rect x="340" y="556" width="520" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="600" y="580" fill="#991b1b" font-size="10" text-anchor="middle">→ D(0xE7): announce_peer(0xE0, port=6881, token=yyy)</text>

<rect x="340" y="602" width="520" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="600" y="626" fill="#991b1b" font-size="10" text-anchor="middle">→ ... 共向 K=8 个最近节点都发 announce</text>

<text x="60" y="660" fill="#64748b" font-size="9">每个收到 announce 的节点在本地记录: peers[0xE0].append(我的IP:6881, 过期=30min)</text>

<rect x="30" y="694" width="860" height="200" rx="16" fill="none" stroke="#6d28d9" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="694" width="260" height="22" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1"/>
<text x="160" y="709" fill="#4c1d95" font-size="10" font-weight="600" text-anchor="middle">阶段 3: 定期刷新 (保持注册)</text>

<rect x="60" y="730" width="810" height="148" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
<text x="80" y="756" fill="#4c1d95" font-size="11" font-weight="600">每 15~30 分钟重复一次:</text>

<text x="80" y="784" fill="#334155" font-size="10">1. 重新执行 get_peers(0xE0) 迭代查找</text>
<text x="80" y="804" fill="#334155" font-size="10">2. 找到当前最新的 K 个最近节点 (可能有变化，有节点上下线)</text>
<text x="80" y="824" fill="#334155" font-size="10">3. 重新 announce_peer → 刷新过期时间</text>

<text x="80" y="852" fill="#dc2626" font-size="10" font-weight="500">如果我关闭客户端 → 不再 announce → 30 分钟后记录自动过期删除</text>
<text x="80" y="872" fill="#64748b" font-size="9">这就是 DHT 的自清理: 无需"注销"操作，不续费就自动消失</text>

<rect x="30" y="918" width="860" height="230" rx="16" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="918" width="320" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="190" y="933" fill="#78350f" font-size="10" font-weight="600" text-anchor="middle">记录员节点 C (0xE2) 的本地存储视角</text>

<rect x="60" y="954" width="810" height="178" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>

<text x="80" y="980" fill="#78350f" font-size="11" font-weight="600">C 节点的两个独立数据结构:</text>

<text x="80" y="1010" fill="#1d4ed8" font-size="10" font-weight="600">路由表 (K-bucket) — 用于路由</text>
<text x="80" y="1030" fill="#334155" font-size="10">160 个桶，各存最多 8 个 [Node ID, IP, Port]</text>

<text x="80" y="1060" fill="#dc2626" font-size="10" font-weight="600">Peer 存储 — 用于应答 get_peers</text>
<text x="80" y="1080" fill="#334155" font-size="10">peers[0xE0] = [{ip:1.2.3.4, port:6881, expire:30min},</text>
<text x="80" y="1098" fill="#334155" font-size="10">              {ip:5.6.7.8, port:6881, expire:28min}, ...]</text>
<text x="80" y="1116" fill="#334155" font-size="10">peers[0xE5] = [{...}, {...}]   (C 离 0xE5 也近，也负责这个)</text>
<text x="80" y="1134" fill="#64748b" font-size="9">C 负责的 info_hash 数量取决于它的 ID 附近有多少活跃种子</text>
</svg>