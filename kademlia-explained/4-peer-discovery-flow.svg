<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
</pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
</marker>
<marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
</marker>
<marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
</marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
</marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="30" y="36" fill="#0f172a" font-size="16" font-weight="700">BT 客户端 Peer 发现完整流程</text>
<text x="30" y="56" fill="#64748b" font-size="9">打开 .torrent 文件后，Tracker / DHT / PEX 三通道并行查找 peers，合并后连接下载</text>

<rect x="340" y="76" width="240" height="60" rx="8" fill="#ffffff"/>
<rect x="340" y="76" width="240" height="60" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="460" y="102" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">.torrent 文件</text>
<text x="460" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">announce URL + info_hash + piece hashes</text>

<line x1="400" y1="136" x2="160" y2="196" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<line x1="460" y1="136" x2="460" y2="196" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="520" y1="136" x2="760" y2="196" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

<text x="250" y="168" fill="#22d3ee" font-size="8" font-weight="500">读取 announce URL</text>
<text x="474" y="168" fill="#34d399" font-size="8" font-weight="500">提取 info_hash</text>
<text x="640" y="168" fill="#a78bfa" font-size="8" font-weight="500">提取 info_hash</text>

<rect x="30" y="196" width="260" height="240" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="196" width="120" height="22" rx="6" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>
<text x="90" y="211" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">Tracker 通道</text>

<rect x="50" y="230" width="220" height="50" rx="6" fill="#ffffff"/>
<rect x="50" y="230" width="220" height="50" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
<text x="160" y="252" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">HTTP/UDP Tracker</text>
<text x="160" y="268" fill="#94a3b8" font-size="8" text-anchor="middle">tracker.m-team.cc</text>

<text x="60" y="306" fill="#334155" font-size="9">GET /announce?</text>
<text x="60" y="320" fill="#334155" font-size="9">  info_hash=0xABCD</text>
<text x="60" y="334" fill="#334155" font-size="9">  event=started</text>

<text x="60" y="360" fill="#065f46" font-size="9" font-weight="600">Tracker 返回:</text>
<text x="60" y="376" fill="#334155" font-size="9">  peers=[A, B, C, D]</text>
<text x="60" y="392" fill="#334155" font-size="9">  interval=1800</text>

<text x="60" y="418" fill="#64748b" font-size="8">每隔 interval 秒重新 announce</text>
<text x="60" y="430" fill="#64748b" font-size="8">速度快，一次 HTTP 拿到名单</text>

<rect x="330" y="196" width="260" height="240" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="330" y="196" width="100" height="22" rx="6" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
<text x="380" y="211" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">DHT 通道</text>

<rect x="350" y="230" width="220" height="50" rx="6" fill="#ffffff"/>
<rect x="350" y="230" width="220" height="50" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
<text x="460" y="252" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Kademlia DHT</text>
<text x="460" y="268" fill="#94a3b8" font-size="8" text-anchor="middle">本地路由表 + UDP 查询</text>

<text x="360" y="306" fill="#334155" font-size="9">get_peers(0xABCD)</text>
<text x="360" y="320" fill="#334155" font-size="9">  → 迭代查找 3~5 轮</text>
<text x="360" y="334" fill="#334155" font-size="9">  → 每轮距离减半</text>

<text x="360" y="360" fill="#065f46" font-size="9" font-weight="600">最近节点返回:</text>
<text x="360" y="376" fill="#334155" font-size="9">  peers=[C, E, F]</text>

<text x="360" y="400" fill="#334155" font-size="9">announce_peer(0xABCD)</text>
<text x="360" y="414" fill="#334155" font-size="9">  → 把自己也登记进去</text>

<text x="360" y="430" fill="#64748b" font-size="8">无需中心服务器，永不宕机</text>

<rect x="630" y="196" width="260" height="240" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="630" y="196" width="100" height="22" rx="6" fill="rgba(76,29,149,0.6)" stroke="#a78bfa" stroke-width="1"/>
<text x="680" y="211" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">PEX 通道</text>

<rect x="650" y="230" width="220" height="50" rx="6" fill="#ffffff"/>
<rect x="650" y="230" width="220" height="50" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
<text x="760" y="252" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Peer Exchange</text>
<text x="760" y="268" fill="#94a3b8" font-size="8" text-anchor="middle">BEP 11 ut_pex 扩展</text>

<text x="660" y="306" fill="#334155" font-size="9">前提: 已连接至少 1 个 peer</text>
<text x="660" y="320" fill="#334155" font-size="9">(来自 Tracker 或 DHT)</text>

<text x="660" y="350" fill="#334155" font-size="9">已连接的 peer 主动告诉我:</text>
<text x="660" y="366" fill="#065f46" font-size="9" font-weight="600">"我还认识 G, H, I"</text>

<text x="660" y="396" fill="#334155" font-size="9">peers=[G, H, I]</text>

<text x="660" y="420" fill="#64748b" font-size="8">滚雪球效应，连的人越多</text>
<text x="660" y="432" fill="#64748b" font-size="8">发现的新 peers 越多</text>

<line x1="160" y1="436" x2="370" y2="500" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<line x1="460" y1="436" x2="460" y2="490" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="760" y1="436" x2="550" y2="500" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

<rect x="330" y="490" width="260" height="60" rx="8" fill="#ffffff"/>
<rect x="330" y="490" width="260" height="60" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
<text x="460" y="516" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">合并去重</text>
<text x="460" y="536" fill="#94a3b8" font-size="9" text-anchor="middle">[A,B,C,D] + [C,E,F] + [G,H,I] = 9 peers</text>

<line x1="460" y1="550" x2="460" y2="600" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="476" y="580" fill="#fb923c" font-size="8" font-weight="500">逐个尝试</text>

<rect x="330" y="600" width="260" height="60" rx="8" fill="#ffffff"/>
<rect x="330" y="600" width="260" height="60" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
<text x="460" y="626" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">TCP 连接 + Peer Wire 握手</text>
<text x="460" y="646" fill="#94a3b8" font-size="9" text-anchor="middle">protocol + info_hash + peer_id</text>

<line x1="460" y1="660" x2="460" y2="710" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<rect x="330" y="710" width="260" height="60" rx="8" fill="#ffffff"/>
<rect x="330" y="710" width="260" height="60" rx="8" fill="rgba(16,185,129,0.3)" stroke="#34d399" stroke-width="1.5"/>
<text x="460" y="736" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">开始下载</text>
<text x="460" y="752" fill="#94a3b8" font-size="9" text-anchor="middle">bitfield + request/piece 交换数据块</text>

<rect x="30" y="790" width="860" height="44" rx="8" fill="rgba(30,41,59,0.05)" stroke="#94a3b8" stroke-width="0.5"/>
<text x="50" y="808" fill="#64748b" font-size="9">Tracker: 速度快但可能宕机</text>
<text x="310" y="808" fill="#64748b" font-size="9">DHT: 永不宕机但稍慢</text>
<text x="560" y="808" fill="#64748b" font-size="9">PEX: 需要先有连接才能扩展</text>
<text x="50" y="824" fill="#334155" font-size="9" font-weight="500">三者互补并行，最大化找到 peers 的概率和速度。PT 站通常禁用 DHT/PEX 以控制访问权限。</text>
</svg>