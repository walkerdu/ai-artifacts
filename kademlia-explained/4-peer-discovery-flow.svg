<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
</pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
</marker>
<marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#0e7490"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
</marker>
<marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
</marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/>
</marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="30" y="36" fill="#0f172a" font-size="16" font-weight="700">BT 客户端 Peer 发现完整流程</text>
<text x="30" y="56" fill="#64748b" font-size="9">打开 .torrent 文件后，Tracker / DHT / PEX 三通道并行查找 peers，合并后连接下载</text>

<rect x="340" y="76" width="240" height="60" rx="8" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.5"/>
<text x="460" y="102" fill="#0c4a6e" font-size="12" font-weight="600" text-anchor="middle">.torrent 文件</text>
<text x="460" y="120" fill="#0e7490" font-size="9" text-anchor="middle">announce URL + info_hash + piece hashes</text>

<line x1="400" y1="136" x2="160" y2="196" stroke="#0e7490" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<line x1="460" y1="136" x2="460" y2="196" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="520" y1="136" x2="760" y2="196" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

<text x="250" y="168" fill="#0e7490" font-size="8" font-weight="500">读取 announce URL</text>
<text x="474" y="168" fill="#047857" font-size="8" font-weight="500">提取 info_hash</text>
<text x="640" y="168" fill="#6d28d9" font-size="8" font-weight="500">提取 info_hash</text>

<rect x="30" y="196" width="260" height="246" rx="12" fill="none" stroke="#0e7490" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="196" width="120" height="22" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="1"/>
<text x="90" y="211" fill="#0c4a6e" font-size="9" font-weight="600" text-anchor="middle">Tracker 通道</text>

<rect x="50" y="230" width="220" height="50" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="160" y="252" fill="#064e3b" font-size="10" font-weight="600" text-anchor="middle">HTTP/UDP Tracker</text>
<text x="160" y="268" fill="#047857" font-size="8" text-anchor="middle">tracker.m-team.cc</text>

<text x="60" y="306" fill="#1e293b" font-size="9">GET /announce?</text>
<text x="60" y="320" fill="#1e293b" font-size="9">  info_hash=0xABCD</text>
<text x="60" y="334" fill="#1e293b" font-size="9">  event=started</text>

<text x="60" y="360" fill="#065f46" font-size="9" font-weight="600">Tracker 返回:</text>
<text x="60" y="376" fill="#1e293b" font-size="9">  peers=[A, B, C, D]</text>
<text x="60" y="392" fill="#1e293b" font-size="9">  interval=1800</text>

<text x="60" y="418" fill="#475569" font-size="8">每隔 interval 秒重新 announce</text>
<text x="60" y="430" fill="#475569" font-size="8">速度快，一次 HTTP 拿到名单</text>

<rect x="330" y="196" width="260" height="246" rx="12" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="330" y="196" width="100" height="22" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
<text x="380" y="211" fill="#064e3b" font-size="9" font-weight="600" text-anchor="middle">DHT 通道</text>

<rect x="350" y="230" width="220" height="50" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="460" y="252" fill="#064e3b" font-size="10" font-weight="600" text-anchor="middle">Kademlia DHT</text>
<text x="460" y="268" fill="#047857" font-size="8" text-anchor="middle">本地路由表 + UDP 查询</text>

<text x="360" y="306" fill="#1e293b" font-size="9">get_peers(0xABCD)</text>
<text x="360" y="320" fill="#1e293b" font-size="9">  迭代查找 3~5 轮</text>
<text x="360" y="334" fill="#1e293b" font-size="9">  每轮距离减半</text>

<text x="360" y="360" fill="#065f46" font-size="9" font-weight="600">最近节点返回:</text>
<text x="360" y="376" fill="#1e293b" font-size="9">  peers=[C, E, F]</text>

<text x="360" y="400" fill="#1e293b" font-size="9">announce_peer(0xABCD)</text>
<text x="360" y="414" fill="#1e293b" font-size="9">  把自己也登记进去</text>

<text x="360" y="434" fill="#475569" font-size="8">无需中心服务器，永不宕机</text>

<rect x="630" y="196" width="260" height="246" rx="12" fill="none" stroke="#6d28d9" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="630" y="196" width="100" height="22" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
<text x="680" y="211" fill="#4c1d95" font-size="9" font-weight="600" text-anchor="middle">PEX 通道</text>

<rect x="650" y="230" width="220" height="50" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1"/>
<text x="760" y="252" fill="#4c1d95" font-size="10" font-weight="600" text-anchor="middle">Peer Exchange</text>
<text x="760" y="268" fill="#6d28d9" font-size="8" text-anchor="middle">BEP 11 ut_pex 扩展</text>

<text x="660" y="306" fill="#1e293b" font-size="9">前提: 已连接至少 1 个 peer</text>
<text x="660" y="320" fill="#1e293b" font-size="9">(来自 Tracker 或 DHT)</text>

<text x="660" y="350" fill="#1e293b" font-size="9">已连接的 peer 主动告诉我:</text>
<text x="660" y="366" fill="#4c1d95" font-size="9" font-weight="600">"我还认识 G, H, I"</text>

<text x="660" y="396" fill="#1e293b" font-size="9">peers=[G, H, I]</text>

<text x="660" y="424" fill="#475569" font-size="8">滚雪球效应，连的人越多</text>
<text x="660" y="436" fill="#475569" font-size="8">发现的新 peers 越多</text>

<line x1="160" y1="442" x2="370" y2="504" stroke="#0e7490" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<line x1="460" y1="442" x2="460" y2="494" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="760" y1="442" x2="550" y2="504" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

<rect x="330" y="494" width="260" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="460" y="520" fill="#7c2d12" font-size="12" font-weight="600" text-anchor="middle">合并去重</text>
<text x="460" y="540" fill="#c2410c" font-size="9" text-anchor="middle">[A,B,C,D] + [C,E,F] + [G,H,I] = 9 peers</text>

<line x1="460" y1="554" x2="460" y2="604" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="476" y="584" fill="#c2410c" font-size="8" font-weight="500">逐个尝试</text>

<rect x="330" y="604" width="260" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="460" y="630" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">TCP 连接 + Peer Wire 握手</text>
<text x="460" y="650" fill="#1d4ed8" font-size="9" text-anchor="middle">protocol + info_hash + peer_id</text>

<line x1="460" y1="664" x2="460" y2="714" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<rect x="330" y="714" width="260" height="60" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="460" y="740" fill="#064e3b" font-size="12" font-weight="600" text-anchor="middle">开始下载</text>
<text x="460" y="758" fill="#047857" font-size="9" text-anchor="middle">bitfield + request/piece 交换数据块</text>

<rect x="30" y="796" width="860" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="50" y="814" fill="#475569" font-size="9">Tracker: 速度快但可能宕机</text>
<text x="310" y="814" fill="#475569" font-size="9">DHT: 永不宕机但稍慢</text>
<text x="560" y="814" fill="#475569" font-size="9">PEX: 需要先有连接才能扩展</text>
<text x="50" y="830" fill="#1e293b" font-size="9" font-weight="500">三者互补并行，最大化找到 peers 的概率和速度。PT 站通常禁用 DHT/PEX 以控制访问权限。</text>
</svg>