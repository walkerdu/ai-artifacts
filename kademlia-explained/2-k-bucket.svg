<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
</pattern>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<text x="30" y="36" fill="#0f172a" font-size="16" font-weight="700">Kademlia 核心结构 2/3 — K-bucket 路由表</text>
<text x="30" y="56" fill="#64748b" font-size="9" font-weight="400">每个节点维护 160 个桶，按 XOR 距离分层存储认识的节点 (以 4-bit 空间、节点 0101 为例)</text>

<rect x="30" y="76" width="840" height="44" rx="10" fill="rgba(37,99,235,0.06)" stroke="#93c5fd" stroke-width="1.5"/>
<text x="450" y="100" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">我的 Node ID = 0101      4-bit 空间共 16 个位置 (0000 ~ 1111)</text>
<text x="450" y="114" fill="#64748b" font-size="9" text-anchor="middle">把所有其他节点按"与我的 XOR 距离"分入不同的桶，每桶最多 K=8 个</text>

<rect x="30" y="140" width="840" height="82" rx="10" fill="rgba(37,99,235,0.04)" stroke="#93c5fd" stroke-width="1"/>
<rect x="30" y="140" width="100" height="22" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="80" y="155" fill="#2563eb" font-size="9" font-weight="600" text-anchor="middle">Bucket 0</text>
<text x="50" y="178" fill="#1e40af" font-size="11" font-weight="600">距离 [1, 1]  覆盖 1/16</text>
<text x="350" y="178" fill="#334155" font-size="11">仅包含 0100 (与我只差最后 1 bit)</text>
<text x="700" y="178" fill="#64748b" font-size="9">XOR = 0001</text>
<text x="50" y="198" fill="#64748b" font-size="9">最精确的桶 — 我的"隔壁邻居"</text>

<rect x="30" y="236" width="840" height="82" rx="10" fill="rgba(37,99,235,0.04)" stroke="#93c5fd" stroke-width="1"/>
<rect x="30" y="236" width="100" height="22" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="80" y="251" fill="#2563eb" font-size="9" font-weight="600" text-anchor="middle">Bucket 1</text>
<text x="50" y="274" fill="#1e40af" font-size="11" font-weight="600">距离 [2, 3]  覆盖 2/16</text>
<text x="350" y="274" fill="#334155" font-size="11">包含 0110, 0111 (倒数第 2 bit 不同)</text>
<text x="700" y="274" fill="#64748b" font-size="9">XOR = 001x</text>
<text x="50" y="294" fill="#64748b" font-size="9">稍远一点的"同街区"邻居</text>

<rect x="30" y="332" width="840" height="82" rx="10" fill="rgba(245,158,11,0.04)" stroke="#fcd34d" stroke-width="1"/>
<rect x="30" y="332" width="100" height="22" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="80" y="347" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">Bucket 2</text>
<text x="50" y="370" fill="#92400e" font-size="11" font-weight="600">距离 [4, 7]  覆盖 4/16</text>
<text x="350" y="370" fill="#334155" font-size="11">包含 0000~0011 (倒数第 3 bit 不同)</text>
<text x="700" y="370" fill="#64748b" font-size="9">XOR = 01xx</text>
<text x="50" y="390" fill="#64748b" font-size="9">四分之一空间，"同城区"级别</text>

<rect x="30" y="428" width="840" height="82" rx="10" fill="rgba(239,68,68,0.04)" stroke="#fca5a5" stroke-width="1"/>
<rect x="30" y="428" width="100" height="22" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="80" y="443" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">Bucket 3</text>
<text x="50" y="466" fill="#991b1b" font-size="11" font-weight="600">距离 [8, 15] 覆盖 8/16</text>
<text x="350" y="466" fill="#334155" font-size="11">包含 1000~1111 (首 bit 不同，另外半个空间)</text>
<text x="700" y="466" fill="#64748b" font-size="9">XOR = 1xxx</text>
<text x="50" y="486" fill="#64748b" font-size="9">半个宇宙! 但只存 K=8 个代表 — 这就够了</text>

<text x="450" y="546" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">设计哲学: 近处密，远处疏</text>

<rect x="30" y="566" width="400" height="80" rx="10" fill="rgba(16,185,129,0.06)" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="230" y="594" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">近处 (低位桶)</text>
<text x="230" y="614" fill="#334155" font-size="10" text-anchor="middle">覆盖范围小，但几乎认识里面所有人</text>
<text x="230" y="632" fill="#64748b" font-size="9" text-anchor="middle">保证找自己附近的东西一步到位</text>

<rect x="470" y="566" width="400" height="80" rx="10" fill="rgba(239,68,68,0.04)" stroke="#fca5a5" stroke-width="1.5"/>
<text x="670" y="594" fill="#991b1b" font-size="12" font-weight="600" text-anchor="middle">远处 (高位桶)</text>
<text x="670" y="614" fill="#334155" font-size="10" text-anchor="middle">覆盖半个空间但只存 8 个代表</text>
<text x="670" y="632" fill="#64748b" font-size="9" text-anchor="middle">这 8 个人的路由表在那边更精确，可以接力指路</text>

<rect x="30" y="668" width="840" height="72" rx="10" fill="rgba(139,92,246,0.05)" stroke="#c4b5fd" stroke-width="1"/>
<text x="450" y="696" fill="#5b21b6" font-size