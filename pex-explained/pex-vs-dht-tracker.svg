<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 750">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#0e7490"/>
  </marker>
  <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
  </marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Title -->
<text x="525" y="40" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">BitTorrent Peer 发现机制：PEX vs DHT vs Tracker</text>
<text x="525" y="62" fill="#475569" font-size="11" font-weight="400" text-anchor="middle">三种机制互补协作，不存在替代关系</text>

<!-- ===== Top Section: Three Mechanisms Side-by-Side ===== -->

<!-- Tracker -->
<rect x="30" y="85" width="300" height="260" rx="12" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="8,4"/>
<text x="50" y="105" fill="#b45309" font-size="10" font-weight="600">Tracker (中心化)</text>

<rect x="110" y="120" width="140" height="55" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="180" y="143" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Tracker 服务器</text>
<text x="180" y="159" fill="#475569" font-size="9" text-anchor="middle">announce URL</text>

<rect x="55" y="220" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
<text x="105" y="244" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">Peer A</text>

<rect x="200" y="220" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
<text x="250" y="244" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">Peer B</text>

<line x1="155" y1="175" x2="115" y2="220" stroke="#b45309" stroke-width="1" marker-end="url(#arrow-amber)"/>
<line x1="205" y1="175" x2="240" y2="220" stroke="#b45309" stroke-width="1" marker-end="url(#arrow-amber)"/>

<text x="180" y="290" fill="#475569" font-size="9" text-anchor="middle">BEP-3 | HTTP/UDP 协议</text>
<text x="180" y="305" fill="#475569" font-size="9" text-anchor="middle">返回 Peer 列表给请求者</text>
<text x="180" y="325" fill="#b45309" font-size="9" font-weight="500" text-anchor="middle">单点故障 / 需服务器在线</text>

<!-- DHT -->
<rect x="370" y="85" width="300" height="260" rx="12" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-dasharray="8,4"/>
<text x="390" y="105" fill="#6d28d9" font-size="10" font-weight="600">DHT (全局分布式)</text>

<rect x="395" y="120" width="250" height="55" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
<text x="520" y="140" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Kademlia DHT 网络</text>
<text x="520" y="158" fill="#475569" font-size="9" text-anchor="middle">全局路由表，所有节点共同维护</text>

<rect x="395" y="210" width="75" height="40" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="0.8"/>
<text x="432" y="234" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">节点 1</text>

<rect x="483" y="210" width="75" height="40" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="0.8"/>
<text x="520" y="234" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">节点 2</text>

<rect x="570" y="210" width="75" height="40" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="0.8"/>
<text x="607" y="234" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">节点 3</text>

<line x1="432" y1="175" x2="432" y2="210" stroke="#6d28d9" stroke-width="0.8" marker-end="url(#arrow-violet)"/>
<line x1="520" y1="175" x2="520" y2="210" stroke="#6d28d9" stroke-width="0.8" marker-end="url(#arrow-violet)"/>
<line x1="607" y1="175" x2="607" y2="210" stroke="#6d28d9" stroke-width="0.8" marker-end="url(#arrow-violet)"/>

<text x="520" y="280" fill="#475569" font-size="9" text-anchor="middle">BEP-5 | UDP 协议</text>
<text x="520" y="295" fill="#475569" font-size="9" text-anchor="middle">get_peers(info_hash) 查任意文件</text>
<text x="520" y="310" fill="#475569" font-size="9" text-anchor="middle">announce_peer() 声明自己有文件</text>
<text x="520" y="325" fill="#6d28d9" font-size="9" font-weight="500" text-anchor="middle">跨 Torrent / 无中心 / 引导慢</text>

<!-- PEX -->
<rect x="710" y="85" width="310" height="260" rx="12" fill="none" stroke="#047857" stroke-width="1.2" stroke-dasharray="8,4"/>
<text x="730" y="105" fill="#047857" font-size="10" font-weight="600">PEX (连接级交换)</text>

<rect x="740" y="120" width="115" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
<text x="797" y="144" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">Peer A</text>

<rect x="880" y="120" width="115" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
<text x="937" y="144" fill="#0f172a" font-size="9" font-weight="500" text-anchor="middle">Peer B</text>

<line x1="855" y1="140" x2="880" y2="140" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

<rect x="810" y="200" width="120" height="50" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="0.8"/>
<text x="870" y="218" fill="#047857" font-size="9" font-weight="600" text-anchor="middle">PEX 消息</text>
<text x="870" y="234" fill="#0f172a" font-size="8" text-anchor="middle">added: [C, D, E]</text>
<text x="870" y="246" fill="#94a3b8" font-size="8" text-anchor="middle">dropped: [F]</text>

<text x="865" y="280" fill="#475569" font-size="9" text-anchor="middle">BEP-11 | BT 连接内扩展消息</text>
<text x="865" y="295" fill="#475569" font-size="9" text-anchor="middle">仅同一 info_hash 的 Peer</text>
<text x="865" y="310" fill="#475569" font-size="9" text-anchor="middle">双向交换，每 ~60 秒一次</text>
<text x="865" y="325" fill="#047857" font-size="9" font-weight="500" text-anchor="middle">快速扩展 / 需已有连接</text>

<!-- ===== Middle Section: Relationship Arrows ===== -->
<text x="525" y="380" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">三者协作关系</text>

<!-- Collaboration flow -->
<rect x="80" y="405" width="260" height="65" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="210" y="428" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">1. Tracker / DHT 引导</text>
<text x="210" y="448" fill="#475569" font-size="9" text-anchor="middle">客户端启动时通过 Tracker 或 DHT</text>
<text x="210" y="462" fill="#475569" font-size="9" text-anchor="middle">获取第一批 Peer 地址</text>

<rect x="395" y="405" width="260" height="65" rx="8" fill="#e0f2fe" stroke="#0e7490" stroke-width="1"/>
<text x="525" y="428" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">2. 建立 BT 连接</text>
<text x="525" y="448" fill="#475569" font-size="9" text-anchor="middle">与获取到的 Peer 握手</text>
<text x="525" y="462" fill="#475569" font-size="9" text-anchor="middle">协商扩展协议 (ut_pex)</text>

<rect x="710" y="405" width="260" height="65" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="840" y="428" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">3. PEX 接力扩展</text>
<text x="840" y="448" fill="#475569" font-size="9" text-anchor="middle">已连接 Peer 互相交换地址</text>
<text x="840" y="462" fill="#475569" font-size="9" text-anchor="middle">快速扩大 Peer 池</text>

<line x1="340" y1="437" x2="395" y2="437" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="655" y1="437" x2="710" y2="437" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ===== Bottom Section: Comparison Table ===== -->
<text x="525" y="515" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">对比总结</text>

<!-- Table header -->
<rect x="50" y="530" width="950" height="30" rx="0" fill="#f1f5f9"/>
<text x="160" y="550" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">维度</text>
<text x="360" y="550" fill="#b45309" font-size="10" font-weight="600" text-anchor="middle">Tracker</text>
<text x="600" y="550" fill="#6d28d9" font-size="10" font-weight="600" text-anchor="middle">DHT</text>
<text x="860" y="550" fill="#047857" font-size="10" font-weight="600" text-anchor="middle">PEX</text>

<!-- Row 1 -->
<line x1="50" y1="560" x2="1000" y2="560" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="160" y="580" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">作用域</text>
<text x="360" y="580" fill="#0f172a" font-size="9" text-anchor="middle">单个 Torrent</text>
<text x="600" y="580" fill="#0f172a" font-size="9" text-anchor="middle">全局 (可查任意 info_hash)</text>
<text x="860" y="580" fill="#0f172a" font-size="9" text-anchor="middle">单个 Torrent (per-connection)</text>

<!-- Row 2 -->
<line x1="50" y1="592" x2="1000" y2="592" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="160" y="612" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">协议</text>
<text x="360" y="612" fill="#0f172a" font-size="9" text-anchor="middle">HTTP/UDP (独立连接)</text>
<text x="600" y="612" fill="#0f172a" font-size="9" text-anchor="middle">UDP (独立 DHT 端口)</text>
<text x="860" y="612" fill="#0f172a" font-size="9" text-anchor="middle">BT 连接内扩展消息</text>

<!-- Row 3 -->
<line x1="50" y1="624" x2="1000" y2="624" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="160" y="644" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">前置条件</text>
<text x="360" y="644" fill="#0f172a" font-size="9" text-anchor="middle">知道 Tracker URL</text>
<text x="600" y="644" fill="#0f172a" font-size="9" text-anchor="middle">知道至少一个 DHT 引导节点</text>
<text x="860" y="644" fill="#0f172a" font-size="9" text-anchor="middle">已与某个 Peer 建立 BT 连接</text>

<!-- Row 4 -->
<line x1="50" y1="656" x2="1000" y2="656" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="160" y="676" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">发现速度</text>
<text x="360" y="676" fill="#0f172a" font-size="9" text-anchor="middle">快 (一次请求返回列表)</text>
<text x="600" y="676" fill="#0f172a" font-size="9" text-anchor="middle">慢 (多跳路由查找)</text>
<text x="860" y="676" fill="#0f172a" font-size="9" text-anchor="middle">快 (已有连接直接交换)</text>

<!-- Row 5 -->
<line x1="50" y1="688" x2="1000" y2="688" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="160" y="708" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">抗审查/可用性</text>
<text x="360" y="708" fill="#0f172a" font-size="9" text-anchor="middle">差 (单点故障)</text>
<text x="600" y="708" fill="#0f172a" font-size="9" text-anchor="middle">强 (完全去中心化)</text>
<text x="860" y="708" fill="#0f172a" font-size="9" text-anchor="middle">中等 (依赖初始连接)</text>

<line x1="50" y1="720" x2="1000" y2="720" stroke="#e2e8f0" stroke-width="0.5"/>

<!-- Bottom note -->
<text x="525" y="745" fill="#475569" font-size="9" font-weight="400" text-anchor="middle">典型客户端 (如 libtorrent / qBittorrent) 三者同时启用，Tracker 和 DHT 提供初始 Peer，PEX 负责快速扩展已有 Peer 池</text>
</svg>