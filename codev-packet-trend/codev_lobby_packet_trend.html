const cv=document.getElementById('c'), ctx=cv.getContext('2d'), tip=document.getElementById('tip');
const W=cv.width,H=cv.height,ML=86,MR=24,MT=24,MB=52;
const pw=W-ML-MR, ph=H-MT-MB;
const x=i=>ML+pw*i/(DATA.length-1);
let max=0; DATA.forEach(d=>{max=Math.max(max,d.in,d.out)});
const nice=Math.pow(10,Math.floor(Math.log10(max)));
const ymax=Math.ceil(max/(nice/2))*(nice/2);
const y=v=>MT+ph-ph*v/ymax;
function fmt(n){return n.toLocaleString('en-US',{maximumFractionDigits:0})}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.font='12px -apple-system,PingFang SC,sans-serif';
  // grid + y axis
  ctx.strokeStyle='#e5e7eb'; ctx.fillStyle='#6b7280'; ctx.lineWidth=1;
  const step=ymax/5;
  for(let i=0;i<=5;i++){
    const v=step*i, py=Math.round(y(v))+0.5;
    ctx.beginPath();ctx.moveTo(ML,py);ctx.lineTo(W-MR,py);ctx.stroke();
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(fmt(Math.round(v)),ML-10,py);
  }
  // x ticks every hour (12 pts)
  ctx.textAlign='center';ctx.textBaseline='top';
  for(let i=0;i<DATA.length;i+=6){
    const px=Math.round(x(i))+0.5;
    ctx.strokeStyle='#f3f4f6';ctx.beginPath();ctx.moveTo(px,MT);ctx.lineTo(px,MT+ph);ctx.stroke();
    ctx.fillStyle='#6b7280';
    ctx.fillText(DATA[i].t.slice(11,16),px,MT+ph+8);
  }
  ctx.strokeStyle='#9ca3af';
  ctx.beginPath();ctx.moveTo(ML+0.5,MT);ctx.lineTo(ML+0.5,MT+ph);ctx.lineTo(W-MR,MT+ph);ctx.stroke();
  // lines
  [['out','#dc2626'],['in','#2563eb']].forEach(([k,color])=>{
    ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.beginPath();
    DATA.forEach((d,i)=>i?ctx.lineTo(x(i),y(d[k])):ctx.moveTo(x(i),y(d[k])));
    ctx.stroke();
  });
}
draw();
// hover
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(), mx=(e.clientX-r.left)*(W/r.width);
  let i=Math.round((mx-ML)/(pw/(DATA.length-1)));
  i=Math.max(0,Math.min(DATA.length-1,i));
  draw();
  const px=x(i);
  ctx.strokeStyle='#9ca3af';ctx.setLineDash([4,3]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px,MT);ctx.lineTo(px,MT+ph);ctx.stroke();ctx.setLineDash([]);

  tip.style.display='block';
  tip.innerHTML='<b>'+DATA[i].t+'</b><br><span style="color:#2563eb">入包量</span> '+fmt(DATA[i].in)+' counts/s<br><span style="color:#dc2626">出包量</span> '+fmt(DATA[i].out)+' counts/s';
  const left=px/r.width*r.width+18;
  tip.style.left=(e.clientX-r.left+18)+'px';
  tip.style.top=(e.clientY-r.top-10)+'px';
});
cv.addEventListener('mouseleave',()=>{tip.style.display='none';draw()});
// stats
const f=k=>{const a=DATA.map(d=>d[k]);return {max:Math.max(...a),min:Math.min(...a),avg:a.reduce((x,y)=>x+y,0)/a.length}};
const si=f('in'), so=f('out');

 '<span style="margin-left:24px"></span>出包量 峰值 <b>'+fmt(so.max)+'</b> / 谷值 <b>'+fmt(so.min)+'</b> / 均值 <b>'+fmt(so.avg)+'</b> counts/s';
