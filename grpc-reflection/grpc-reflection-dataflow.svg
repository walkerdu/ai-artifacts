<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
  </marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
  </marker>
  <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </marker>
  <marker id="arrow-open-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#34d399" stroke-width="1.5"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#0f172a"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="40" y="40" fill="white" font-size="16" font-weight="700">gRPC Server Reflection - Data Flow</text>
<text x="40" y="60" fill="#94a3b8" font-size="9">BiDi Streaming RPC: grpc.reflection.v1.ServerReflection/ServerReflectionInfo</text>

<!-- ============================================= -->
<!-- Actor Boxes -->
<!-- ============================================= -->

<!-- Actor 1: Client (grpcurl) -->
<rect x="60" y="85" width="160" height="50" rx="6" fill="#0f172a"/>
<rect x="60" y="85" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="140" y="107" fill="white" font-size="11" font-weight="600" text-anchor="middle">gRPC Client</text>
<text x="140" y="122" fill="#94a3b8" font-size="9" text-anchor="middle">grpcurl / grpcui</text>

<!-- Actor 2: ReflectionService -->
<rect x="370" y="85" width="180" height="50" rx="6" fill="#0f172a"/>
<rect x="370" y="85" width="180" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="460" y="107" fill="white" font-size="11" font-weight="600" text-anchor="middle">ReflectionService</text>
<text x="460" y="122" fill="#94a3b8" font-size="9" text-anchor="middle">v1/v1alpha</text>

<!-- Actor 3: Proto Descriptor Registry -->
<rect x="700" y="85" width="200" height="50" rx="6" fill="#0f172a"/>
<rect x="700" y="85" width="200" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="800" y="107" fill="white" font-size="11" font-weight="600" text-anchor="middle">Descriptor Registry</text>
<text x="800" y="122" fill="#94a3b8" font-size="9" text-anchor="middle">FileDescriptorProto pool</text>

<!-- Lifelines -->
<line x1="140" y1="135" x2="140" y2="940" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="460" y1="135" x2="460" y2="940" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="800" y1="135" x2="800" y2="940" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

<!-- ============================================= -->
<!-- Phase 1: Reflection Discovery -->
<!-- ============================================= -->

<!-- Phase label -->
<rect x="30" y="155" width="920" height="395" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="155" width="180" height="20" rx="4" fill="rgba(30,41,59,0.8)" stroke="#fbbf24" stroke-width="1"/>
<text x="120" y="169" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">Reflection Discovery Phase</text>

<!-- ===== Step 1: Open BiDi Stream ===== -->
<circle cx="120" cy="200" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="203" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">1</text>

<line x1="140" y1="200" x2="449" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="295" y="192" fill="#e2e8f0" font-size="9" text-anchor="middle">ServerReflectionInfo(stream)</text>
<text x="295" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">Open BiDi Stream</text>

<!-- Activation bars -->
<rect x="135" y="195" width="10" height="345" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>
<rect x="455" y="195" width="10" height="345" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>

<!-- ===== Step 2: ListServices Request ===== -->
<circle cx="120" cy="255" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="258" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">2</text>

<line x1="145" y1="255" x2="454" y2="255" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="300" y="247" fill="#e2e8f0" font-size="9" text-anchor="middle">list_services: ""</text>

<!-- Code block: request -->
<rect x="168" y="265" width="260" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="178" y="280" fill="#22d3ee" font-size="8">ServerReflectionRequest {</text>
<text x="188" y="293" fill="#fbbf24" font-size="8">list_services: <tspan fill="#e2e8f0">""</tspan></text>
<text x="178" y="303" fill="#22d3ee" font-size="8">}</text>

<!-- ===== Step 3: ListServices Response ===== -->
<circle cx="120" cy="330" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="333" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">3</text>

<line x1="455" y1="330" x2="146" y2="330" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open-emerald)"/>
<text x="300" y="322" fill="#34d399" font-size="9" text-anchor="middle" font-style="italic">ListServiceResponse</text>

<!-- Code block: response -->
<rect x="168" y="340" width="260" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="178" y="355" fill="#34d399" font-size="8">ListServiceResponse {</text>
<text x="188" y="368" fill="#fbbf24" font-size="8">service: <tspan fill="#e2e8f0">[</tspan></text>
<text x="198" y="381" fill="#e2e8f0" font-size="8">"helloworld.Greeter",</text>
<text x="178" y="392" fill="#34d399" font-size="8">]}</text>

<!-- ===== Step 4: FileContainingSymbol ===== -->
<circle cx="120" cy="418" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="421" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">4</text>

<line x1="145" y1="418" x2="454" y2="418" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="300" y="410" fill="#e2e8f0" font-size="9" text-anchor="middle">file_containing_symbol</text>

<!-- Reflection -> Registry lookup -->
<rect x="795" y="418" width="10" height="40" rx="2" fill="rgba(76,29,149,0.6)" stroke="#a78bfa" stroke-width="1"/>
<line x1="465" y1="425" x2="794" y2="425" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
<text x="630" y="417" fill="#a78bfa" font-size="8" text-anchor="middle">FindFileBySymbol()</text>

<line x1="795" y1="450" x2="466" y2="450" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
<text x="630" y="462" fill="#94a3b8" font-size="8" text-anchor="middle">FileDescriptorProto (serialized bytes)</text>

<!-- ===== Step 5: FileDescriptor Response ===== -->
<circle cx="120" cy="485" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="488" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">5</text>

<line x1="455" y1="485" x2="146" y2="485" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open-emerald)"/>
<text x="300" y="477" fill="#34d399" font-size="9" text-anchor="middle" font-style="italic">FileDescriptorResponse</text>

<!-- Code block: FileDescriptor -->
<rect x="168" y="495" width="300" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="178" y="510" fill="#34d399" font-size="8">FileDescriptorResponse {</text>
<text x="188" y="523" fill="#fbbf24" font-size="8">file_descriptor_proto: <tspan fill="#e2e8f0">[</tspan></text>
<text x="198" y="536" fill="#94a3b8" font-size="8">bytes  // serialized .proto definition</text>
<text x="178" y="547" fill="#34d399" font-size="8">]}</text>

<!-- ============================================= -->
<!-- Phase 2: Client-side Parsing (self-message) -->
<!-- ============================================= -->
<circle cx="120" cy="585" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="588" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">6</text>

<path d="M 145,585 L 220,585 L 220,640 L 145,640" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="230" y="600" fill="#e2e8f0" font-size="9">Parse FileDescriptorProto</text>
<text x="230" y="615" fill="#94a3b8" font-size="8">Decode methods, message types,</text>
<text x="230" y="628" fill="#94a3b8" font-size="8">field names and types</text>

<!-- Code block: parsed info -->
<rect x="230" y="640" width="300" height="68" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="240" y="655" fill="#94a3b8" font-size="8">// Parsed service definition</text>
<text x="240" y="668" fill="#22d3ee" font-size="8">service <tspan fill="white">Greeter</tspan> {</text>
<text x="250" y="681" fill="#fbbf24" font-size="8">rpc <tspan fill="white">SayHello</tspan>(<tspan fill="#a78bfa">HelloRequest</tspan>)</text>
<text x="270" y="694" fill="#fbbf24" font-size="8">returns (<tspan fill="#a78bfa">HelloReply</tspan>)</text>
<text x="240" y="705" fill="#22d3ee" font-size="8">}</text>

<!-- ============================================= -->
<!-- Phase 3: Actual RPC Call -->
<!-- ============================================= -->
<rect x="30" y="730" width="920" height="195" rx="8" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
<rect x="30" y="730" width="150" height="20" rx="4" fill="rgba(30,41,59,0.8)" stroke="#60a5fa" stroke-width="1"/>
<text x="105" y="744" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">Actual RPC Call Phase</text>

<!-- ===== Step 7: Construct and send RPC ===== -->
<circle cx="120" cy="775" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="778" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">7</text>

<!-- Activation bars for RPC -->
<rect x="135" y="770" width="10" height="140" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>
<rect x="455" y="770" width="10" height="140" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>

<line x1="145" y1="775" x2="454" y2="775" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="300" y="767" fill="#e2e8f0" font-size="9" text-anchor="middle">/helloworld.Greeter/SayHello</text>

<!-- Code block: request payload -->
<rect x="168" y="785" width="260" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="178" y="800" fill="#a78bfa" font-size="8">HelloRequest {</text>
<text x="188" y="813" fill="#fbbf24" font-size="8">name: <tspan fill="#e2e8f0">"World"</tspan></text>
<text x="178" y="824" fill="#a78bfa" font-size="8">}</text>

<!-- ===== Step 8: Response ===== -->
<circle cx="120" cy="855" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
<text x="120" y="858" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="middle">8</text>

<line x1="455" y1="855" x2="146" y2="855" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open-emerald)"/>
<text x="300" y="847" fill="#34d399" font-size="9" text-anchor="middle" font-style="italic">HelloReply</text>

<!-- Code block: response payload -->
<rect x="168" y="865" width="260" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="178" y="880" fill="#a78bfa" font-size="8">HelloReply {</text>
<text x="188" y="893" fill="#fbbf24" font-size="8">message: <tspan fill="#e2e8f0">"Hello World"</tspan></text>
<text x="178" y="904" fill="#a78bfa" font-size="8">}</text>

<!-- ============================================= -->
<!-- Legend -->
<!-- ============================================= -->
<rect x="585" y="590" width="350" height="120" rx="8" fill="rgba(30,41,59,0.6)" stroke="#334155" stroke-width="1"/>
<text x="605" y="610" fill="white" font-size="10" font-weight="600">Legend</text>

<line x1="605" y1="630" x2="655" y2="630" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text x="670" y="633" fill="#94a3b8" font-size="8">Sync request (solid)</text>

<line x1="605" y1="650" x2="655" y2="650" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open-emerald)"/>
<text x="670" y="653" fill="#94a3b8" font-size="8">Return / response (dashed)</text>

<line x1="605" y1="670" x2="655" y2="670" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
<text x="670" y="673" fill="#94a3b8" font-size="8">Internal lookup (Registry)</text>

<rect x="605" y="685" width="50" height="10" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>
<text x="670" y="695" fill="#94a3b8" font-size="8">Activation bar (processing)</text>

</svg>