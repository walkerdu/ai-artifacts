<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1150">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arr-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <marker id="arr-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
  </marker>
  <marker id="arr-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
  </marker>
  <marker id="arr-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
  </marker>
  <marker id="arr-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#0f172a"/>
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Title -->
<text x="30" y="35" fill="white" font-size="16" font-weight="700">gRPC Server Reflection — Go 代码级数据流</text>
<text x="30" y="53" fill="#94a3b8" font-size="9">从 grpc.Dial 到 conn.Invoke 的完整调用链 (google.golang.org/grpc/reflection)</text>

<!-- ══════════════════════════════════════════════ -->
<!-- Phase 1: Reflection (Discovery) -->
<!-- ══════════════════════════════════════════════ -->
<rect x="20" y="72" width="780" height="285" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
<rect x="20" y="72" width="280" height="22" rx="6" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>
<text x="30" y="87" fill="#22d3ee" font-size="10" font-weight="600">Phase 1  Reflection（发现）</text>
<text x="310" y="87" fill="#64748b" font-size="8">只用一次，拿到描述符就结束</text>

<!-- Code block -->
<rect x="40" y="108" width="740" height="230" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

<!-- Line 1: conn -->
<text x="55" y="132" fill="#64748b" font-size="9">1</text>
<text x="75" y="132" fill="#94a3b8" font-size="10">conn</text>
<text x="115" y="132" fill="#64748b" font-size="10">:=</text>
<text x="135" y="132" fill="#22d3ee" font-size="10">grpc.Dial</text>
<text x="215" y="132" fill="#e2e8f0" font-size="10">(target, opts...)</text>

<!-- Arrow down -->
<line x1="95" y1="140" x2="95" y2="157" stroke="#22d3ee" stroke-width="1" marker-end="url(#arr-cyan)"/>

<!-- Line 2: refClient -->
<text x="55" y="172" fill="#64748b" font-size="9">2</text>
<text x="75" y="172" fill="#94a3b8" font-size="10">refClient</text>
<text x="155" y="172" fill="#64748b" font-size="10">:=</text>
<text x="175" y="172" fill="#22d3ee" font-size="10">rpb.NewServerReflectionClient</text>
<text x="465" y="172" fill="#e2e8f0" font-size="10">(conn)</text>

<!-- Arrow down -->
<line x1="115" y1="180" x2="115" y2="197" stroke="#22d3ee" stroke-width="1" marker-end="url(#arr-cyan)"/>

<!-- Line 3: stream -->
<text x="55" y="212" fill="#64748b" font-size="9">3</text>
<text x="75" y="212" fill="#94a3b8" font-size="10">stream</text>
<text x="135" y="212" fill="#64748b" font-size="10">:=</text>
<text x="155" y="212" fill="#22d3ee" font-size="10">refClient.ServerReflectionInfo</text>
<text x="455" y="212" fill="#e2e8f0" font-size="10">(ctx)</text>
<text x="520" y="212" fill="#475569" font-size="9">// BiDi Stream</text>

<!-- Branch: Send -->
<line x1="115" y1="220" x2="115" y2="237" stroke="#34d399" stroke-width="1"/>
<line x1="115" y1="237" x2="135" y2="237" stroke="#34d399" stroke-width="1" marker-end="url(#arr-emerald)"/>

<text x="55" y="252" fill="#64748b" font-size="9">4</text>
<text x="75" y="252" fill="#34d399" font-size="10">stream.Send</text>
<text x="175" y="252" fill="#e2e8f0" font-size="10">(&amp;rpb.ServerReflectionRequest{</text>
<text x="105" y="270" fill="#fbbf24" font-size="10">MessageRequest: &amp;rpb...{</text>
<text x="125" y="288" fill="#fbbf24" font-size="10">FileContainingSymbol:</text>
<text x="345" y="288" fill="#e2e8f0" font-size="10">"pkg.Svc"</text>
<text x="105" y="303" fill="#e2e8f0" font-size="10">}})</text>

<!-- Branch: Recv -->
<line x1="115" y1="258" x2="115" y2="318" stroke="#a78bfa" stroke-width="1"/>
<line x1="115" y1="318" x2="135" y2="318" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr-violet)"/>

<text x="55" y="322" fill="#64748b" font-size="9">5</text>
<text x="75" y="322" fill="#a78bfa" font-size="10">resp, _</text>
<text x="145" y="322" fill="#64748b" font-size="10">:=</text>
<text x="165" y="322" fill="#a78bfa" font-size="10">stream.Recv()</text>
<text x="310" y="322" fill="#475569" font-size="9">// []FileDescriptorProto (bytes)</text>

<!-- CloseSend annotation -->
<text x="55" y="342" fill="#64748b" font-size="9">6</text>
<text x="75" y="342" fill="#fb7185" font-size="10">stream.CloseSend()</text>
<text x="280" y="342" fill="#fb7185" font-size="9">← 反射流的使命结束</text>

<!-- ══════════════════════════════════════════════ -->
<!-- Phase 2: Build Descriptor Pool -->
<!-- ══════════════════════════════════════════════ -->
<rect x="20" y="375" width="780" height="195" rx="10" fill="none" stroke="#34d399" stroke-width="1.5"/>
<rect x="20" y="375" width="250" height="22" rx="6" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
<text x="30" y="390" fill="#34d399" font-size="10" font-weight="600">Phase 2  拼装描述符池</text>
<text x="280" y="390" fill="#64748b" font-size="8">bytes → 可查询的类型注册表</text>

<!-- Down arrow from phase 1 -->
<line x1="400" y1="357" x2="400" y2="373" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="40" y="410" width="740" height="145" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

<text x="55" y="434" fill="#64748b" font-size="9">7</text>
<text x="75" y="434" fill="#94a3b8" font-size="10">fdBytes</text>
<text x="145" y="434" fill="#64748b" font-size="10">:=</text>
<text x="165" y="434" fill="#e2e8f0" font-size="10">resp.FileDescriptorResponse.FileDescriptorProto</text>

<line x1="115" y1="442" x2="115" y2="459" stroke="#34d399" stroke-width="1" marker-end="url(#arr-emerald)"/>

<text x="55" y="474" fill="#64748b" font-size="9">8</text>
<text x="75" y="474" fill="#94a3b8" font-size="10">fdSet</text>
<text x="120" y="474" fill="#64748b" font-size="10">:=</text>
<text x="140" y="474" fill="#34d399" font-size="10">proto.Unmarshal</text>
<text x="305" y="474" fill="#e2e8f0" font-size="10">(fdBytes[i], &amp;descriptorpb.FileDescriptorProto{})</text>

<line x1="115" y1="482" x2="115" y2="499" stroke="#34d399" stroke-width="1" marker-end="url(#arr-emerald)"/>

<text x="55" y="514" fill="#64748b" font-size="9">9</text>
<text x="75" y="514" fill="#94a3b8" font-size="10">files</text>
<text x="120" y="514" fill="#64748b" font-size="10">:=</text>
<text x="140" y="514" fill="#34d399" font-size="10">protodesc.NewFiles</text>
<text x="325" y="514" fill="#e2e8f0" font-size="10">(fdSet)</text>
<text x="400" y="514" fill="#475569" font-size="9">// → *protoregistry.Files</text>

<line x1="115" y1="522" x2="115" y2="539" stroke="#34d399" stroke-width="1" marker-end="url(#arr-emerald)"/>

<text x="55" y="544" fill="#64748b" font-size="9">10</text>
<text x="80" y="544" fill="#94a3b8" font-size="10">methodDesc</text>
<text x="175" y="544" fill="#64748b" font-size="10">:=</text>
<text x="195" y="544" fill="#34d399" font-size="10">files.FindDescriptorByName</text>
<text x="445" y="544" fill="#e2e8f0" font-size="10">("pkg.Svc.Method")</text>

<!-- ══════════════════════════════════════════════ -->
<!-- Phase 3: Dynamic Request Construction -->
<!-- ══════════════════════════════════════════════ -->
<rect x="20" y="588" width="780" height="195" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
<rect x="20" y="588" width="250" height="22" rx="6" fill="rgba(120,53,15,0.5)" stroke="#fbbf24" stroke-width="1"/>
<text x="30" y="603" fill="#fbbf24" font-size="10" font-weight="600">Phase 3  动态构造请求</text>
<text x="280" y="603" fill="#64748b" font-size="8">描述符 → 可序列化的 proto message</text>

<line x1="400" y1="570" x2="400" y2="586" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="40" y="623" width="740" height="145" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

<text x="55" y="647" fill="#64748b" font-size="9">11</text>
<text x="80" y="647" fill="#94a3b8" font-size="10">md</text>
<text x="102" y="647" fill="#64748b" font-size="10">:=</text>
<text x="120" y="647" fill="#fbbf24" font-size="10">methodDesc.(protoreflect.MethodDescriptor)</text>

<line x1="115" y1="655" x2="115" y2="672" stroke="#fbbf24" stroke-width="1" marker-end="url(#arr-amber)"/>

<text x="55" y="687" fill="#64748b" font-size="9">12</text>
<text x="80" y="687" fill="#94a3b8" font-size="10">req</text>
<text x="108" y="687" fill="#64748b" font-size="10">:=</text>
<text x="128" y="687" fill="#fbbf24" font-size="10">dynamicpb.NewMessage</text>
<text x="338" y="687" fill="#e2e8f0" font-size="10">(md.Input())</text>
<text x="455" y="687" fill="#475569" font-size="9">// 动态 req</text>

<!-- Two branches: method A and method B -->
<line x1="115" y1="695" x2="115" y2="712" stroke="#fbbf24" stroke-width="1"/>

<text x="80" y="718" fill="#475569" font-size="9">// 方式A: JSON 填充</text>
<line x1="115" y1="712" x2="135" y2="712" stroke="#fbbf24" stroke-width="1" marker-end="url(#arr-amber)"/>
<text x="55" y="733" fill="#64748b" font-size="9">A</text>
<text x="80" y="733" fill="#fbbf24" font-size="10">protojson.Unmarshal</text>
<text x="275" y="733" fill="#e2e8f0" font-size="10">(jsonBytes, req)</text>

<line x1="115" y1="720" x2="115" y2="748" stroke="#fbbf24" stroke-width="1"/>
<line x1="115" y1="748" x2="135" y2="748" stroke="#fbbf24" stroke-width="1" marker-end="url(#arr-amber)"/>
<text x="80" y="755" fill="#475569" font-size="9">// 方式B: 逐字段设置</text>
<text x="55" y="762" fill="#64748b" font-size="9">B</text>
<text x="80" y="762" fill="#fbbf24" font-size="10">req.ProtoReflect().Set</text>
<text x="300" y="762" fill="#e2e8f0" font-size="10">(field, protoreflect.ValueOfString("..."))</text>

<!-- ══════════════════════════════════════════════ -->
<!-- Phase 4: Actual RPC Call -->
<!-- ══════════════════════════════════════════════ -->
<rect x="20" y="800" width="780" height="175" rx="10" fill="none" stroke="#fb7185" stroke-width="1.5"/>
<rect x="20" y="800" width="300" height="22" rx="6" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1"/>
<text x="30" y="815" fill="#fb7185" font-size="10" font-weight="600">Phase 4  业务调用</text>
<text x="150" y="815" fill="#64748b" font-size="8">普通 Unary RPC，与反射流完全无关!</text>

<line x1="400" y1="783" x2="400" y2="798" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="40" y="835" width="740" height="125" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

<text x="55" y="859" fill="#64748b" font-size="9">13</text>
<text x="80" y="859" fill="#94a3b8" font-size="10">resp</text>
<text x="118" y="859" fill="#64748b" font-size="10">:=</text>
<text x="138" y="859" fill="#fb7185" font-size="10">dynamicpb.NewMessage</text>
<text x="348" y="859" fill="#e2e8f0" font-size="10">(md.Output())</text>

<line x1="115" y1="867" x2="115" y2="884" stroke="#fb7185" stroke-width="1" marker-end="url(#arr-rose)"/>

<text x="55" y="899" fill="#64748b" font-size="9">14</text>
<text x="80" y="899" fill="#fb7185" font-size="10">conn.Invoke</text>
<text x="183" y="899" fill="#e2e8f0" font-size="10">(ctx,</text>
<text x="225" y="899" fill="#fbbf24" font-size="10">"/pkg.Svc/Method"</text>
<text x="410" y="899" fill="#e2e8f0" font-size="10">, req, resp)</text>

<!-- Annotation -->
<line x1="225" y1="907" x2="225" y2="920" stroke="#fb7185" stroke-width="1"/>
<text x="232" y="920" fill="#fb7185" font-size="9">↑ 这是独立的新 RPC，不走 reflection stream</text>

<text x="55" y="950" fill="#64748b" font-size="9">15</text>
<text x="80" y="950" fill="#94a3b8" font-size="10">jsonOut, _</text>
<text x="175" y="950" fill="#64748b" font-size="10">:=</text>
<text x="195" y="950" fill="#34d399" font-size="10">protojson.Marshal</text>
<text x="370" y="950" fill="#e2e8f0" font-size="10">(resp)</text>
<text x="430" y="950" fill="#475569" font-size="9">// → JSON 输出</text>

<!-- ══════════════════════════════════════════════ -->
<!-- Bottom summary -->
<!-- ══════════════════════════════════════════════ -->
<rect x="40" y="1000" width="740" height="130" rx="8" fill="rgba(30,41,59,0.6)" stroke="#334155" stroke-width="1"/>
<text x="60" y="1025" fill="white" font-size="11" font-weight="600">Key Points</text>

<rect x="60" y="1038" width="10" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
<text x="80" y="1048" fill="#94a3b8" font-size="9">Reflection 用 BiDi Stream (ServerReflectionInfo)，一问一答获取 proto 描述符</text>

<rect x="60" y="1058" width="10" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
<text x="80" y="1068" fill="#94a3b8" font-size="9">描述符池在客户端本地构建，protodesc + protoregistry 组合</text>

<rect x="60" y="1078" width="10" height="10" rx="2" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1"/>
<text x="80" y="1088" fill="#94a3b8" font-size="9">dynamicpb.NewMessage 替代编译期生成的 .pb.go，运行时构造请求</text>

<rect x="60" y="1098" width="10" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
<text x="80" y="1108" fill="#94a3b8" font-size="9">conn.Invoke 是标准 Unary RPC，和 reflection 完全解耦</text>

</svg>