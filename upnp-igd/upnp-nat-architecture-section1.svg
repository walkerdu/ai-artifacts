<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
    text { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
  </style>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
    <!-- 箭头 markers -->
    <marker id="a-upnp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4F46E5"/></marker>
    <marker id="a-nat" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#D97706"/></marker>
    <marker id="a-static" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DC2626"/></marker>
    <marker id="a-kernel" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <!-- 阴影 -->
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="780" fill="#FAFAFA"/>
  <rect width="1200" height="780" fill="url(#grid)"/>

  <!-- ==================== 端点 ==================== -->

  <!-- LAN 客户端 -->
  <rect x="30" y="115" width="160" height="110" rx="12" fill="#fff" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="110" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">LAN 客户端</text>
  <text x="110" y="162" text-anchor="middle" font-size="11" class="mono" fill="#64748B">192.168.1.10</text>
  <line x1="50" y1="172" x2="170" y2="172" stroke="#E2E8F0"/>
  <text x="110" y="192" text-anchor="middle" font-size="10" fill="#4F46E5">SOAP: AddPortMapping</text>
  <text x="110" y="208" text-anchor="middle" font-size="10" fill="#D97706">出站: 任意目标</text>

  <!-- WAN -->
  <rect x="1050" y="115" width="120" height="110" rx="12" fill="#fff" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1110" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">WAN</text>
  <text x="1110" y="162" text-anchor="middle" font-size="10" class="mono" fill="#64748B">203.0.113.5</text>
  <line x1="1068" y1="172" x2="1152" y2="172" stroke="#E2E8F0"/>
  <text x="1110" y="192" text-anchor="middle" font-size="10" fill="#4F46E5">入站 :8080</text>
  <text x="1110" y="208" text-anchor="middle" font-size="10" fill="#D97706">出站 ANY</text>

  <!-- ==================== Router 容器 ==================== -->
  <rect x="220" y="50" width="810" height="660" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="242" y="78" font-size="13" font-weight="800" fill="#0F172A" letter-spacing="2">ROUTER</text>
  <text x="242" y="94" font-size="10" class="mono" fill="#94A3B8">Linux · Netfilter</text>

  <!-- ==================== 应用层 ==================== -->
  <rect x="240" y="110" width="770" height="175" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="260" y="134" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.5">APPLICATION LAYER</text>

  <!-- miniupnpd -->
  <rect x="270" y="150" width="310" height="118" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="175" font-size="13" font-weight="700" fill="#4F46E5">miniupnpd</text>
  <text x="290" y="193" font-size="10" class="mono" fill="#64748B">UPnP IGD daemon · 独立映射表</text>
  <line x1="290" y1="202" x2="560" y2="202" stroke="#C7D2FE"/>
  <text x="290" y="220" font-size="10.5" fill="#312E81">• 应用层映射表 (UPnPMappingTable)</text>
  <text x="290" y="237" font-size="10.5" fill="#312E81">• 租期定时器 / 描述 / Enabled 状态</text>
  <text x="290" y="254" font-size="10.5" fill="#312E81">• libiptc / libnftnl 调内核接口</text>

  <!-- 静态规则 -->
  <rect x="600" y="150" width="185" height="118" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="616" y="175" font-size="13" font-weight="700" fill="#DC2626">静态规则</text>
  <text x="616" y="193" font-size="10" class="mono" fill="#64748B">/etc/config/firewall</text>
  <line x1="616" y1="202" x2="770" y2="202" stroke="#FCA5A5"/>
  <text x="616" y="220" font-size="10.5" fill="#7F1D1D">• 用户手工配置</text>
  <text x="616" y="237" font-size="10.5" fill="#7F1D1D">• 持久化存储</text>
  <text x="616" y="254" font-size="10.5" fill="#7F1D1D">• 优先级最高</text>

  <!-- PAT / NAPT -->
  <rect x="805" y="150" width="185" height="118" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="821" y="175" font-size="13" font-weight="700" fill="#D97706">PAT / NAPT</text>
  <text x="821" y="193" font-size="10" class="mono" fill="#64748B">出站自动伪装</text>
  <line x1="821" y1="202" x2="975" y2="202" stroke="#FCD34D"/>
  <text x="821" y="220" font-size="10.5" fill="#78350F">• 内核 SNAT/MASQ 规则</text>
  <text x="821" y="237" font-size="10.5" fill="#78350F">• 随机选择外部端口</text>
  <text x="821" y="254" font-size="10.5" fill="#78350F">• 无应用层元数据</text>

  <!-- ==================== Netfilter 层 ==================== -->
  <rect x="240" y="315" width="770" height="155" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="260" y="339" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.5">NETFILTER · iptables / nftables</text>

  <!-- nat / PREROUTING -->
  <rect x="270" y="354" width="340" height="100" rx="10" fill="#fff" stroke="#CBD5E1" filter="url(#sh)"/>
  <text x="288" y="377" font-size="12" font-weight="700" fill="#0F172A">nat / PREROUTING</text>
  <rect x="288" y="386" width="305" height="20" rx="4" fill="#FEE2E2"/>
  <text x="298" y="400" font-size="10" class="mono" fill="#7F1D1D">→ static DNAT  (priority 1)</text>
  <rect x="288" y="410" width="305" height="20" rx="4" fill="#EEF2FF"/>
  <text x="298" y="424" font-size="10" class="mono" fill="#312E81">→ jump MINIUPNPD  (priority 2)</text>
  <rect x="288" y="434" width="305" height="14" rx="4" fill="#F1F5F9"/>
  <text x="298" y="445" font-size="9" class="mono" fill="#475569">→ default / fallthrough</text>

  <!-- MINIUPNPD 自定义链 -->
  <rect x="630" y="354" width="365" height="100" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-dasharray="4 3" filter="url(#sh)"/>
  <text x="648" y="377" font-size="12" font-weight="700" fill="#4F46E5">MINIUPNPD 自定义链</text>
  <text x="648" y="393" font-size="10" class="mono" fill="#64748B">隔离的子链 · miniupnpd 原子更新</text>
  <rect x="648" y="402" width="332" height="20" rx="4" fill="#fff"/>
  <text x="658" y="416" font-size="9.5" class="mono" fill="#312E81">-p tcp --dport 8080 -j DNAT --to 192.168.1.10:80</text>
  <rect x="648" y="426" width="332" height="20" rx="4" fill="#fff"/>
  <text x="658" y="440" font-size="9.5" class="mono" fill="#312E81">-p udp --dport 5060 -j DNAT --to 192.168.1.20:5060</text>

  <!-- ==================== 内核层 ==================== -->
  <rect x="240" y="500" width="770" height="190" rx="14" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="260" y="524" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="1.5">KERNEL LAYER · nf_conntrack (共享)</text>
  <text x="260" y="541" font-size="10.5" fill="#0F766E">所有规则最终都在这里建立五元组连接条目，UPnP 与动态 NAT 在数据平面是统一的。</text>

  <!-- conntrack 表 -->
  <g class="mono" font-size="10">
    <rect x="270" y="556" width="720" height="22" rx="4" fill="#fff" stroke="#CCFBF1"/>
    <text x="282" y="572" fill="#475569">PROTO</text><text x="345" y="572" fill="#475569">SRC</text><text x="478" y="572" fill="#475569">DST</text><text x="598" y="572" fill="#475569">SPORT</text><text x="660" y="572" fill="#475569">DPORT</text><text x="726" y="572" fill="#475569">STATE</text><text x="840" y="572" fill="#475569">SOURCE</text>

    <rect x="270" y="580" width="720" height="22" rx="4" fill="#EEF2FF"/>
    <text x="282" y="596" fill="#312E81">tcp</text><text x="345" y="596" fill="#312E81">203.0.113.5</text><text x="478" y="596" fill="#312E81">192.168.1.10</text><text x="598" y="596" fill="#312E81">52301</text><text x="660" y="596" fill="#312E81">80</text><text x="726" y="596" fill="#312E81">ESTABLISHED</text><text x="840" y="596" fill="#4F46E5" font-weight="700">UPnP</text>

    <rect x="270" y="604" width="720" height="22" rx="4" fill="#FEF3C7"/>
    <text x="282" y="620" fill="#78350F">tcp</text><text x="345" y="620" fill="#78350F">192.168.1.30</text><text x="478" y="620" fill="#78350F">142.250.1.1</text><text x="598" y="620" fill="#78350F">49872</text><text x="660" y="620" fill="#78350F">443</text><text x="726" y="620" fill="#78350F">ESTABLISHED</text><text x="840" y="620" fill="#D97706" font-weight="700">DYN-NAT</text>

    <rect x="270" y="628" width="720" height="22" rx="4" fill="#FEE2E2"/>
    <text x="282" y="644" fill="#7F1D1D">tcp</text><text x="345" y="644" fill="#7F1D1D">198.51.100.7</text><text x="478" y="644" fill="#7F1D1D">192.168.1.5</text><text x="598" y="644" fill="#7F1D1D">61010</text><text x="660" y="644" fill="#7F1D1D">22</text><text x="726" y="644" fill="#7F1D1D">ESTABLISHED</text><text x="840" y="644" fill="#DC2626" font-weight="700">STATIC</text>

    <rect x="270" y="652" width="720" height="22" rx="4" fill="#fff" stroke="#E2E8F0"/>
    <text x="282" y="668" fill="#64748B">udp</text><text x="345" y="668" fill="#64748B">192.168.1.40</text><text x="478" y="668" fill="#64748B">8.8.8.8</text><text x="598" y="668" fill="#64748B">53321</text><text x="660" y="668" fill="#64748B">53</text><text x="726" y="668" fill="#64748B">ASSURED</text><text x="840" y="668" fill="#D97706" font-weight="700">DYN-NAT</text>
  </g>

  <!-- ==================== 箭头（全正交折线） ==================== -->

  <!-- ① UPnP 控制流：LAN → miniupnpd（左侧纵向通道 x=210） -->
  <path d="M190,170 L210,170 L210,210 L270,210" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a-upnp)"/>
  <rect x="195" y="182" width="22" height="44" rx="3" fill="#FAFAFA" fill-opacity="0.85"/>
  <text x="206" y="210" font-size="9" fill="#4F46E5" font-weight="700" text-anchor="middle" transform="rotate(-90,206,210)">① 申请映射</text>

  <!-- miniupnpd → MINIUPNPD 子链（层间通道） -->
  <path d="M425,268 L425,300 L812,300 L812,354" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-upnp)"/>
  <rect x="555" y="289" width="82" height="16" rx="3" fill="#FAFAFA" fill-opacity="0.85"/>
  <text x="596" y="301" font-size="9" fill="#4F46E5" font-weight="700" text-anchor="middle">② 写入子链</text>

  <!-- 静态规则 → PREROUTING（垂直下行，层间通道） -->
  <path d="M693,268 L693,300 L440,300 L440,354" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#a-static)"/>
  <rect x="500" y="289" width="50" height="16" rx="3" fill="#FAFAFA" fill-opacity="0.85"/>
  <text x="525" y="301" font-size="9" fill="#DC2626" font-weight="700" text-anchor="middle">写 DNAT</text>

  <!-- ③ 入站流：WAN → PREROUTING（右侧纵向通道 x=1040） -->
  <path d="M1050,170 L1040,170 L1040,404 L610,404" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#a-upnp)"/>
  <rect x="1015" y="270" width="50" height="16" rx="3" fill="#FAFAFA" fill-opacity="0.85"/>
  <text x="1040" y="282" font-size="9" fill="#4F46E5" font-weight="700" text-anchor="middle">③ 入站</text>

  <!-- PREROUTING jump → MINIUPNPD 子链（水平右行） -->
  <path d="M610,420 L630,420" fill="none" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#a-upnp)"/>

  <!-- 出站流：LAN → PAT（上方水平通道 y=102） -->
  <path d="M190,170 L205,170 L205,102 L898,102 L898,150" fill="none" stroke="#D97706" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#a-nat)"/>
  <rect x="460" y="90" width="175" height="18" rx="4" fill="#FAFAFA" fill-opacity="0.9"/>
  <text x="548" y="104" font-size="10" fill="#D97706" font-weight="700" text-anchor="middle">出站 → PAT 自动分配端口</text>

  <!-- PAT → conntrack（垂直下行） -->
  <path d="M898,268 L898,500" fill="none" stroke="#D97706" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#a-nat)"/>

  <!-- MINIUPNPD 子链 → conntrack（规则落地） -->
  <path d="M812,454 L812,500" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#a-kernel)"/>
  <text x="823" y="482" font-size="9" fill="#0F766E" font-weight="600">落地</text>

  <!-- conntrack → WAN（出站回包，右侧通道） -->
  <path d="M990,590 L1040,590 L1040,200 L1050,200" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#a-kernel)"/>
  <text x="1032" y="420" font-size="9" fill="#0F766E" font-weight="600" text-anchor="end">回包</text>

  <!-- ==================== 图例 ==================== -->
  <rect x="30" y="730" width="1140" height="38" rx="10" fill="#fff" stroke="#E2E8F0"/>
  <text x="55" y="754" font-size="10" font-weight="700" fill="#334155">数据流图例：</text>

  <line x1="140" y1="749" x2="170" y2="749" stroke="#4F46E5" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="178" y="754" font-size="10" font-weight="600" fill="#4F46E5">UPnP 控制</text>

  <line x1="280" y1="749" x2="310" y2="749" stroke="#4F46E5" stroke-width="2.4"/>
  <text x="318" y="754" font-size="10" font-weight="600" fill="#4F46E5">入站 DNAT</text>

  <line x1="420" y1="749" x2="450" y2="749" stroke="#D97706" stroke-width="2.4" stroke-dasharray="4 3"/>
  <text x="458" y="754" font-size="10" font-weight="600" fill="#D97706">出站伪装</text>

  <line x1="560" y1="749" x2="590" y2="749" stroke="#DC2626" stroke-width="2.4"/>
  <text x="598" y="754" font-size="10" font-weight="600" fill="#DC2626">静态优先</text>

  <line x1="690" y1="749" x2="720" y2="749" stroke="#0F766E" stroke-width="2.4"/>
  <text x="728" y="754" font-size="10" font-weight="600" fill="#0F766E">conntrack 落地</text>
</svg>
