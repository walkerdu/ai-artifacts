<svg viewBox="0 0 1080 860" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'PingFang SC', 'Helvetica Neue', 'Menlo', sans-serif; }
    .t-title { font-size: 17px; font-weight: 700; fill: #f1f5f9; }
    .t-sub   { font-size: 9px;  font-weight: 400; fill: #94a3b8; }
    .t-band  { font-size: 10px; font-weight: 600; fill: #cbd5e1; letter-spacing: 1px; }
    .t-name  { font-size: 12px; font-weight: 600; fill: #ffffff; }
    .t-desc  { font-size: 9px;  font-weight: 400; fill: #94a3b8; }
    .t-mono  { font-size: 8.5px; font-weight: 400; fill: #cbd5e1; }
    .t-flow  { font-size: 9px;  font-weight: 600; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/></marker>
    <marker id="a-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="a-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="42" class="t-title">UPnP 映射 vs NAT 动态映射 · 分层架构 &amp; 数据流</text>
  <text x="40" y="60" class="t-sub">ROUTER · Linux Netfilter / miniupnpd — 控制平面分离，数据平面统一于 nf_conntrack</text>

  <!-- ============ ARROWS (drawn first, behind boxes) ============ -->
  <!-- ① UPnP 控制流: LAN -> miniupnpd -->
  <path d="M 470,180 L 250,270" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a-cyan)"/>
  <!-- miniupnpd -> MINIUPNPD 子链 (写入规则) -->
  <path d="M 235,395 L 235,460" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a-cyan)"/>
  <!-- ② 入站转发流: WAN -> PREROUTING (far-right margin, avoids PAT) -->
  <path d="M 988,175 L 988,500 L 972,500" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <!-- PREROUTING -> MINIUPNPD 子链 (jump, R->L within band) -->
  <path d="M 560,545 L 504,545" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <!-- ③ 出站伪装流: LAN -> PAT -->
  <path d="M 590,180 L 835,270" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#a-orange)"/>
  <!-- PAT -> conntrack -->
  <path d="M 835,395 L 835,645" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#a-orange)"/>
  <!-- 静态规则 -> PREROUTING (priority 1 DNAT) -->
  <path d="M 540,395 L 700,460" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#a-rose)"/>
  <!-- MINIUPNPD 子链 -> conntrack (规则落地) -->
  <path d="M 300,575 L 300,645" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a-teal)"/>
  <!-- PREROUTING -> conntrack (命中后落地) -->
  <path d="M 820,575 L 820,640" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#a-blue)"/>

  <!-- arrow labels -->
  <text x="318" y="212" class="t-flow" fill="#22d3ee" text-anchor="middle">① 申请映射</text>
  <text x="252" y="432" class="t-flow" fill="#22d3ee">写入子链</text>
  <text x="998" y="345" class="t-flow" fill="#60a5fa" text-anchor="end">② 入站 :8080</text>
  <text x="532" y="538" class="t-flow" fill="#60a5fa" text-anchor="middle">jump MINIUPNPD</text>
  <text x="700" y="214" class="t-flow" fill="#fb923c" text-anchor="middle">③ 出站 → PAT 分配端口</text>
  <text x="852" y="525" class="t-flow" fill="#fb923c">建立 conntrack</text>
  <text x="600" y="438" class="t-flow" fill="#fb7185">priority1 DNAT</text>
  <text x="312" y="618" class="t-flow" fill="#34d399">规则落地</text>

  <!-- ============ ENDPOINTS ============ -->
  <!-- LAN client (center-top) -->
  <rect x="430" y="90" width="200" height="92" rx="8" fill="#0f172a"/>
  <rect x="430" y="90" width="200" height="92" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="116" class="t-name" text-anchor="middle">LAN 客户端</text>
  <text x="530" y="134" class="t-mono" text-anchor="middle">192.168.1.10</text>
  <line x1="450" y1="144" x2="610" y2="144" stroke="#1e3a4a"/>
  <text x="530" y="160" class="t-desc" text-anchor="middle" fill="#67e8f9">SOAP AddPortMapping</text>
  <text x="530" y="174" class="t-desc" text-anchor="middle" fill="#fdba74">主动出站连接</text>

  <!-- WAN (right-top) -->
  <rect x="850" y="90" width="190" height="92" rx="8" fill="#0f172a"/>
  <rect x="850" y="90" width="190" height="92" rx="8" fill="rgba(30,41,59,0.6)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="945" y="116" class="t-name" text-anchor="middle">WAN / 公网</text>
  <text x="945" y="134" class="t-mono" text-anchor="middle">203.0.113.5</text>
  <line x1="870" y1="144" x2="1020" y2="144" stroke="#334155"/>
  <text x="945" y="160" class="t-desc" text-anchor="middle" fill="#93c5fd">入站 → :8080</text>
  <text x="945" y="174" class="t-desc" text-anchor="middle" fill="#6ee7b7">出站回包</text>

  <!-- ============ ROUTER CONTAINER ============ -->
  <rect x="40" y="222" width="1000" height="600" rx="14" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="12,4"/>
  <text x="58" y="244" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="2">ROUTER · LINUX NETFILTER</text>

  <!-- ===== APPLICATION LAYER ===== -->
  <rect x="70" y="256" width="940" height="158" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="84" y="276" class="t-band">APPLICATION LAYER · 控制平面</text>

  <!-- miniupnpd -->
  <rect x="100" y="288" width="270" height="110" rx="6" fill="#0f172a"/>
  <rect x="100" y="288" width="270" height="110" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="116" y="312" class="t-name" fill="#67e8f9">miniupnpd</text>
  <text x="116" y="328" class="t-desc">UPnP IGD daemon · 独立映射表</text>
  <line x1="116" y1="338" x2="354" y2="338" stroke="#164e63"/>
  <text x="116" y="356" class="t-desc" fill="#cbd5e1">• UPnPMappingTable 应用层表</text>
  <text x="116" y="372" class="t-desc" fill="#cbd5e1">• 租期定时器 / 描述 / Enabled</text>
  <text x="116" y="388" class="t-desc" fill="#cbd5e1">• libiptc / libnftnl 调内核</text>

  <!-- 静态规则 -->
  <rect x="410" y="288" width="210" height="110" rx="6" fill="#0f172a"/>
  <rect x="410" y="288" width="210" height="110" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="426" y="312" class="t-name" fill="#fda4af">静态规则</text>
  <text x="426" y="328" class="t-desc">/etc/config/firewall</text>
  <line x1="426" y1="338" x2="604" y2="338" stroke="#881337"/>
  <text x="426" y="356" class="t-desc" fill="#cbd5e1">• 用户手工配置 · 持久化</text>
  <text x="426" y="372" class="t-desc" fill="#cbd5e1">• 重启自动加载</text>
  <text x="426" y="388" class="t-desc" fill="#fda4af">• 优先级最高 priority 1</text>

  <!-- PAT / NAPT -->
  <rect x="700" y="288" width="270" height="110" rx="6" fill="#0f172a"/>
  <rect x="700" y="288" width="270" height="110" rx="6" fill="rgba(120,53,15,0.35)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="716" y="312" class="t-name" fill="#fdba74">PAT / NAPT 引擎</text>
  <text x="716" y="328" class="t-desc">出站自动伪装</text>
  <line x1="716" y1="338" x2="954" y2="338" stroke="#7c2d12"/>
  <text x="716" y="356" class="t-desc" fill="#cbd5e1">• 内核 SNAT / MASQUERADE</text>
  <text x="716" y="372" class="t-desc" fill="#cbd5e1">• 随机选择外部端口</text>
  <text x="716" y="388" class="t-desc" fill="#cbd5e1">• 无应用层元数据</text>

  <!-- ===== NETFILTER LAYER ===== -->
  <rect x="70" y="446" width="940" height="158" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="84" y="466" class="t-band">NETFILTER · iptables / nftables · 规则平面</text>

  <!-- MINIUPNPD 子链 (left, under miniupnpd) -->
  <rect x="100" y="478" width="404" height="110" rx="6" fill="#0f172a"/>
  <rect x="100" y="478" width="404" height="110" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="116" y="502" class="t-name" fill="#67e8f9">MINIUPNPD 自定义子链</text>
  <text x="116" y="518" class="t-desc">隔离子链 · miniupnpd 原子更新</text>
  <rect x="116" y="528" width="372" height="22" rx="3" fill="rgba(15,23,42,0.8)"/>
  <text x="124" y="543" class="t-mono">-p tcp --dport 8080 -j DNAT --to 192.168.1.10:80</text>
  <rect x="116" y="556" width="372" height="22" rx="3" fill="rgba(15,23,42,0.8)"/>
  <text x="124" y="571" class="t-mono">-p udp --dport 5060 -j DNAT --to 192.168.1.20:5060</text>

  <!-- nat/PREROUTING (right, under WAN inbound) -->
  <rect x="560" y="478" width="412" height="110" rx="6" fill="#0f172a"/>
  <rect x="560" y="478" width="412" height="110" rx="6" fill="rgba(59,130,246,0.28)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="576" y="502" class="t-name" fill="#93c5fd">nat / PREROUTING（入站匹配链）</text>
  <rect x="576" y="512" width="380" height="20" rx="3" fill="rgba(136,19,55,0.35)"/>
  <text x="584" y="526" class="t-mono" fill="#fda4af">1 → static DNAT        (priority 1)</text>
  <rect x="576" y="536" width="380" height="20" rx="3" fill="rgba(8,51,68,0.55)"/>
  <text x="584" y="550" class="t-mono" fill="#67e8f9">2 → jump MINIUPNPD     (priority 2)</text>
  <rect x="576" y="560" width="380" height="18" rx="3" fill="rgba(30,41,59,0.7)"/>
  <text x="584" y="573" class="t-mono" fill="#94a3b8">3 → default / fallthrough</text>

  <!-- ===== KERNEL LAYER ===== -->
  <rect x="70" y="636" width="940" height="166" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="84" y="656" class="t-band" fill="#a78bfa">KERNEL · nf_conntrack（共享数据平面）</text>
  <text x="84" y="671" class="t-desc">所有规则最终都在此建立五元组连接条目，UPnP 与动态 NAT 在数据平面统一</text>

  <rect x="100" y="680" width="870" height="110" rx="6" fill="#0f172a"/>
  <rect x="100" y="680" width="870" height="110" rx="6" fill="rgba(76,29,149,0.32)" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- table header -->
  <text x="116" y="700" class="t-mono" fill="#c4b5fd">PROTO    SRC               DST               DPORT   STATE          SOURCE</text>
  <line x1="116" y1="706" x2="954" y2="706" stroke="#4c1d95"/>
  <rect x="116" y="712" width="838" height="18" rx="3" fill="rgba(8,51,68,0.5)"/>
  <text x="116" y="725" class="t-mono" fill="#67e8f9">tcp      203.0.113.5       192.168.1.10      80      ESTABLISHED    UPnP</text>
  <rect x="116" y="732" width="838" height="18" rx="3" fill="rgba(120,53,15,0.3)"/>
  <text x="116" y="745" class="t-mono" fill="#fdba74">tcp      192.168.1.30      142.250.1.1       443     ESTABLISHED    DYN-NAT</text>
  <rect x="116" y="752" width="838" height="18" rx="3" fill="rgba(136,19,55,0.3)"/>
  <text x="116" y="765" class="t-mono" fill="#fda4af">tcp      198.51.100.7      192.168.1.5       22      ESTABLISHED    STATIC</text>
  <rect x="116" y="772" width="838" height="16" rx="3" fill="rgba(30,41,59,0.6)"/>
  <text x="116" y="784" class="t-mono" fill="#94a3b8">udp      192.168.1.40      8.8.8.8           53      ASSURED        DYN-NAT</text>

  <!-- ============ LEGEND (bottom) ============ -->
  <text x="40" y="844" class="t-flow" fill="#94a3b8">数据流：</text>
  <line x1="92" y1="840" x2="122" y2="840" stroke="#22d3ee" stroke-width="2.2" stroke-dasharray="5,4"/>
  <text x="128" y="844" class="t-flow" fill="#22d3ee">① UPnP 控制</text>
  <line x1="222" y1="840" x2="252" y2="840" stroke="#60a5fa" stroke-width="2.2"/>
  <text x="258" y="844" class="t-flow" fill="#60a5fa">② 入站转发</text>
  <line x1="348" y1="840" x2="378" y2="840" stroke="#fb923c" stroke-width="2.2" stroke-dasharray="3,3"/>
  <text x="384" y="844" class="t-flow" fill="#fb923c">③ 出站伪装</text>
  <line x1="474" y1="840" x2="504" y2="840" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="6,3"/>
  <text x="510" y="844" class="t-flow" fill="#fb7185">静态 DNAT</text>
  <line x1="588" y1="840" x2="618" y2="840" stroke="#34d399" stroke-width="2.2"/>
  <text x="624" y="844" class="t-flow" fill="#34d399">规则落地 conntrack</text>
</svg>
