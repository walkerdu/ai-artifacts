<svg viewBox="0 0 1180 820" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .layer-title { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 1.5px; }
    .box-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .box-sub { font-size: 10px; fill: #64748b; }
    .item { font-size: 10.5px; fill: #334155; }
    .mono { font-size: 9.5px; fill: #334155; }
    .arrow-label { font-size: 10px; font-weight: 700; }
    .legend { font-size: 10px; font-weight: 600; fill: #334155; }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-upnp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4f46e5"/></marker>
    <marker id="arr-in" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr-nat" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d97706"/></marker>
    <marker id="arr-static" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="arr-kernel" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1180" height="820" fill="#f8fafc"/>
  <rect width="1180" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="50" y="46" class="title">UPnP 映射 vs NAT 动态映射 · 第一部分重画</text>
  <text x="50" y="69" class="subtitle">浅色主题 · 正交箭头 · 三条主流程分离：UPnP 控制 / 入站 DNAT / 出站 PAT</text>

  <!-- External endpoints -->
  <g filter="url(#shadow)">
    <rect x="70" y="105" width="185" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="162.5" y="132" class="box-title" text-anchor="middle">LAN 客户端</text>
    <text x="162.5" y="152" class="mono" text-anchor="middle">192.168.1.10</text>
    <line x1="95" y1="164" x2="230" y2="164" stroke="#e2e8f0"/>
    <text x="162.5" y="181" class="box-sub" text-anchor="middle" fill="#4f46e5">SOAP AddPortMapping</text>
    <text x="162.5" y="195" class="box-sub" text-anchor="middle" fill="#d97706">主动出站连接</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="105" width="185" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1017.5" y="132" class="box-title" text-anchor="middle">WAN / 公网</text>
    <text x="1017.5" y="152" class="mono" text-anchor="middle">203.0.113.5</text>
    <line x1="950" y1="164" x2="1085" y2="164" stroke="#e2e8f0"/>
    <text x="1017.5" y="181" class="box-sub" text-anchor="middle" fill="#2563eb">入站 → :8080</text>
    <text x="1017.5" y="195" class="box-sub" text-anchor="middle" fill="#0f766e">出站回包</text>
  </g>

  <!-- Router boundary -->
  <rect x="50" y="235" width="1080" height="500" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="72" y="260" class="layer-title">ROUTER · LINUX NETFILTER</text>

  <!-- Layer boundaries -->
  <rect x="75" y="278" width="1030" height="122" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="92" y="301" class="layer-title">APPLICATION LAYER · 控制平面</text>

  <rect x="75" y="430" width="1030" height="122" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="92" y="453" class="layer-title">NETFILTER · iptables / nftables · 规则平面</text>

  <rect x="75" y="582" width="1030" height="128" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="92" y="605" class="layer-title" fill="#0f766e">KERNEL · nf_conntrack（共享数据平面）</text>

  <!-- ===== Arrows: straight / orthogonal, behind boxes but above regions ===== -->
  <!-- UPnP control: LAN -> miniupnpd -->
  <path d="M 255 153 L 185 153 L 185 322 L 205 322" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arr-upnp)"/>
  <rect x="117" y="225" width="91" height="18" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="162.5" y="238" class="arrow-label" fill="#4f46e5" text-anchor="middle">① 申请映射</text>

  <!-- miniupnpd -> MINIUPNPD chain -->
  <path d="M 335 375 L 335 458" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arr-upnp)"/>
  <rect x="348" y="410" width="75" height="18" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="385.5" y="423" class="arrow-label" fill="#4f46e5" text-anchor="middle">写入子链</text>

  <!-- Static -> PREROUTING -->
  <path d="M 590 375 L 590 433" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-static)"/>
  <rect x="603" y="405" width="94" height="18" rx="9" fill="#ffffff" stroke="#fecaca"/>
  <text x="650" y="418" class="arrow-label" fill="#dc2626" text-anchor="middle">priority 1</text>

  <!-- WAN inbound -> PREROUTING: right vertical lane, no crossing -->
  <path d="M 1017.5 201 L 1017.5 484 L 876 484" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arr-in)"/>
  <rect x="973" y="321" width="88" height="18" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1017" y="334" class="arrow-label" fill="#2563eb" text-anchor="middle">② 入站 :8080</text>

  <!-- PREROUTING -> MINIUPNPD jump: horizontal inside same layer -->
  <path d="M 635 500 L 482 500" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arr-in)"/>
  <rect x="527" y="477" width="67" height="18" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="560.5" y="490" class="arrow-label" fill="#2563eb" text-anchor="middle">jump</text>

  <!-- LAN outbound -> PAT: upper lane, enters PAT from top, away from UPnP path -->
  <path d="M 255 179 L 842 179 L 842 281" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#arr-nat)"/>
  <rect x="475" y="166" width="145" height="18" rx="9" fill="#ffffff" stroke="#fde68a"/>
  <text x="547.5" y="179" class="arrow-label" fill="#d97706" text-anchor="middle">③ 出站 → PAT 分配端口</text>

  <!-- PAT -> conntrack -->
  <path d="M 842 375 L 842 582" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#arr-nat)"/>
  <rect x="856" y="520" width="102" height="18" rx="9" fill="#ffffff" stroke="#fde68a"/>
  <text x="907" y="533" class="arrow-label" fill="#d97706" text-anchor="middle">建立动态条目</text>

  <!-- MINIUPNPD -> conntrack -->
  <path d="M 335 528 L 335 582" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-kernel)"/>
  <rect x="348" y="556" width="75" height="18" rx="9" fill="#ffffff" stroke="#99f6e4"/>
  <text x="385.5" y="569" class="arrow-label" fill="#0f766e" text-anchor="middle">规则落地</text>

  <!-- PREROUTING -> conntrack (match result) -->
  <path d="M 755 528 L 755 582" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-opacity="0.65" marker-end="url(#arr-in)"/>

  <!-- ===== Boxes: Application ===== -->
  <g filter="url(#shadow)">
    <rect x="205" y="312" width="260" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="335" y="337" class="box-title" fill="#3730a3" text-anchor="middle">miniupnpd</text>
    <text x="335" y="355" class="box-sub" text-anchor="middle">UPnP IGD daemon · 独立映射表</text>
    <text x="335" y="369" class="mono" text-anchor="middle">lease / description / enabled</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="312" width="180" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="590" y="337" class="box-title" fill="#991b1b" text-anchor="middle">静态规则</text>
    <text x="590" y="355" class="box-sub" text-anchor="middle">/etc/config/firewall</text>
    <text x="590" y="369" class="mono" text-anchor="middle">highest priority</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="312" width="205" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="842.5" y="337" class="box-title" fill="#92400e" text-anchor="middle">PAT / NAPT 引擎</text>
    <text x="842.5" y="355" class="box-sub" text-anchor="middle">出站自动伪装</text>
    <text x="842.5" y="369" class="mono" text-anchor="middle">SNAT / MASQUERADE</text>
  </g>

  <!-- ===== Boxes: Netfilter ===== -->
  <g filter="url(#shadow)">
    <rect x="188" y="464" width="294" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="335" y="486" class="box-title" fill="#3730a3" text-anchor="middle">MINIUPNPD 自定义子链</text>
    <text x="335" y="503" class="mono" text-anchor="middle">tcp :8080 → 192.168.1.10:80</text>
    <text x="335" y="518" class="mono" text-anchor="middle">udp :5060 → 192.168.1.20:5060</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="635" y="464" width="241" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="755.5" y="486" class="box-title" fill="#1d4ed8" text-anchor="middle">nat / PREROUTING</text>
    <text x="755.5" y="503" class="mono" text-anchor="middle">1 static DNAT</text>
    <text x="755.5" y="518" class="mono" text-anchor="middle">2 jump MINIUPNPD</text>
  </g>

  <!-- ===== Conntrack table ===== -->
  <g filter="url(#shadow)">
    <rect x="130" y="622" width="920" height="68" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <text x="150" y="646" class="mono" font-weight="700" fill="#0f766e">PROTO</text>
    <text x="220" y="646" class="mono" font-weight="700" fill="#0f766e">SRC</text>
    <text x="390" y="646" class="mono" font-weight="700" fill="#0f766e">DST</text>
    <text x="560" y="646" class="mono" font-weight="700" fill="#0f766e">DPORT</text>
    <text x="660" y="646" class="mono" font-weight="700" fill="#0f766e">STATE</text>
    <text x="835" y="646" class="mono" font-weight="700" fill="#0f766e">SOURCE</text>
    <line x1="145" y1="653" x2="1035" y2="653" stroke="#ccfbf1"/>
    <text x="150" y="672" class="mono" fill="#3730a3">tcp</text><text x="220" y="672" class="mono" fill="#3730a3">203.0.113.5</text><text x="390" y="672" class="mono" fill="#3730a3">192.168.1.10</text><text x="560" y="672" class="mono" fill="#3730a3">80</text><text x="660" y="672" class="mono" fill="#3730a3">ESTABLISHED</text><text x="835" y="672" class="mono" fill="#4f46e5" font-weight="700">UPnP</text>
    <text x="150" y="686" class="mono" fill="#92400e">tcp</text><text x="220" y="686" class="mono" fill="#92400e">192.168.1.30</text><text x="390" y="686" class="mono" fill="#92400e">142.250.1.1</text><text x="560" y="686" class="mono" fill="#92400e">443</text><text x="660" y="686" class="mono" fill="#92400e">ESTABLISHED</text><text x="835" y="686" class="mono" fill="#d97706" font-weight="700">DYN-NAT</text>
  </g>

  <!-- Notes -->
  <rect x="70" y="748" width="1040" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="92" y="775" class="item" font-weight="700" fill="#0f172a">读图顺序：</text>
  <text x="164" y="775" class="item">UPnP 控制流只负责“创建规则”；入站流先走 PREROUTING 再 jump 到 MINIUPNPD；出站流由 PAT 自动建 conntrack，三条主线互不相交。</text>

  <!-- Legend -->
  <g transform="translate(50, 805)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#4f46e5" stroke-width="2.4" stroke-dasharray="6 5"/>
    <text x="42" y="4" class="legend" fill="#4f46e5">UPnP 控制</text>
    <line x1="150" y1="0" x2="184" y2="0" stroke="#2563eb" stroke-width="2.6"/>
    <text x="192" y="4" class="legend" fill="#2563eb">入站转发</text>
    <line x1="300" y1="0" x2="334" y2="0" stroke="#d97706" stroke-width="2.4" stroke-dasharray="4 4"/>
    <text x="342" y="4" class="legend" fill="#d97706">出站伪装</text>
    <line x1="450" y1="0" x2="484" y2="0" stroke="#dc2626" stroke-width="2.2"/>
    <text x="492" y="4" class="legend" fill="#dc2626">静态优先</text>
    <line x1="600" y1="0" x2="634" y2="0" stroke="#0f766e" stroke-width="2.4"/>
    <text x="642" y="4" class="legend" fill="#0f766e">conntrack 落地</text>
  </g>
</svg>
